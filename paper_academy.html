      {q:'MuZero eliminated the last piece of external information compared to AlphaZero. What was it?',
       opts:['The reward signal — MuZero learned without wins or losses','MuZero learned the rules of the game internally, whereas AlphaZero was given the rules explicitly','MuZero eliminated the neural network and used pure search','MuZero needed no GPU hardware'],
       correct:1,
       explain:['Without a reward signal, there is nothing to learn from. MuZero still uses wins/losses (rewards) — it just doesn\'t need to be told which moves are legal.',null,'AlphaZero knew which moves were legal at each board state. MuZero built an internal model of the game dynamics — learning what moves are possible and what their consequences are, from experience. It achieved superhuman performance in Go, chess, shogi, AND Atari games without game-specific rules being provided.','Neural networks are central to MuZero. The key innovation was the learned world model (predicting next state and reward) replacing the explicit rules engine.','Hardware requirements for MuZero were substantial — this was not about efficiency.']},
    ]
  },

  {
    id:'alphafold', title:'AlphaFold 2', shortTitle:'AlphaFold', year:2021,
    authors:'Jumper, Evans, Pritzel, Green, Hassabis et al. · DeepMind',
    venue:'Nature 2021 · Nobel Prize in Chemistry 2024', category:'Reinforcement Learning', prereqs:['alphago','transformer'],
    icon:'🧬', tagline:'Solving a 50-year biology problem with AI',
    lesson:[
      {h:'The Protein Folding Problem',body:`Proteins are chains of amino acids (up to thousands of them) that fold into 3D structures. The structure determines the function. A misfolded protein can cause Parkinson's, Alzheimer's, cystic fibrosis. Understanding drug targets requires knowing structure.

The problem: given a sequence of amino acids (the 1D string), predict the 3D structure. Experimental methods (X-ray crystallography, cryo-EM) are expensive and slow — solving one protein can take years. The "protein folding problem" was considered one of biology's grand challenges. In 50 years, humanity had solved ~170,000 structures.`},
      {h:'What AlphaFold Did',body:`AlphaFold 2 predicted protein structures with accuracy competitive with experimental methods — essentially solving the protein folding problem computationally.

The architecture is a transformer-based "Evoformer" module that processes:
<ul>
<li>Multiple Sequence Alignments (MSA) — evolutionary relatives of the target protein</li>
<li>Pairwise residue features — geometric relationships between pairs of amino acids</li>
</ul>
The Evoformer runs attention over both sequences and residue pairs simultaneously, building up a geometric understanding that culminates in 3D coordinate prediction.`,callout:`DeepMind released the AlphaFold Protein Structure Database in 2022 with predicted structures for 200 million+ proteins — virtually every protein known to science. Downloaded by 1.5 million researchers in the first month.`},
      {h:'The Nobel Prize',body:`In October 2024, the Nobel Prize in Chemistry was awarded to Demis Hassabis and John Jumper (AlphaFold) and David Baker (protein design). The Nobel Committee called it "a decades-long dream of bioscientists."

This is the first time an AI system — and specifically a transformer-based deep learning model — directly received a Nobel Prize. It validated the use of AI as a genuine scientific tool, not just an engineering one.`},
      {h:'The Startup Wave',body:`AlphaFold spawned an entire industry:
<ul>
<li><strong>Isomorphic Labs:</strong> DeepMind spinout; $600M raised; $3B in Novartis/Eli Lilly partnerships. Mission: drug discovery using AlphaFold-derived structures.</li>
<li><strong>Latent Labs:</strong> AlphaFold2 co-developer Simon Kohl; protein design (not just prediction); 91-100% hit rates on macrocycles.</li>
<li><strong>Inceptive:</strong> Transformer co-author Jakob Uszkoreit; RNA design using the same sequence modeling principles.</li>
</ul>
The pattern: transformer + biology = an entirely new drug discovery paradigm.`}
    ],
    questions:[
      {q:'What specifically did AlphaFold solve, and why was it considered a grand challenge?',
       opts:['AlphaFold created new proteins that don\'t exist in nature','AlphaFold predicted the 3D structure of proteins from their amino acid sequence — a problem unsolved for 50 years because the folding search space is astronomically large','AlphaFold designed drugs that target specific proteins','AlphaFold sequenced the human genome more accurately'],
       correct:1,
       explain:['AlphaFold predicts structure from sequence — it doesn\'t design new proteins. That\'s the next step, which Latent Labs and other spinouts are working on.',null,'The number of possible 3D conformations a protein can take is estimated at 10^300. Experimental methods (X-ray crystallography, cryo-EM) are slow and expensive — one structure can take years. AlphaFold reduced this to minutes of compute with accuracy matching experiments. Demis Hassabis and John Jumper received the Nobel Prize in Chemistry 2024 for this.','Drug design is downstream of structure prediction. AlphaFold predicts structure; Isomorphic Labs uses those predictions for drug discovery. They are separate problems.','Genome sequencing (reading DNA) is a different problem from protein structure prediction. AlphaFold works with amino acid sequences (protein building blocks), not DNA.']},
      {q:'AlphaFold\'s Evoformer processes Multiple Sequence Alignments (MSAs). Why are evolutionary relatives useful for structure prediction?',
       opts:['More sequences mean more training data for the neural network','Proteins that are evolutionarily related tend to share structural features — correlated mutations across species reveal which residues must be spatially close','MSAs allow AlphaFold to predict structures for all species simultaneously','Evolutionary data provides experimental ground truth to validate predictions'],
       correct:1,
       explain:['MSA sequences are input to Evoformer, not training examples. They provide evolutionary context, not additional training data.',null,'If position 10 and position 50 in a protein always mutate together across thousands of species, those positions are probably physically adjacent — a mutation at one creates evolutionary pressure for a compensating mutation at the other. Correlated mutations reveal spatial proximity. AlphaFold uses this signal to constrain the 3D structure prediction.','AlphaFold predicts the structure of the target protein using its evolutionary relatives as evidence. It doesn\'t predict all relatives\' structures simultaneously.','Experimental structures are used as training labels during AlphaFold\'s training. MSAs are input features at inference time, not validation data.']},
    ]
  },

  {
    id:'saycan', title:'SayCan + RT-2', shortTitle:'LLM→Robots', year:2022,
    authors:'Ahn, Brohan, Finn, Hausman, Ichter et al. · Google Brain Robotics',
    venue:'arXiv 2022 / Science Robotics 2023', category:'Applications', prereqs:['transformer','alphago'],
    icon:'🤖', tagline:'Language models learn to control physical robots',
    lesson:[
      {h:'The Gap: Language Models Can\'t Act',body:`By 2022, LLMs could write code, answer questions, and translate text. But they had no connection to the physical world. A robot needs to go from "get me a snack from the kitchen" to a sequence of motor actions — pick up the bottle, open the fridge, grasp the handle, etc. LLMs know what steps to take. They don't know which steps are physically possible in the current environment.`},
      {h:'SayCan: LLMs + Affordance Functions',body:`SayCan (2022) combined two signals:
<ul>
<li><strong>LLM scores:</strong> How plausible is this action given the task? ("get a Coke" → "open fridge" scores high)</li>
<li><strong>Affordance scores:</strong> How executable is this action right now? (robot checks if it can actually reach the fridge)</li>
</ul>
The combined score selects actions at each step. The robot asks the LLM what to do, filters by physical feasibility, and executes.

Result: a real robot in a real kitchen completing 101 tasks ("I spilled my drink, can you bring me something to clean it up?") with 84% success.`,callout:`SayCan showed that an LLM trained purely on text can guide a physical robot — by treating robot actions as tokens in a language, and leveraging the LLM's world knowledge about what action sequences make sense.`},
      {h:'RT-1 and RT-2: End-to-End',body:`SayCan used a separate affordance model. RT-1 (2022) went further: train one model on 130,000 robot demonstration episodes across 700+ tasks. Input: language instruction + camera image. Output: robot arm movements.

RT-2 (2023) used a vision-language model (trained on internet text + images) and fine-tuned it to output robot actions. The robot can understand novel objects ("move the extinct animal to the green cube") because its representations encode internet knowledge about dinosaurs.`,callout_green:`RT-2 is the moment the transformer's world knowledge transferred to physical robots. Physical Intelligence (pi-zero) is the direct commercialization of this research.`},
      {h:'Physical Intelligence and What\'s Next',body:`Former Google Brain robotics researchers Karol Hausman, Chelsea Finn, and Brian Ichter co-founded Physical Intelligence in 2024. Their pi-zero model folds laundry, assembles products, and sorts objects. $1.1B raised.

The trajectory: AlexNet (2012) proved CNNs work on images → Transformer (2017) proved attention works on language → SayCan/RT-2 (2022-23) proved transformers work on physical actions → Physical Intelligence (2024) productizes this. 12 years from computer vision to robot manipulation.`}
    ],
    questions:[
      {q:'What is the "affordance" problem that SayCan solved by combining LLMs with physical feasibility scores?',
       opts:['LLMs don\'t know English — affordance provides language grounding','LLMs have world knowledge about what actions make sense, but don\'t know what\'s currently executable in the environment — affordance scores filter for physical feasibility','Affordance means the robot can afford to buy items it\'s asked to fetch','LLMs are too slow for real-time robot control — affordance scores pre-compute fast decisions'],
       correct:1,
       explain:['LLMs are trained on text and understand English naturally. The gap is not language but physical grounding.',null,'An LLM might suggest "open the blue cabinet" when no blue cabinet exists in the room. The affordance model evaluates each candidate action against the current sensor state — only actions that are physically possible in THIS environment right now receive high affordance scores. SayCan multiplies LLM likelihood × affordance probability, grounding abstract plans in current physical reality.','Affordance in robotics refers to "what actions can be performed with what objects in what environments" — a technical term, not a financial one.','SayCan uses the LLM for planning (not real-time control). Affordance models score physical feasibility, not speed. Low-level motor control runs at high frequency separately from the LLM planning loop.']},
      {q:'RT-2 fine-tuned a vision-language model to output robot actions. What is the key advantage of this approach over training a robot model from scratch?',
       opts:['It requires less computational power to train','The model inherits internet-scale world knowledge — it can manipulate novel objects it has never seen in robot training but has seen described online','Training from scratch gives more accurate motor control','Robot-specific training data is easier to collect than internet data'],
       correct:1,
       explain:['Fine-tuning large pre-trained models typically requires significant compute. The advantage is what the model knows, not how cheap it is to train.',null,'A robot trained only on robot demonstration data has no concept of "dinosaur" or "extinct animal." RT-2, trained on internet-scale vision-language data before robot fine-tuning, already has rich representations of millions of object categories. When asked to move "the extinct animal," it correctly identifies a dinosaur toy even if no dinosaur appeared in robot training — because it saw dinosaurs described and depicted online.','High-frequency motor control is handled by separate low-level controllers. The vision-language model outputs high-level action tokens (gripper position, arm trajectory), which are converted by low-level controllers. Neither approach gives more inherently accurate motor control at the hardware level.','Robot demonstration data is extremely expensive and time-consuming to collect — teleoperators must manually perform each task. Internet text+image data is abundant and cheap. This is precisely why leveraging pre-training is so valuable.']},
    ]
  },

  {
    id:'constitutional', title:'Constitutional AI / RLHF', shortTitle:'RLHF + CAI', year:2022,
    authors:'Bai et al. (Anthropic) · Christiano et al. (OpenAI/Google Brain)',
    venue:'arXiv 2022', category:'Applications', prereqs:['gpt'],
    icon:'🛡️', tagline:'Teaching AI to be helpful, harmless, honest',
    lesson:[
      {h:'The Alignment Problem',body:`By 2020, GPT-3 was generating coherent text on any topic — including harmful, false, and dangerous content. A raw language model optimizes for "predict the next token from internet text." The internet contains instructions for harm. An assistant trained purely on language modeling is not safe to deploy.

The challenge: make a model helpful to users while refusing harmful requests, without making it so cautious it becomes useless.`},
      {h:'RLHF: Reinforcement Learning from Human Feedback',body:`The key technique (pioneered by Christiano et al. at OpenAI, with Google Brain roots):
<ol>
<li><strong>Supervised fine-tuning:</strong> Train the base LLM to follow instructions using human-written demonstrations.</li>
<li><strong>Reward model:</strong> Have humans rank model outputs. Train a neural network to predict human preference scores.</li>
<li><strong>RL optimization:</strong> Use PPO (Proximal Policy Optimization) to fine-tune the LLM to maximize the reward model's scores.</li>
</ol>
InstructGPT (2022, OpenAI) and ChatGPT are built on RLHF. The model learns to produce outputs humans prefer — generally more helpful, less harmful.`,callout:`Problem: RLHF requires massive human labeling. For every training step, humans must rank pairs of model outputs. At scale, this is expensive and slow.`},
      {h:'Constitutional AI: AI Feedback Replacing Human Feedback',body:`Anthropic's Constitutional AI (2022) replaced much of the human feedback loop with AI feedback:
<ol>
<li>Write a "constitution" — a set of principles ("don't produce content that harms children," "prefer answers that are honest")</li>
<li>Have the AI critique its own outputs against the constitution</li>
<li>Have the AI revise based on the critique</li>
<li>Use the revised outputs as training data</li>
</ol>
This is "RLAIF" — Reinforcement Learning from AI Feedback. Much cheaper and more scalable than human feedback. Claude is trained with Constitutional AI.`},
      {h:'Why This Research Matters Beyond Safety',body:`RLHF and CAI are general-purpose techniques for steering model behavior. The same approach is used for:
<ul>
<li>Code generation (reward model = does the code pass unit tests?)</li>
<li>Math reasoning (reward model = is the answer correct?)</li>
<li>Medical advice (reward model = does a doctor approve?)</li>
</ul>
The insight that you can train AI to optimize for a learned reward signal — rather than just predicting text — is what enabled models that are genuinely useful vs. just statistically plausible.`}
    ],
    questions:[
      {q:'Why can\'t you simply train a language model on instruction-following data without RLHF and get a safe, helpful assistant?',
       opts:['Instruction data is always too small for language models to learn from','A model trained on next-token prediction from internet data may generate harmful, false, or unhelpful content even when given instructions, because its training objective was statistical text prediction, not helpfulness','RLHF is required for a model to understand language','Instruction training data is illegal to collect'],
       correct:1,
       explain:['Instruction datasets can be large (100k+ examples). Size is not the fundamental problem.',null,'The training objective mismatch is the core issue. A raw LLM is excellent at producing statistically plausible text — which includes plausible-sounding harmful content, confident-sounding misinformation, and unhelpful evasiveness. RLHF adds a second optimization target: human preference. The model learns to optimize for what humans actually want, not just what text the internet contains.','Language understanding comes from pre-training. RLHF doesn\'t teach language — it steers behavior.','Instruction data is collected from human contractors, researchers, or synthetically generated. Collection is legal in most contexts.']},
      {q:'In Constitutional AI, what replaces the human labelers who rank model outputs in RLHF?',
       opts:['Automated unit tests that check model outputs for correctness','The AI model itself, critiquing and revising its own outputs guided by a set of written principles (a constitution)','A separate smaller model trained only on harmful examples','Random selection — outputs are randomly ranked during training'],
       correct:1,
       explain:['Unit tests work for verifiable outputs like code or math, but can\'t evaluate whether a conversational response is harmful or helpful in general.', null,'The key innovation: write principles in natural language (e.g., "choose the response that is least likely to contain harmful content"). Have the large model generate a response, then ask the SAME model to critique it against the constitution, then revise it. Use these self-critique/revision cycles as training signal. This reduces the human labeling burden significantly while maintaining alignment quality.','Constitutional AI uses the model\'s own intelligence (guided by the constitution) to improve itself. A separate "harmful examples" classifier would be a different approach (safety filtering), not Constitutional AI.','Random ranking would produce noise, not a useful training signal. Constitutional AI produces principled, consistent feedback based on the written principles.']},
    ]
  },

  {
    id:'gnome', title:'GNoME — AI for Scientific Discovery', shortTitle:'GNoME', year:2023,
    authors:'Merchant, Batzner, Schoenholz, Aykol, Cubuk et al. · Google DeepMind',
    venue:'Nature 2023', category:'Applications', prereqs:['alphafold','transformer'],
    icon:'🔬', tagline:'2.2 million new materials discovered in one paper',
    lesson:[

GNoME (Graph Networks for Materials Exploration) asked: can an AI discover and filter stable new crystal structures orders of magnitude faster?`},
      {h:'The Result: 2.2 Million New Stable Structures',body:`GNoME used graph neural networks (where atoms are nodes and bonds are edges) to predict the stability of crystal structures — their formation energy compared to competing phases.

In one paper, DeepMind:
<ul>
<li>Discovered 2.2 million new stable crystal structures (previous total: 48,000)</li>
<li>Predicted 381,000 to be stable enough for experimental synthesis</li>

<ul>

This pattern works for proteins (AlphaFold), molecules (AlphaFold3), materials (GNoME), chemical reactions, drug targets. AI as a universal scientific discovery engine.`},
      {h:'The Startup It Created: Periodic Labs',body:`Former Google Brain researchers including Ekin Cubuk (who led the GNoME project) co-founded Periodic Labs — building "AI scientists" for materials discovery. They raised $605M at a massive valuation, with backing from Eric Schmidt and Jeff Dean.

The thesis: AI can run the scientific method autonomously — hypothesize, simulate, evaluate, iterate — across millions of candidates simultaneously, rather than one at a time. This is the industrialization of scientific discovery.`}
    ],
    questions:[
      {q:'GNoME used Graph Neural Networks rather than standard transformers. Why are graphs the right representation for crystal structures?',
       opts:['Graph neural networks are faster than transformers','Crystal structures are inherently graph-structured: atoms are nodes, bonds are edges, and geometry describes the graph — GNNs process this structure natively','Graphs allow GNoME to run on mobile devices','Transformers cannot process numbers, only text'],
       correct:1,
       explain:['Speed was not the motivation for the architectural choice. GNNs process graph data naturally; transformers can also be made to work with positional encodings for 3D structure.',null,'A crystal is defined by how atoms connect and their geometric arrangement — this IS a graph. GNNs aggregate information from each atom\'s neighborhood (the atoms bonded to it) in a way that respects the physical structure. Standard grids or sequences impose an inappropriate structure on atomic data.','Graphs don\'t inherently change hardware requirements.','Transformers can and do process numbers — including 3D coordinates, chemical properties, etc. AlphaFold\'s Evoformer is a type of transformer that processes protein structure data.']},
      {q:'GNoME expanded known stable materials from 48,000 to 2.2 million. What does this say about AI\'s role in scientific discovery?',
       opts:['AI can replace all experimental scientists since it predicts everything correctly','AI can explore candidate spaces exponentially larger than what experimental methods can test, filtering candidates computationally before expensive experiments','AI predictions are always correct and experimental validation is no longer needed','This only works for materials — AI cannot help with biological or chemical discovery'],
       correct:1,
       explain:['GNoME predicts stability with high accuracy, but not perfectly. Experimental validation is still required — GNoME identifies which 381,000 of 2.2 million candidates are worth testing. It filters, it doesn\'t eliminate experimental science.',null,'The key word is "filtering." Synthesizing and testing 2.2 million materials experimentally would take centuries. GNoME narrows this to 381,000 high-confidence predictions, and experimental labs can focus resources on the most promising ones. AI as a filter/navigator for large candidate spaces — not a replacement for experiments.','GNoME predictions are not perfectly reliable. New materials require experimental synthesis and characterization. But the predictions are good enough to dramatically accelerate the discovery pipeline.','AlphaFold (proteins), GNoME (materials), and dozens of other applications demonstrate that the AI-for-science pattern works across domains. It\'s a general approach, not materials-specific.']},

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let state = {
  completed: JSON.parse(localStorage.getItem('pa_completed') || '{}'),
  currentPaper: null,
  currentTab: 'learn',
  quizState: null
};

function saveState() {
  localStorage.setItem('pa_completed', JSON.stringify(state.completed));
}

function resetProgress() {
  if (!confirm('Reset all progress?')) return;
  state.completed = {};
  state.currentPaper = null;
  saveState();
  renderTree();
  showHome();
  updateProgressBar();
}

function isPaperUnlocked(paper) {
  return paper.prereqs.every(pid => state.completed[pid]);
}

// ═══════════════════════════════════════════════════════
// TREE RENDER
// ═══════════════════════════════════════════════════════
const TRACKS = [
  {label:'Infrastructure', ids:['gfs','mapreduce','bigtable']},
  {label:'Deep Learning', ids:['alexnet','distbelief','word2vec','seq2seq']},
  {label:'Transformer Era', ids:['transformer','bert','gpt']},
  {label:'Reinforcement Learning', ids:['alphago','alphafold']},
  {label:'Applications', ids:['saycan','constitutional','gnome']},
];

function renderTree() {
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  const paperMap = {};
  PAPERS.forEach(p => paperMap[p.id] = p);

  TRACKS.forEach(track => {
    const label = document.createElement('div');
    label.className = 'track-label';
    label.textContent = track.label;
    tree.appendChild(label);

    track.ids.forEach(pid => {
      const paper = paperMap[pid];
      if (!paper) return;
      const unlocked = isPaperUnlocked(paper);
      const completed = !!state.completed[pid];
      const active = state.currentPaper?.id === pid;

      const node = document.createElement('div');
      node.className = 'paper-node' + (completed?' completed':'') + (active?' active':'') + (!unlocked?' locked':'');
      node.innerHTML = `
        <div class="node-icon">${completed ? '✓' : paper.icon}</div>
        <div class="node-text">
          <div class="node-title">${paper.shortTitle}</div>
          <div class="node-year">${paper.year} · ${paper.category}</div>
        </div>`;
      if (unlocked) node.onclick = () => openPaper(paper);
      tree.appendChild(node);
    });
  });
}

function updateProgressBar() {
  const total = PAPERS.length;
  const done = Object.keys(state.completed).length;
  document.getElementById('progress-label').textContent = `${done} of ${total} papers completed`;
  document.getElementById('progress-fill').style.width = `${(done/total)*100}%`;
}

// ═══════════════════════════════════════════════════════
// PAPER OPEN
// ═══════════════════════════════════════════════════════
function openPaper(paper) {
  state.currentPaper = paper;
  state.currentTab = 'learn';
  state.quizState = null;
  document.getElementById('paper-tag').textContent = paper.category;
  document.getElementById('paper-title-main').textContent = paper.title;
  document.getElementById('paper-meta').textContent = `${paper.authors} · ${paper.venue}`;
  renderTree();
  showTab('learn');
}

function showHome() {
  state.currentPaper = null;
  document.getElementById('paper-tag').textContent = 'Select a paper';
  document.getElementById('paper-title-main').textContent = 'Welcome to Paper Academy';
  document.getElementById('paper-meta').textContent = '';
  document.getElementById('tab-learn').classList.add('active');
  document.getElementById('tab-quiz').classList.remove('active');
  const content = document.getElementById('content');
  const unlockedPapers = PAPERS.filter(p => isPaperUnlocked(p) && !state.completed[p.id]);
  const completedCount = Object.keys(state.completed).length;
  content.innerHTML = `<div id="home-screen" class="fade-in">
    <h2>Google Research → Modern AI</h2>
    <p>Learn the papers that built the AI industry — from MapReduce in 2004 to Constitutional AI in 2022. Each paper builds on the ones before it. Pass the quiz to unlock the next paper in the tree.</p>
    <p style="color:#555; margin-top:8px;">Progress: ${completedCount}/${PAPERS.length} papers completed.</p>
    ${unlockedPapers.length > 0 ? `<h3 style="color:#7C4DFF; font-size:0.82rem; margin-top:24px; margin-bottom:12px;">READY TO LEARN</h3>
    <div class="start-grid">${unlockedPapers.map(p=>`
      <div class="start-card" onclick="openPaper(${JSON.stringify(p).replace(/"/g,'&quot;')})">
        <div class="sc-year">${p.year} · ${p.category}</div>
        <div class="sc-title">${p.icon} ${p.shortTitle}</div>
        <div class="sc-desc">${p.tagline}</div>
      </div>`).join('')}
    </div>` : completedCount === 0 ? `<div class="start-grid">
      <div class="start-card" onclick="openPaper(PAPERS[0])">
        <div class="sc-year">2003 · Infrastructure</div>
        <div class="sc-title">🗄️ Start here: GFS</div>
        <div class="sc-desc">Where Google's data lives</div>
      </div>
      <div class="start-card" onclick="openPaper(PAPERS.find(p=>p.id==='alexnet'))">
        <div class="sc-year">2012 · Deep Learning</div>
        <div class="sc-title">🧠 Or start here: AlexNet</div>
        <div class="sc-desc">The paper that started deep learning</div>
      </div>
    </div>` : '<p style="color:#00C853; margin-top:20px;">All available papers completed! More coming soon.</p>'}
  </div>`;
}

// ═══════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════
function showTab(tab) {
  state.currentTab = tab;
  document.getElementById('tab-learn').classList.toggle('active', tab==='learn');
  document.getElementById('tab-quiz').classList.toggle('active', tab==='quiz');
  if (!state.currentPaper) { showHome(); return; }
  if (tab === 'learn') renderLesson();
  else renderQuiz();
}

// ═══════════════════════════════════════════════════════
// LESSON
// ═══════════════════════════════════════════════════════
function renderLesson() {
  const p = state.currentPaper;
  const content = document.getElementById('content');
  let html = `<div class="fade-in">`;
  p.lesson.forEach(sec => {
    html += `<div class="lesson-section"><h3>${sec.h}</h3><p>${sec.body}</p>`;
    if (sec.callout) html += `<div class="callout">${sec.callout}</div>`;
    if (sec.callout_green) html += `<div class="callout green">${sec.callout_green}</div>`;
    html += `</div>`;
  });
  const done = !!state.completed[p.id];
  html += `<div style="margin-top:24px; padding:16px; background:#16213E; border-radius:10px; border:1px solid #2a2a4a; display:flex; align-items:center; justify-content:space-between;">
    <span style="font-size:0.82rem; color:#888;">${done ? '✓ Paper completed — quiz passed' : 'Ready to test your understanding?'}</span>
    <button onclick="showTab('quiz')" style="padding:9px 20px; background:${done?'#00C85322':'#7C4DFF'}; color:${done?'#00C853':'#fff'}; border:${done?'1px solid #00C85344':'none'}; border-radius:7px; font-size:0.8rem; font-weight:700; cursor:pointer;">
      ${done ? 'Retake Quiz' : 'Take Quiz →'}
    </button>
  </div></div>`;
  content.innerHTML = html;
}

// ═══════════════════════════════════════════════════════
// QUIZ
// ═══════════════════════════════════════════════════════
function renderQuiz() {
  const p = state.currentPaper;
  if (!state.quizState) {
    state.quizState = { current: 0, passed: [], total: p.questions.length };
  }
  const qs = state.quizState;
  if (qs.current >= qs.total) { renderCompletion(); return; }
  const q = p.questions[qs.current];
  const content = document.getElementById('content');
  const letters = ['A','B','C','D','E'];
  let dots = '';
  for (let i=0; i<qs.total; i++) {
    const cls = i < qs.current ? 'done' : i === qs.current ? 'current' : '';
    dots += `<div class="qp-dot ${cls}"></div>`;
  }
  let opts = '';
  q.opts.forEach((opt, i) => {
    opts += `<div class="option" id="opt-${i}" onclick="selectOption(${i})">
      <div class="option-letter">${letters[i]}</div>
      <div class="option-text">${opt}</div>
    </div>`;
  });
  content.innerHTML = `<div id="quiz-wrap" class="fade-in">
    <div class="quiz-progress">${dots}</div>
    <div class="question-card">
      <div class="question-num">Question ${qs.current+1} of ${qs.total}</div>
      <div class="question-text">${q.q}</div>
      <div class="options" id="options-wrap">${opts}</div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">
        ${qs.current+1 < qs.total ? 'Next Question →' : 'See Results →'}
      </button>
    </div>
  </div>`;
}

function selectOption(idx) {
  const p = state.currentPaper;
  const q = p.questions[state.quizState.current];
  const opts = document.querySelectorAll('.option');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('next-btn');

  // Disable all options
  opts.forEach(o => o.classList.add('disabled'));
  opts.forEach(o => o.onclick = null);

  if (idx === q.correct) {
    opts[idx].classList.add('selected-right');
    feedback.className = 'feedback right';
    feedback.innerHTML = `<strong>Correct.</strong> ${q.explain[idx] || 'That\'s the key insight.'}`;
    state.quizState.passed.push(true);
    nextBtn.style.display = 'block';
  } else {
    opts[idx].classList.add('selected-wrong');
    opts[q.correct].classList.add('revealed-right');
    feedback.className = 'feedback wrong';
    feedback.innerHTML = `<strong>Not quite.</strong> ${q.explain[idx]}`;
    state.quizState.passed.push(false);
    nextBtn.style.display = 'block';
    nextBtn.textContent = state.quizState.current+1 < state.quizState.total ? 'Next Question →' : 'See Results →';
  }
}

function nextQuestion() {
  state.quizState.current++;
  renderQuiz();
}

function renderCompletion() {
  const p = state.currentPaper;
  const qs = state.quizState;
  const correct = qs.passed.filter(Boolean).length;
  const total = qs.total;
  const passed = correct === total;

  if (passed && !state.completed[p.id]) {
    state.completed[p.id] = true;
    saveState();
    renderTree();
    updateProgressBar();
  }

  // Find newly unlocked papers
  const newlyUnlocked = PAPERS.filter(np =>
    np.prereqs.includes(p.id) && np.prereqs.every(pid => state.completed[pid]) && !state.completed[np.id]
  );

  const content = document.getElementById('content');
  const scoreColor = passed ? '#00C853' : correct >= total*0.6 ? '#FFB300' : '#FF5252';

  let html = `<div class="fade-in" style="max-width:600px">
    <div style="background:#16213E; border:1px solid ${scoreColor}44; border-radius:12px; padding:32px; text-align:center; margin-bottom:24px;">
      <div style="font-size:3rem; font-weight:900; color:${scoreColor};">${correct}/${total}</div>
      <div style="font-size:1.1rem; font-weight:700; color:#fff; margin:8px 0;">${passed ? 'Paper completed!' : correct >= 2 ? 'Good effort — review and retry' : 'Keep studying and retry'}</div>
      <div style="font-size:0.82rem; color:#888; margin-bottom:20px;">${passed ? p.title + ' is now marked complete.' : 'You need to get all questions correct to unlock the next papers.'}</div>`;

  if (passed && newlyUnlocked.length > 0) {
    html += `<div style="margin-bottom:16px;"><div style="font-size:0.72rem; color:#00C853; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;">Unlocked</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
    ${newlyUnlocked.map(np => `<span style="background:#00C85311; border:1px solid #00C85344; color:#00C853; padding:5px 14px; border-radius:20px; font-size:0.8rem; cursor:pointer;" onclick="openPaper(PAPERS.find(p=>p.id==='${np.id}'))">${np.icon} ${np.shortTitle}</span>`).join('')}
    </div></div>`;
  }

  html += `<div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
    <button onclick="state.quizState=null; renderQuiz();" style="padding:9px 18px; background:#16213E; color:#ccc; border:1px solid #2a2a4a; border-radius:7px; font-size:0.8rem; cursor:pointer;">Retry Quiz</button>
    <button onclick="showTab('learn')" style="padding:9px 18px; background:#7C4DFF; color:#fff; border:none; border-radius:7px; font-size:0.8rem; font-weight:700; cursor:pointer;">Back to Lesson</button>
    ${passed && newlyUnlocked.length > 0 ? `<button onclick="openPaper(PAPERS.find(p=>p.id==='${newlyUnlocked[0].id}'))" style="padding:9px 18px; background:#00C853; color:#000; border:none; border-radius:7px; font-size:0.8rem; font-weight:700; cursor:pointer;">Next Paper →</button>` : ''}
  </div></div>`;

  // Show per-question breakdown
  html += `<div style="margin-top:20px;"><div style="font-size:0.75rem; color:#555; margin-bottom:12px; text-transform:uppercase; letter-spacing:1px;">Question Review</div>`;
  p.questions.forEach((q, i) => {
    const ok = qs.passed[i];
    html += `<div style="background:#16213E; border:1px solid ${ok?'#00C85322':'#FF525222'}; border-radius:8px; padding:12px 16px; margin-bottom:8px; display:flex; align-items:flex-start; gap:10px;">
      <span style="color:${ok?'#00C853':'#FF5252'}; font-size:1rem; flex-shrink:0;">${ok?'✓':'✗'}</span>
      <span style="font-size:0.8rem; color:#aaa; line-height:1.5;">${q.q}</span>
    </div>`;
  });
  html += `</div></div>`;
  content.innerHTML = html;
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
// Make PAPERS globally accessible
window.PAPERS = PAPERS;
renderTree();
updateProgressBar();
showHome();
</script>
