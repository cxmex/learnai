<div class="lesson-body">
<p>BPMN 2.0 (Business Process Model and Notation) is the ISO/IEC 19510 standard for visually modeling business processes. It bridges the gap between process design by business analysts and technical implementation by developers — both can read the same diagram.</p>
<p><strong>Core BPMN Elements:</strong></p>
<ul>
<li><strong>Events</strong>: Circles representing things that happen. Start events (thin border) trigger a process. End events (thick border) terminate it. Intermediate events (double border) occur mid-flow. Events can be typed: Timer (clock icon), Message (envelope), Error (lightning bolt), Signal (triangle), Escalation, Compensation.</li>
<li><strong>Activities</strong>: Rounded rectangles representing work. Tasks are atomic — Script Task, Service Task, User Task, Send Task, Receive Task. Sub-processes are expandable containers for reusable logic. Markers indicate multi-instance (parallel ∥ or sequential ≡), loops, and compensation.</li>
<li><strong>Gateways</strong>: Diamonds controlling flow. Exclusive Gateway (X) — only one path taken, first true condition wins. Parallel Gateway (+) — all paths taken simultaneously. Inclusive Gateway (O) — one or more paths based on conditions. Event-Based Gateway — waits for one of several events.</li>
<li><strong>Sequence Flows</strong>: Solid arrows connecting elements within a pool.</li>
<li><strong>Message Flows</strong>: Dashed arrows crossing pool boundaries (inter-process communication).</li>
<li><strong>Pools and Lanes</strong>: Pools represent participants (organizations, systems). Lanes subdivide pools into roles or departments.</li>
</ul>
<p><strong>Executable vs. Descriptive BPMN:</strong> Descriptive BPMN captures intent — what business analysts draw. Executable BPMN adds technical attributes: service task implementation (Java class, expression, external worker), input/output variable mappings, timeout durations, error codes. Camunda 7/8 and Flowable execute BPMN XML directly — the diagram IS the code.</p>
<p><strong>Token-Based Execution Semantics:</strong> BPMN execution follows token semantics. A token enters the start event and flows through the diagram. When a parallel gateway fires, it generates multiple tokens. When they reconverge at a joining parallel gateway, all tokens must arrive before continuing. This enables rigorous formal verification — you can prove a process has no deadlocks or unreachable states.</p>
<p><strong>Correlation and Instance Management:</strong> Each process execution creates a process instance. The engine correlates incoming messages to the correct instance using correlation keys (e.g., orderId). This is how a "payment received" message finds the right "order fulfillment" process instance among thousands running concurrently.</p>
<p><strong>BPMN and AI Agents:</strong> Modern BPM engines are adding AI-native task types. A Service Task can call an LLM API. A User Task can present AI suggestions for human review. The key insight: BPMN provides the durable orchestration skeleton while agents provide intelligent decision-making at specific steps. The process graph defines WHAT happens and in what ORDER; agents determine HOW to accomplish individual tasks.</p>
</div>`,

<div class="lesson-body">
<p>Process mining extracts actual process behavior from event logs in information systems (ERP, CRM, BPM engines) and compares it to the designed process model. It answers: "What ACTUALLY happens vs. what we think happens?"</p>
<p><strong>Three Process Mining Disciplines:</strong></p>
<ul>
<li><strong>Discovery</strong>: No prior model needed. Algorithms (Alpha Miner, Inductive Miner, Heuristics Miner) automatically generate a process model from event logs. Output: a BPMN or Petri net showing real behavior.</li>
<li><strong>Conformance Checking</strong>: Given a designed model and an event log, compute fitness (how well do cases follow the model?), precision (does the model allow unobserved behavior?), and generalization (does the model handle unseen but valid cases?).</li>
<li><strong>Enhancement</strong>: Use event log data to improve an existing model — add performance overlays (bottleneck heat maps), branch frequencies, rework loops.</li>
</ul>
<p><strong>Event Log Structure:</strong> Every event log needs: Case ID (which process instance), Activity Name (what happened), Timestamp (when). Optional: Resource (who), cost, outcome. A case is a sequence of events with the same Case ID. Process mining tools (Celonis, ProM, pm4py) ingest these logs and run mining algorithms.</p>
<p><strong>Key Metrics from Process Mining:</strong></p>
<ul>
<li><strong>Cycle Time</strong>: End-to-end time for a case. Mining reveals the actual distribution (median, P90, P99) not the theoretical SLA.</li>
<li><strong>Throughput</strong>: Cases completed per time unit.</li>
<li><strong>Rework Rate</strong>: % of cases that revisit an activity (indicates errors or missing data).</li>
<li><strong>Variant Analysis</strong>: How many distinct paths exist? Top 3 variants often account for 80% of cases. Long-tail variants are where exceptions hide.</li>
</ul>
<p><strong>Conformance Fitness Score:</strong> Range 0–1. Fitness = 1 means all events in the log can be replayed on the model without missing tokens. Common causes of low fitness: skipped mandatory steps, wrong activity order, missing activities not in the model.</p>
<p><strong>AI/Agent Applications:</strong> Process mining feeds AI agents with ground truth. Instead of guessing where to automate, agents can be targeted at proven high-frequency, high-deviation paths. Celonis' Execution Management System uses process mining to recommend and trigger RPA bots and API calls at exact bottleneck moments. The mining layer provides continuous feedback to agents: "Your automation succeeded in 94% of cases; 6% required human takeover at step X."</p>
</div>`,

    lesson: `<div class="prereq-box">Requires: <span>BPMN 2.0 Fundamentals</span></div>
<div class="lesson-body">
<p>DMN (Decision Model and Notation) is the companion standard to BPMN. While BPMN models process flow, DMN models decision logic. Together they separate concerns: BPMN defines WHEN a decision is made; DMN defines HOW it's made.</p>
<p><strong>Decision Requirements Diagram (DRD):</strong> The top-level DMN artifact. Shows decisions (rectangles), input data (ovals), and business knowledge models (rectangles with clipped corners) with dependency arrows. A complex decision can depend on sub-decisions and shared knowledge models.</p>
<p><strong>Decision Table:</strong> The most common DMN element. A table with input columns (conditions: customer tier, order amount), output columns (results: discount %, approval required), and a Hit Policy that determines what happens when multiple rows match.</p>
<p><strong>Hit Policies (critical):</strong></p>
<ul>
<li><strong>U (Unique)</strong>: Exactly one row matches. Most restrictive — good for well-defined rules.</li>
<li><strong>A (Any)</strong>: Multiple rows may match but must return the same output.</li>
<li><strong>F (First)</strong>: Returns the first matching row in order. Like switch/case.</li>
<li><strong>C (Collect)</strong>: Returns ALL matching rows. Can apply aggregators: sum, min, max, count.</li>
<li><strong>R (Rule Order)</strong>: Returns all matches in rule order.</li>
</ul>
<p><strong>FEEL (Friendly Enough Expression Language):</strong> DMN's expression language for conditions and outputs. Range syntax: <code>[100..500]</code> (inclusive), <code>(100..500)</code> (exclusive). List: <code>["Gold","Platinum"]</code>. Negation: <code>not("Bronze")</code>. Date arithmetic: <code>date("2026-01-01") + duration("P30D")</code>.</p>
<p><strong>DMN and AI Agents:</strong> DMN externalizes business rules that would otherwise be buried in code or LLM prompts. An AI agent can call a DMN decision service via REST API to get deterministic, auditable rule outcomes. This is critical for regulated industries: loan approval, insurance underwriting, tax calculation. The agent handles natural language; DMN handles compliance logic. If the rules change, update the decision table — not the agent's prompt.</p>
<p><strong>Decision Services:</strong> DMN 1.3 introduced Decision Services — named subsets of a DRD exposed as callable APIs. A BPMN Business Rule Task can call a Decision Service synchronously, receiving the output as process variables.</p>
</div>`,

    id: 'case_management', title: 'Case Management and CMMN', track: 'bpmn',
    authors: 'OMG CMMN Spec, Camunda, Pega', prereqs: ['bpmn_basics'],
    lesson: `<div class="prereq-box">Requires: <span>BPMN 2.0 Fundamentals</span></div>
<div class="lesson-body">
<p>Not all business work fits a predefined flow. Case Management models adaptive, knowledge-work processes where the path emerges based on data and judgment. Insurance claims, legal matters, complex customer complaints, and medical cases are quintessential examples.</p>
<p><strong>CMMN (Case Management Model and Notation):</strong> The OMG standard for case management. Key elements:</p>
<ul>
<li><strong>Case File</strong>: The central data object. All tasks and milestones share access to the case file.</li>
<li><strong>Task</strong>: Discretionary (worker chooses when to do it) or required. Human Tasks, Process Tasks (triggers BPMN), Case Tasks (triggers a sub-case).</li>
<li><strong>Stage</strong>: A container grouping related tasks. Stages can be nested.</li>
<li><strong>Milestone</strong>: A significant state the case has reached (not a task, no work done).</li>
<li><strong>Sentry</strong>: Guards that control when tasks/stages become available. Entry Criteria and Exit Criteria.</li>
</ul>
<p><strong>BPMN vs. CMMN:</strong> BPMN is prescriptive — the flow is defined. CMMN is descriptive — tasks are available, workers decide. BPMN is good for high-volume, repeatable processes (invoice approval). CMMN is good for knowledge work requiring judgment (complex claim investigation).</p>
<p><strong>Case States and Lifecycle:</strong> A CMMN case has states: Active, Completed, Terminated, Failed, Suspended. Case workers can manually suspend/resume cases. Completion conditions can be defined: all required tasks completed OR a specific milestone reached.</p>

<p><strong>AI Agents + Case Management:</strong> Case management is a natural fit for AI agents. An agent can: monitor the case file for new data, suggest which available tasks to prioritize, automatically execute routine sub-tasks (data retrieval, document classification), escalate when thresholds are breached, and generate case summaries. The human worker focuses on judgment calls; the agent handles data gathering and routine execution.</p>
</div>`,

    lesson: `<div class="prereq-box">Requires: <span>BPMN 2.0 Fundamentals</span></div>
<div class="lesson-body">
<p>Traditional BPM engines poll databases or receive synchronous API calls. Event-Driven BPM (EDA + BPMN) treats process triggers, intermediate signals, and completion signals as stream events — enabling real-time, scalable process orchestration.</p>
<p><strong>Event-Driven Architecture Basics:</strong> An <strong>event</strong> is an immutable record that something happened (OrderPlaced, PaymentReceived, InventoryReserved). An <strong>event broker</strong> (Kafka, Pulsar, or AWS EventBridge) routes events from producers to consumers. <strong>Event consumers</strong> are process engines, microservices, or functions that react to events.</p>
<p><strong>BPMN Message Events in Event-Driven Context:</strong></p>
<ul>
<li><strong>Message Start Event</strong>: A process instance starts when a specific message arrives on a topic.</li>
<li><strong>Message Intermediate Catch Event</strong>: A running process instance waits for a correlated message. The engine subscribes to the broker; when the message arrives with the correct correlation key, the token advances.</li>
<li><strong>Message Throw Event / Send Task</strong>: Publishes a message to the broker.</li>
<li><strong>Boundary Timer Events</strong>: Process instances that don't receive their expected message within N hours can trigger escalation flows.</li>
</ul>
<p><strong>Zeebe and Camunda 8:</strong> Zeebe is Camunda 8's cloud-native process engine built for event-driven, high-throughput orchestration. Zeebe stores process state in a distributed log (similar to Kafka). Exporters publish process events (task activated, job completed, process ended) to Elasticsearch or Kafka for monitoring. Workers poll Zeebe via gRPC for jobs to execute — decoupled, polyglot, scalable.</p>
<p><strong>Correlation:</strong> The hard problem of event-driven BPM. When 10,000 order processes are running and a "PaymentReceived" event arrives, which instance does it belong to? Correlation keys solve this: the event carries <code>orderId: "ORD-12345"</code>, the engine finds the instance waiting on that orderId. Zeebe's subscription model handles correlation at engine level.</p>
<p><strong>AI Agent Integration:</strong> Agents can be Zeebe job workers. When a process reaches an AI decision task (e.g., "Classify Document"), Zeebe publishes the job. The agent polls, processes using an LLM, and completes the job with output variables. The process continues. This is the "AI in the loop" pattern: the process defines orchestration; agents execute intelligent steps as jobs.</p>
</div>`,

    id: 'temporal_durable', title: 'Temporal.io: Durable Execution', track: 'durable',
    authors: 'Temporal Technologies, Maxim Fateev', prereqs: [],
    lesson: `<div class="prereq-box">Starting point — no prerequisites</div>
<div class="lesson-body">
<p>Temporal.io is an open-source durable execution platform. Its central promise: write code as if failures don't exist. Temporal handles retries, timeouts, and state persistence transparently — your workflow code survives crashes, deployments, and network failures.</p>
<p><strong>The Core Problem:</strong> Long-running distributed operations fail mid-way. A 10-step order fulfillment that crashes at step 7 needs to resume at step 8, not restart from step 1. Traditional approaches use queues + databases + retry logic — complex, error-prone. Temporal abstracts this entirely.</p>
<p><strong>Workflow and Activity:</strong></p>
<ul>
<li><strong>Workflow</strong>: Durable, deterministic orchestration code. Defines the flow logic. Must be deterministic (no <code>random()</code>, no <code>time.Now()</code> directly — use Temporal APIs). Survives failures — Temporal replays workflow history to restore state.</li>
<li><strong>Activity</strong>: Non-deterministic work that can fail (API calls, database writes, file I/O). Temporal retries activities automatically with configurable policies (initial interval, backoff coefficient, max attempts, max interval).</li>
</ul>
<p><strong>Workflow History and Replay:</strong> Temporal persists every event: workflow started, activity scheduled, activity completed, timer fired. On failure, Temporal replays the history to restore exact in-memory state — no code change needed. This is why workflows must be deterministic: replaying must produce the same decisions.</p>
<p><strong>Signals and Queries:</strong> A <strong>Signal</strong> sends an event to a running workflow. The workflow can wait for signals using <code>workflow.GetSignalChannel</code>. Enables human-in-the-loop: a workflow waits for an "approval" signal. A <strong>Query</strong> reads current state of a running workflow synchronously without affecting its execution.</p>
<p><strong>Temporal vs. Kafka + Database:</strong> Kafka + DB approach: you manage consumer offsets, dead-letter queues, idempotency, and retry logic. Temporal: you write linear code; the platform handles all of it. Trade-off: Temporal adds an infrastructure dependency and requires deterministic workflow code discipline.</p>
<p><strong>AI Agent Workflows:</strong> Temporal is a natural fit for multi-step AI agents. Each LLM call is an Activity with retries. Long-running research workflows (hours/days) survive model restarts. Human approval steps use Signals. Temporal's visibility UI shows exactly where an agent workflow is in its execution — invaluable for debugging. Companies like Replit and Stripe use Temporal for AI-driven operations.</p>
</div>`,

    id: 'saga_pattern', title: 'Saga Pattern and Distributed Transactions', track: 'durable',
    authors: 'Hector Garcia-Molina, Camunda, Temporal', prereqs: ['temporal_durable'],
    lesson: `<div class="prereq-box">Requires: <span>Temporal.io: Durable Execution</span></div>
<div class="lesson-body">
<p>Microservices cannot use traditional ACID database transactions across service boundaries. The Saga pattern provides distributed transaction management through a sequence of local transactions, each publishing events or messages to trigger the next step.</p>
<p><strong>The Problem:</strong> Order service books inventory. Payment service charges card. Shipping service creates label. If shipping fails, the charge and inventory reservation must be rolled back. Two-Phase Commit (2PC) across microservices is impractical — it requires a distributed lock that blocks all participants.</p>
<p><strong>Choreography vs. Orchestration:</strong></p>
<ul>
<li><strong>Choreography Saga</strong>: Each service publishes an event after its local transaction. Other services react. No central coordinator. Decoupled but hard to trace end-to-end.</li>
<li><strong>Orchestration Saga</strong>: A central orchestrator (saga orchestrator, Temporal workflow, BPMN engine) directs each step. Explicitly knows the entire saga's state. Easier to debug, monitor, and evolve.</li>
</ul>
<p><strong>Compensating Transactions:</strong> Each Saga step must have a corresponding compensating transaction that undoes the step's effect. Compensating transactions are not rollbacks — they are forward-moving actions that logically undo previous work. "Cancel reservation" rather than "delete reservation record".</p>
<p><strong>Temporal Saga Implementation:</strong> Temporal's Saga support stores compensation functions with the workflow state. On failure, it executes compensations reliably with retries:</p>
<ul>
<li>Activity: BookFlight → Compensation: CancelFlight</li>
<li>Activity: BookHotel → Compensation: CancelHotel</li>
<li>Activity: BookCar → Compensation: CancelCar</li>
<li>If any activity fails: execute compensations in reverse order</li>
</ul>
<p><strong>Eventual Consistency:</strong> Sagas achieve eventual consistency, not immediate consistency. During execution, the system is in an intermediate state. "Dirty reads" can occur — another request might see the inventory as reserved while the saga has not fully committed. Techniques: semantic locks (mark records as "pending"), countermeasures (pivot transactions).</p>
</div>`,

    lesson: `<div class="prereq-box">Starting point — no prerequisites</div>
<div class="lesson-body">
<p>Robotic Process Automation (RPA) automates repetitive UI-based tasks by recording and replaying user interactions. AI agents extend this with perception, planning, and adaptive decision-making. The evolution: scripted → supervised → autonomous.</p>
<p><strong>RPA Fundamentals:</strong> RPA bots interact with UIs the way humans do: clicking, typing, reading screen text (OCR). They are fragile — UI changes break bots. They are deterministic — the same input always produces the same action. Best for: high-volume, stable UI processes with structured data (invoice extraction, form filling, legacy system integration).</p>
<p><strong>RPA Limitations:</strong> Brittleness (UI changes require bot reconfiguration), no reasoning (cannot handle exceptions not explicitly programmed), no perception (cannot understand document context), scaling costs (each concurrent bot instance requires a separate VM/license).</p>
<p><strong>AI Agents vs. RPA:</strong></p>
<table>
<tr><th>Dimension</th><th>RPA</th><th>AI Agent</th></tr>
<tr><td>Decision-making</td><td>Rule-based</td><td>LLM reasoning</td></tr>
<tr><td>Exception handling</td><td>Breaks or escalates</td><td>Attempts to resolve</td></tr>
<tr><td>UI understanding</td><td>Coordinate/selector</td><td>Semantic understanding</td></tr>
<tr><td>Adaptability</td><td>Brittle</td><td>Robust to variation</td></tr>
<tr><td>Auditability</td><td>Deterministic log</td><td>Probabilistic reasoning</td></tr>
</table>
<p><strong>Hybrid: Attended RPA + AI:</strong> Current sweet spot. RPA handles structured, high-volume steps. AI handles unstructured perception and edge case reasoning. UiPath's Document Understanding uses LLMs to extract fields from messy invoices; the RPA bot then enters structured data into the ERP.</p>
<p><strong>Agentic Automation Patterns:</strong> Computer Use (Anthropic) — LLMs that directly control browsers/desktops, eliminating the need for RPA tooling. Browser Automation — Playwright + LLM planning layer. Agent describes what to click; Playwright executes. API-first — prefer API calls over UI scraping when available.</p>
<p><strong>Transition Strategy:</strong> Don't rip and replace. Identify high-value processes where AI reasoning adds most value (document processing, exception handling). Keep RPA for proven stable UI tasks. Agents augment bot workflows; eventual replacement is gradual.</p>
</div>`,

    id: 'hitl_design', title: 'Human-in-the-Loop Design Patterns', track: 'automation',
    authors: 'Anthropic, LangGraph, Temporal', prereqs: ['rpa_to_agents'],
    lesson: `<div class="prereq-box">Requires: <span>From RPA to Agentic Automation</span></div>
<div class="lesson-body">
<p>Human-in-the-Loop (HITL) systems insert human judgment at specific points in automated workflows. The key design challenge: when to interrupt, how to present context, and how to integrate human decisions back into the automated flow without losing state.</p>
<p><strong>Why HITL:</strong> High-stakes decisions (loan approval, medical triage, legal filings), low-confidence situations (agent uncertainty score exceeds threshold), novel inputs (cases outside training distribution), compliance (regulations requiring human authorization), and trust building (new automations need an observed track record before full autonomy).</p>
<p><strong>HITL Interruption Patterns:</strong></p>
<ul>
<li><strong>Pre-execution approval</strong>: Agent plans action → human approves/rejects before execution. Latency: blocking. Safety: highest.</li>
<li><strong>Post-execution review</strong>: Agent acts → human reviews outcomes. Latency: non-blocking. Safety: medium (action already taken).</li>
<li><strong>Exception routing</strong>: Agent handles routine cases autonomously; exceptions routed to humans. Latency: minimal for routine cases.</li>
<li><strong>Confidence-gated</strong>: Agent acts when confidence > threshold; escalates when below. Threshold tuning is critical — too high = too many escalations; too low = too many errors.</li>
</ul>
<p><strong>Presenting Context to Humans:</strong> Show: what the agent decided, WHY (chain of thought or feature importance), what alternatives were considered, confidence score, relevant source data. Without context, human reviewers rubber-stamp — they cannot override meaningfully without understanding the decision.</p>
<p><strong>State Continuity:</strong> When human approval arrives minutes or hours later, the system must resume execution with correct state. Temporal Signals: the workflow pauses at a Signal channel; approval sends the signal; workflow resumes. LangGraph human-in-the-loop: graph execution pauses at a human node; state is persisted; resumed with human input injected as a message.</p>
<p><strong>Feedback Loop:</strong> Human corrections are training data. Track: cases escalated, human decision (approve/override/reject), agent original recommendation. This dataset enables: identifying systematic agent errors, improving the model/prompt, adjusting confidence thresholds. HITL is not just safety — it is continuous improvement infrastructure.</p>
</div>`,

<div class="lesson-body">
<p>Anthropic's research identifies core patterns for building reliable multi-step AI workflows: augmented LLMs, prompt chaining, routing, parallelization, orchestrators/subagents, and evaluator-optimizer loops.</p>
<p><strong>Pattern 1: Augmented LLM.</strong> The foundation. An LLM with tools (web search, code execution, database query), memory (conversation context, long-term vector store), and context (system prompts, RAG). All other patterns build on this.</p>
<p><strong>Pattern 2: Prompt Chaining.</strong> Decompose a complex task into sequential LLM calls. Each call's output feeds the next. Gate with validation between steps. Example: Research → Outline → Draft → Edit → Format. Works when subtasks are clear and sequential. Failure at any step stops the chain or triggers retry/HITL.</p>
<p><strong>Pattern 3: Routing.</strong> A classifier LLM decides which specialized agent handles a request. Example: customer support router → billing agent vs. technical support agent vs. returns agent. Requires a clear routing taxonomy, a reliable classifier, and fallback for uncertain cases.</p>
<p><strong>Pattern 4: Parallelization.</strong> <em>Sectioning</em>: different agents work on different parts simultaneously (chapters of a report). <em>Voting</em>: multiple agents independently analyze the same input; majority vote for reliability on high-stakes decisions. LLM-as-orchestrator spawns parallel subtasks; aggregator LLM synthesizes results.</p>
<p><strong>Pattern 5: Orchestrators and Subagents.</strong> An orchestrator LLM plans and delegates. Subagent LLMs execute specialized tasks (web research, code generation, data analysis). The orchestrator maintains task state and integrates results. This maps directly to Temporal workflows: orchestrator = workflow, subagents = activities.</p>
<p><strong>Pattern 6: Evaluator-Optimizer.</strong> An evaluator LLM scores the output of a generator LLM against criteria. If score &lt; threshold, the generator tries again with evaluator feedback. Loops until quality threshold met or max iterations reached. Used in code generation (test-driven), document writing (rubric-driven), translation quality.</p>
<p><strong>When NOT to Use Agents:</strong> Simple, single-step tasks don't benefit from agent patterns. Overhead of orchestration, tool calls, and state management only pays off for tasks requiring: multiple steps, conditional logic, external data, or iterative refinement.</p>

    lesson: `<div class="prereq-box">Requires: <span>Saga Pattern and Distributed Transactions</span>, <span>Event-Driven BPM and Streaming</span></div>
<div class="lesson-body">
<p>Two fundamental approaches to coordinating microservices: one central coordinator (orchestration) vs. each service knowing its own role and reacting to events (choreography). Neither is universally better — the choice depends on the system's complexity, change rate, and observability requirements.</p>
<p><strong>Orchestration:</strong> A central orchestrator (saga orchestrator, workflow engine, process engine) explicitly directs each service. It knows the complete sequence, handles failures, and maintains end-to-end state.</p>
<ul>
<li><strong>Benefits</strong>: Single source of truth for the business process; centralized error handling and compensation; easy to trace, monitor, and visualize; changes to the flow only require updating the orchestrator.</li>
<li><strong>Costs</strong>: Orchestrator is a dependency (single point of failure if not HA); services must expose APIs for the orchestrator to call; can become a monolith if the orchestrator does too much business logic.</li>
</ul>
<p><strong>Choreography:</strong> Services react to events. OrderService publishes OrderPlaced → InventoryService reserves stock → PaymentService charges → ShippingService creates label. No central coordinator; each service knows what events to emit and which to consume.</p>
<ul>
<li><strong>Benefits</strong>: Highly decoupled; easy to add new participants (subscribe to existing events); natural fit for event-driven architectures.</li>
<li><strong>Costs</strong>: End-to-end process understanding requires reading ALL service code; failure tracking is distributed and hard to trace; adding cross-cutting concerns (timeout, compensation) is complex.</li>
</ul>
<p><strong>Choosing:</strong> Use orchestration when: the process has complex conditional logic, compensation is needed, observability is critical, process ownership is centralized. Use choreography when: services are truly independent, events are natural domain artifacts, teams prefer maximum decoupling.</p>
<p><strong>Hybrid Reality:</strong> Most real systems combine both. Orchestration within a bounded context (one team's services); choreography across contexts (inter-team, inter-system). A Temporal workflow orchestrates steps within the "order fulfillment" domain; it publishes events consumed by downstream "accounting" and "analytics" choreography consumers.</p>

    lesson: `<div class="prereq-box">Requires: <span>Process Mining: Discovering Reality</span>, <span>Orchestration vs. Choreography</span></div>
<div class="lesson-body">
<p>Measuring process performance is prerequisite to improving it. For AI-augmented workflows, traditional process KPIs extend with AI-specific metrics: model accuracy, automation rate, escalation rate, and cost per case.</p>
<p><strong>Core Process KPIs:</strong></p>
<ul>
<li><strong>Cycle Time</strong>: Time from case start to completion. Decompose into: processing time (active work), waiting time (queued), transport time (handoffs).</li>
<li><strong>Throughput</strong>: Cases completed per unit time. Constrained by the bottleneck resource (Theory of Constraints).</li>
<li><strong>First-Pass Yield (FPY)</strong>: % of cases completed without rework, errors, or rejection. High FPY = high quality inputs and clear process.</li>
<li><strong>Error Rate</strong>: % of cases with defects detected post-process.</li>
<li><strong>Cost Per Case</strong>: Total cost (labor + infrastructure + licensing) divided by volume. AI automation should reduce this metric.</li>
</ul>
<p><strong>AI-Specific Metrics:</strong></p>
<ul>
<li><strong>Automation Rate</strong>: % of cases fully automated (no human touch). Target 70–90% for mature AI workflows.</li>
<li><strong>Containment Rate</strong>: % of cases resolved by AI without escalation. Inverse of escalation rate.</li>
<li><strong>Escalation Rate</strong>: % of cases requiring human intervention. High escalation = poor confidence calibration or out-of-distribution inputs.</li>
<li><strong>Confidence Calibration</strong>: Does the model's stated confidence correlate with actual accuracy? A well-calibrated model at 80% confidence should be right ~80% of the time.</li>
</ul>
<p><strong>SLA and SLO Monitoring:</strong> <strong>SLA (Service Level Agreement)</strong>: Customer-facing commitment (95% of cases resolved in &lt; 4 hours). <strong>SLO (Service Level Objective)</strong>: Internal target (99% of cases resolved in &lt; 3 hours — tighter than SLA as buffer). <strong>SLI (Service Level Indicator)</strong>: The measurement (actual resolution time distribution). Process mining continuously populates SLI measurements from event logs.</p>
<p><strong>Bottleneck Analysis:</strong> Apply Theory of Constraints: find the step with the longest queue or highest wait time. Improving non-bottleneck steps has zero impact on throughput. Automation should target the bottleneck first.</p>
<p><strong>Dashboard Design for AI Workflows:</strong> Real-time metrics: current automation rate, escalation rate, active cases by stage. Trend charts: daily cycle time, weekly throughput, monthly cost per case. Anomaly alerts: automation rate drops &gt; 5% in 24h (model degradation), escalation rate spikes (distributional shift).</p>

function openPaper(id) {

function showTab(tab) {
  state.tab = tab;

}

function renderTabContent() {

      </div>`;
  } else {
    if (state.completed.has(p.id)) { renderCompletion(p); return; }
    renderQuiz();
  }
}

function renderQuiz() {
  const p = PAPERS.find(x => x.id === state.active);
  const q = p.questions[state.qIndex];
  const el = document.getElementById('content');
  const ans = state.answered[state.qIndex];
  let optHtml = q.options.map(opt => {
    let cls = 'option' + (ans !== undefined ? ' answered' : '');
    if (ans !== undefined) { cls += opt.correct ? ' correct' : (opt.letter === ans ? ' wrong' : ''); }
    let explainHtml = '';
    if (ans !== undefined) {
      if (opt.correct) explainHtml = `<div class="option-explain">Correct.</div>`;
      else if (opt.letter === ans) explainHtml = `<div class="option-explain">${opt.explain}</div>`;
    }
    return `<div class="${cls}" onclick="selectOption('${p.id}',${state.qIndex},'${opt.letter}')">
      <div class="option-letter">${opt.letter}</div>
      <div class="option-text">${opt.text}${explainHtml}</div>
    </div>`;
  }).join('');
  let actionHtml = '';
  if (ans !== undefined) {
    if (state.qIndex < p.questions.length - 1) {
      actionHtml = `<button class="btn" onclick="nextQ()">Next Question →</button>`;
    } else {
      actionHtml = `<button class="btn" onclick="checkDone()">Finish Quiz</button>`;
    }
  }
  el.innerHTML = `<div class="quiz-wrap">
    <div class="q-progress">Question ${state.qIndex + 1} of ${p.questions.length}</div>
    <div class="q-text">${q.text}</div>
    ${optHtml}
    <div class="quiz-action">${actionHtml}</div>
  </div>`;
}

function selectOption(pid, qIdx, letter) {
  if (state.answered[qIdx] !== undefined) return;
  state.answered[qIdx] = letter;
  renderQuiz();
}

function nextQ() {
  state.qIndex++;
  renderQuiz();
}

function checkDone() {
  const p = PAPERS.find(x => x.id === state.active);
  const allPass = p.questions.every((q, i) => {
    const a = state.answered[i];
    return a !== undefined && q.options.find(o => o.letter === a)?.correct;
  });
  if (allPass) {
    state.completed.add(p.id); save(); updateBadge(); renderSidebar();
    renderCompletion(p);
  } else {
    state.qIndex = p.questions.findIndex((q, i) => {
      const a = state.answered[i];
      return !(a !== undefined && q.options.find(o => o.letter === a)?.correct);
    });
    renderQuiz();
  }
}

function updateBadge() {
  document.getElementById('badge').textContent = state.completed.size + ' / ' + PAPERS.length + ' complete';
}

function renderCompletion(p) {
  const el = document.getElementById('content');
  const unlocked = PAPERS.filter(x => x.prereqs.includes(p.id) && !state.completed.has(x.id) && isPaperUnlocked(x));
  let unlockedHtml = unlocked.length ? `<div class="unlocked-list"><p style="font-size:13px;color:#666;margin-bottom:12px">Newly unlocked:</p>${unlocked.map(x => `<div class="unlocked-item" onclick="openPaper('${x.id}')">→ ${x.title}</div>`).join('')}</div>` : '';
  el.innerHTML = `<div class="completion">
    <div style="font-size:48px;margin-bottom:16px">⚙️</div>
    <h3>Topic Complete!</h3>
    <p>${p.title} — all questions answered correctly.</p>
    ${unlockedHtml}
    <button class="btn btn-secondary" onclick="showTab('lesson')">Review Lesson</button>
  </div>`;
}

}

        merged=raw?JSON.parse(raw):{};
        remote.forEach(function(id){merged[id]=true;});
        _orig.call(localStorage,LSK,JSON.stringify(merged));
      } else {
        var local=raw?JSON.parse(raw):[];
        var s=new Set(local);
        remote.forEach(function(id){s.add(id);});
        _orig.call(localStorage,LSK,JSON.stringify(Array.from(s)));
      }
      if(typeof renderTree==='function') renderTree();
      if(typeof updateProgressBar==='function') updateProgressBar();
      if(typeof render==='function') render();
    }).catch(function(){});
  });

  var btn=document.createElement('a');
  btn.href='index.html';
  btn.innerHTML='&#8592; Menu';
  btn.style.cssText='position:fixed;top:10px;left:10px;z-index:9999;background:#16213E;color:#7C4DFF;border:1px solid #7C4DFF44;padding:5px 12px;border-radius:7px;font-size:0.75rem;font-weight:700;text-decoration:none;opacity:0.8;transition:opacity 0.2s';
  btn.onmouseover=function(){this.style.opacity='1';};
  btn.onmouseout=function(){this.style.opacity='0.8';};
  document.body.appendChild(btn);
})();
</script>
