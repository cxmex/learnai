const TRACKS = [
  {label:'Linux Foundation', ids:['cgroups','docker']},
  {label:'Orchestration', ids:['borg','kubernetes','helm']},
  {label:'Cloud Native', ids:['twelvefactor','microservices']},
  {label:'MLOps', ids:['techdebt','mlflow','kubeflow']},
  {label:'Observability', ids:['servicemesh']},
];

let state = {
  completed: JSON.parse(localStorage.getItem('pa3_completed') || '{}'),
  currentPaper: null, currentTab: 'learn', quizState: null
};
function saveState(){ localStorage.setItem('pa3_completed', JSON.stringify(state.completed)); }
function resetProgress(){ if(!confirm('Reset all progress?')) return; state.completed={}; state.currentPaper=null; saveState(); renderTree(); showHome(); updateProgressBar(); }
function isPaperUnlocked(p){ return p.prereqs.every(pid => state.completed[pid]); }

function renderTree(){
  const tree=document.getElementById('tree'); tree.innerHTML='';
  const pm={}; PAPERS.forEach(p=>pm[p.id]=p);
  TRACKS.forEach(track=>{
    const lbl=document.createElement('div'); lbl.className='track-label'; lbl.textContent=track.label; tree.appendChild(lbl);
    track.ids.forEach(pid=>{
      const paper=pm[pid]; if(!paper) return;
      const unlocked=isPaperUnlocked(paper), completed=!!state.completed[pid], active=state.currentPaper?.id===pid;
      const node=document.createElement('div');
      node.className='paper-node'+(completed?' completed':'')+(active?' active':'')+(!unlocked?' locked':'');
      node.innerHTML=`<div class="node-icon">${completed?'✓':paper.icon}</div><div class="node-text"><div class="node-title">${paper.shortTitle}</div><div class="node-year">${paper.year} · ${paper.category}</div></div>`;
      if(unlocked) node.onclick=()=>openPaper(paper);
      tree.appendChild(node);
    });
  });
}
function updateProgressBar(){
  const total=PAPERS.length, done=Object.keys(state.completed).length;
  document.getElementById('progress-label').textContent=`${done} of ${total} completed`;
  document.getElementById('progress-fill').style.width=`${(done/total)*100}%`;
}
function openPaper(paper){
  state.currentPaper=paper; state.currentTab='learn'; state.quizState=null;
  document.getElementById('paper-tag').textContent=paper.category;
  document.getElementById('paper-title-main').textContent=paper.title;
  document.getElementById('paper-meta').textContent=`${paper.authors} · ${paper.venue}`;
  renderTree(); showTab('learn');
}
function showHome(){
  state.currentPaper=null;
  document.getElementById('paper-tag').textContent='Select a topic';
  document.getElementById('paper-title-main').textContent='Welcome to Paper Academy III';
  document.getElementById('paper-meta').textContent='';
  document.getElementById('tab-learn').classList.add('active');
  document.getElementById('tab-quiz').classList.remove('active');
  const unlocked=PAPERS.filter(p=>isPaperUnlocked(p)&&!state.completed[p.id]);
  const done=Object.keys(state.completed).length;
  document.getElementById('content').innerHTML=`<div class="fade-in" style="max-width:700px">
    <h2 style="font-size:1.4rem;font-weight:800;color:#fff;margin-bottom:8px">Docker, Kubernetes & MLOps</h2>
    <p style="color:#888;font-size:0.85rem;line-height:1.7;margin-bottom:8px">The infrastructure layer under every AI system — from Linux kernel primitives to production ML platforms. This is where Google's internal tools became the industry's default stack.</p>
    <p style="color:#555;font-size:0.75rem;margin-bottom:20px">Progress: ${done}/${PAPERS.length} completed</p>
    ${unlocked.length>0?`<div style="font-size:0.72rem;color:#00BCD4;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Ready to learn</div><div class="start-grid">${unlocked.map(p=>`<div class="start-card" onclick="openPaper(PAPERS.find(x=>x.id==='${p.id}'))"><div class="sc-year">${p.year} · ${p.category}</div><div class="sc-title">${p.icon} ${p.shortTitle}</div><div class="sc-desc">${p.tagline}</div></div>`).join('')}</div>`
    :`<div class="start-grid">
      <div class="start-card" onclick="openPaper(PAPERS.find(p=>p.id==='cgroups'))"><div class="sc-year">2006 · Linux</div><div class="sc-title">🐧 Start here: cgroups</div><div class="sc-desc">The kernel primitives that make containers possible</div></div>
      <div class="start-card" onclick="openPaper(PAPERS.find(p=>p.id==='twelvefactor'))"><div class="sc-year">2011 · Cloud Native</div><div class="sc-title">📋 12-Factor App</div><div class="sc-desc">The rulebook for cloud-native software</div></div>
      <div class="start-card" onclick="openPaper(PAPERS.find(p=>p.id==='techdebt'))"><div class="sc-year">2015 · MLOps</div><div class="sc-title">💸 ML Tech Debt</div><div class="sc-desc">Why 95% of ML code is not the model</div></div>
    </div>`}
  </div>`;
}
function showTab(tab){
  state.currentTab=tab;
  document.getElementById('tab-learn').classList.toggle('active',tab==='learn');
  document.getElementById('tab-quiz').classList.toggle('active',tab==='quiz');
  if(!state.currentPaper){showHome();return;}
  if(tab==='learn') renderLesson(); else renderQuiz();
}
function renderLesson(){
  const p=state.currentPaper;
  let html=`<div class="fade-in" style="max-width:700px"><div class="origin-badge">${p.authors}</div>`;
  p.lesson.forEach(sec=>{
    html+=`<div class="lesson-section"><h3>${sec.h}</h3><p>${sec.body}</p>`;
    if(sec.callout) html+=`<div class="callout">${sec.callout}</div>`;
    if(sec.callout_green) html+=`<div class="callout green">${sec.callout_green}</div>`;
    if(sec.callout_red) html+=`<div class="callout red">${sec.callout_red}</div>`;
    if(sec.callout_yellow) html+=`<div class="callout yellow">${sec.callout_yellow}</div>`;
    html+=`</div>`;
  });
  const done=!!state.completed[p.id];
  html+=`<div style="margin-top:24px;padding:16px;background:#16213E;border-radius:10px;border:1px solid #2a2a4a;display:flex;align-items:center;justify-content:space-between;">
    <span style="font-size:0.82rem;color:#888;">${done?'✓ Completed':'Ready to test your understanding?'}</span>
    <button onclick="showTab('quiz')" style="padding:9px 20px;background:${done?'#1DE9B622':'#00BCD4'};color:${done?'#1DE9B6':'#000'};border:${done?'1px solid #1DE9B644':'none'};border-radius:7px;font-size:0.8rem;font-weight:700;cursor:pointer;">
      ${done?'Retake Quiz':'Take Quiz →'}
    </button>
  </div></div>`;
  document.getElementById('content').innerHTML=html;
}
function renderQuiz(){
  const p=state.currentPaper;
  if(!state.quizState) state.quizState={current:0,passed:[],total:p.questions.length};
  const qs=state.quizState;
  if(qs.current>=qs.total){renderCompletion();return;}
  const q=p.questions[qs.current];
  let dots='';
  for(let i=0;i<qs.total;i++) dots+=`<div class="qp-dot ${i<qs.current?'done':i===qs.current?'current':''}"></div>`;
  const letters=['A','B','C','D'];
  const opts=q.opts.map((o,i)=>`<button class="option" id="opt-${i}" onclick="selectOption(${i})"><div class="option-letter">${letters[i]}</div><div class="option-text">${o}</div></button>`).join('');
  document.getElementById('content').innerHTML=`<div id="quiz-wrap" class="fade-in" style="max-width:680px">
    <div class="quiz-progress">${dots}</div>
    <div class="question-card">
      <div class="question-num">Question ${qs.current+1} of ${qs.total}</div>
      <div class="question-text">${q.q}</div>
      <div class="options">${opts}</div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">${qs.current+1<qs.total?'Next Question →':'See Results →'}</button>
    </div>
  </div>`;
}
function selectOption(idx){
  const p=state.currentPaper, q=p.questions[state.quizState.current];
  document.querySelectorAll('.option').forEach(o=>{o.classList.add('disabled');o.onclick=null;});
  const fb=document.getElementById('feedback'), nb=document.getElementById('next-btn');
  if(idx===q.correct){
    document.getElementById(`opt-${idx}`).classList.add('selected-right');
    fb.className='feedback right'; fb.innerHTML=`<strong>Correct.</strong> ${q.explain[idx]||'That\'s it.'}`;
    state.quizState.passed.push(true);
  } else {
    document.getElementById(`opt-${idx}`).classList.add('selected-wrong');
    document.getElementById(`opt-${q.correct}`).classList.add('revealed-right');
    fb.className='feedback wrong'; fb.innerHTML=`<strong>Not quite.</strong> ${q.explain[idx]}`;
    state.quizState.passed.push(false);
  }
  nb.style.display='block';
  nb.textContent=state.quizState.current+1<state.quizState.total?'Next Question →':'See Results →';
}
function nextQuestion(){ state.quizState.current++; renderQuiz(); }
function renderCompletion(){
  const p=state.currentPaper, qs=state.quizState;
  const correct=qs.passed.filter(Boolean).length, total=qs.total, passed=correct===total;
  if(passed&&!state.completed[p.id]){ state.completed[p.id]=true; saveState(); renderTree(); updateProgressBar(); }
  const newlyUnlocked=PAPERS.filter(np=>np.prereqs.includes(p.id)&&np.prereqs.every(pid=>state.completed[pid])&&!state.completed[np.id]);
  const sc=passed?'#1DE9B6':correct>=total*0.6?'#00BCD4':'#FF5252';
  let html=`<div class="fade-in" style="max-width:600px">
    <div style="background:#16213E;border:1px solid ${sc}44;border-radius:12px;padding:32px;text-align:center;margin-bottom:24px;">
      <div style="font-size:3rem;font-weight:900;color:${sc}">${correct}/${total}</div>
      <div style="font-size:1.1rem;font-weight:700;color:#fff;margin:8px 0">${passed?'Topic completed!':correct>=total*0.6?'Almost — review and retry':'Keep studying and retry'}</div>
      <div style="font-size:0.82rem;color:#888;margin-bottom:20px">${passed?p.title+' marked complete.':'Get all questions correct to unlock next topics.'}</div>`;
  if(passed&&newlyUnlocked.length>0){
    html+=`<div style="margin-bottom:16px"><div style="font-size:0.72rem;color:#1DE9B6;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Unlocked</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
    ${newlyUnlocked.map(np=>`<span style="background:#1DE9B611;border:1px solid #1DE9B644;color:#1DE9B6;padding:5px 14px;border-radius:20px;font-size:0.8rem;cursor:pointer" onclick="openPaper(PAPERS.find(p=>p.id==='${np.id}'))">${np.icon} ${np.shortTitle}</span>`).join('')}</div></div>`;
  }
  html+=`<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button onclick="state.quizState=null;renderQuiz()" style="padding:9px 18px;background:#16213E;color:#ccc;border:1px solid #2a2a4a;border-radius:7px;font-size:0.8rem;cursor:pointer">Retry Quiz</button>
    <button onclick="showTab('learn')" style="padding:9px 18px;background:#00BCD4;color:#000;border:none;border-radius:7px;font-size:0.8rem;font-weight:700;cursor:pointer">Back to Lesson</button>
    ${passed&&newlyUnlocked.length>0?`<button onclick="openPaper(PAPERS.find(p=>p.id==='${newlyUnlocked[0].id}'))" style="padding:9px 18px;background:#1DE9B6;color:#000;border:none;border-radius:7px;font-size:0.8rem;font-weight:700;cursor:pointer">Next Topic →</button>`:''}
  </div></div>`;
  html+=`<div style="margin-top:20px"><div style="font-size:0.75rem;color:#555;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px">Review</div>`;
  p.questions.forEach((q,i)=>{
    const ok=qs.passed[i];
    html+=`<div style="background:#16213E;border:1px solid ${ok?'#1DE9B622':'#FF525222'};border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px">
      <span style="color:${ok?'#1DE9B6':'#FF5252'};font-size:1rem;flex-shrink:0">${ok?'✓':'✗'}</span>
      <span style="font-size:0.8rem;color:#aaa;line-height:1.5">${q.q}</span></div>`;
  });
  html+=`</div></div>`;
  document.getElementById('content').innerHTML=html;
}
window.PAPERS=PAPERS;
renderTree(); updateProgressBar(); showHome();
</script>

<script>
(function(){
  var SU='https://gbkhkbfbarsnpbdkxzii.supabase.co';
  var SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia2hrYmZiYXJzbnBiZGt4emlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQzODAzNzMsImV4cCI6MjA0OTk1NjM3M30.mcOcC2GVEu_wD3xNBzSCC3MwDck3CIdmz4D8adU-bpI';
  var MOD='pa3';
  var LSK='pa3_completed';
  var FMT='object';

  function getIds(){
    var raw=localStorage.getItem(LSK);
    if(!raw) return [];
    try{
      var p=JSON.parse(raw);
      if(Array.isArray(p)) return p;
      return Object.keys(p).filter(function(k){return p[k];});
    }catch(e){return [];}
  }

  function push(){
    var email=localStorage.getItem('academy_email');
    if(!email) return;
    var ids=getIds();
    if(!ids.length) return;
    fetch(SU+'/rest/v1/academy_progress',{
      method:'POST',
      headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({email:email,module:MOD,completed:ids,updated_at:new Date().toISOString()})
    }).catch(function(){});
  }

  var _orig=Storage.prototype.setItem;
  Storage.prototype.setItem=function(k,v){
    _orig.call(this,k,v);
    if(k===LSK) push();
  };

  window.addEventListener('load',function(){
    var email=localStorage.getItem('academy_email');
    if(!email) return;
    fetch(SU+'/rest/v1/academy_progress?email=eq.'+encodeURIComponent(email)+'&module=eq.'+MOD+'&select=completed',{
      headers:{'apikey':SK,'Authorization':'Bearer '+SK}
    }).then(function(r){return r.json();}).then(function(rows){
      if(!rows||!rows[0]||!rows[0].completed||!rows[0].completed.length) return;
      var remote=rows[0].completed;
      var raw=localStorage.getItem(LSK);
      var merged;
      if(FMT==='object'){
        merged=raw?JSON.parse(raw):{};
        remote.forEach(function(id){merged[id]=true;});
        _orig.call(localStorage,LSK,JSON.stringify(merged));
      } else {
        var local=raw?JSON.parse(raw):[];
        var s=new Set(local);
        remote.forEach(function(id){s.add(id);});
        _orig.call(localStorage,LSK,JSON.stringify(Array.from(s)));
      }
      if(typeof renderTree==='function') renderTree();
      if(typeof updateProgressBar==='function') updateProgressBar();
      if(typeof render==='function') render();
    }).catch(function(){});
  });

  var btn=document.createElement('a');
  btn.href='index.html';
  btn.innerHTML='&#8592; Menu';
  btn.style.cssText='position:fixed;top:10px;left:10px;z-index:9999;background:#16213E;color:#7C4DFF;border:1px solid #7C4DFF44;padding:5px 12px;border-radius:7px;font-size:0.75rem;font-weight:700;text-decoration:none;opacity:0.8;transition:opacity 0.2s';
  btn.onmouseover=function(){this.style.opacity='1';};
  btn.onmouseout=function(){this.style.opacity='0.8';};
  document.body.appendChild(btn);
})();
</script>
