<script>
// ─── DATA ────────────────────────────────────────────────────────────────────

const TRACKS = [
  { id: 'prob', label: 'Probability & Statistics' },
  { id: 'regression', label: 'Regression' },
  { id: 'classification', label: 'Classification' },
  { id: 'deep', label: 'Deep Learning' }
];

const PAPERS = [

// ─── TRACK 1: PROBABILITY ────────────────────────────────────────────────────

{
  id: 'bayes', track: 'prob', prereqs: [],
  title: "Bayes' Theorem",
  authors: "Thomas Bayes (1763) · Pierre-Simon Laplace · DAT401 Core",
  lesson: `
<div class="prereq-box">Starting point — no prerequisites</div>
<div class="eq-box">
  <span class="eq-name">Bayes' Theorem</span>
  <div class="eq-line">P(A|B) = P(B|A) &middot; P(A) / P(B)</div>
  <div class="eq-sub">where P(B) = P(B|A)&middot;P(A) + P(B|&not;A)&middot;P(&not;A) &nbsp;[Total Probability]</div>
</div>
<div class="intuition-box">
  <span class="label">What it means</span>
  Bayes' theorem <strong>updates our belief P(A)</strong> after observing evidence B.
  P(A) is the <strong>prior</strong> (belief before). P(A|B) is the <strong>posterior</strong> (belief after seeing B).
  P(B|A) is the <strong>likelihood</strong> (how probable is B if A is true). P(B) normalizes.
  Used in: spam filters, medical diagnosis, Naive Bayes classifiers, Bayesian neural networks.
</div>
<div class="example-box">
  <div class="example-title">Worked Example &mdash; Medical Test</div>
  <div class="step"><strong>Setup:</strong> Disease prevalence P(D)=0.03. Sensitivity P(+|D)=0.90. False positive rate P(+|&not;D)=0.25.</div>
  <div class="step"><strong>Question:</strong> You test positive. What is P(D|+)?</div>
  <div class="step"><strong>Step 1 &mdash; P(+) via Total Probability:</strong></div>
  <div class="step">P(+) = 0.90&times;0.03 + 0.25&times;0.97 = 0.027 + 0.2425 = <code>0.2695</code></div>
  <div class="step"><strong>Step 2 &mdash; Apply Bayes:</strong></div>
  <div class="step">P(D|+) = P(+|D)&middot;P(D) / P(+) = 0.027 / 0.2695 &asymp; <span class="step-result">0.100</span></div>
  <div class="step">Even with a positive test, only <strong>10% chance of disease</strong>. Low prior dominates.</div>
</div>`,
  questions: [
    {
      text: 'A spam filter has P(spam)=0.40. The word "URGENT" appears in 70% of spam and 5% of legitimate email. What is P(spam | email contains URGENT)?',
      options: [
        { letter: 'A', text: '0.70', correct: false, wrongExplanation: "That's P(URGENT|spam) — the likelihood, not the posterior. You must weight it by the prior and normalize by P(URGENT) across all emails." },
        { letter: 'B', text: '0.50', correct: false, wrongExplanation: "That's the result if P(spam)=0.5. The prior here is 0.40, and URGENT is much more common in spam (70% vs 5%), so the posterior must be well above 0.5." },
        { letter: 'C', text: '0.903', correct: true },
        { letter: 'D', text: '0.40', correct: false, wrongExplanation: "That's the prior P(spam) before observing any evidence. Bayes updates this: P(URGENT)=0.70&times;0.40+0.05&times;0.60=0.31. Posterior=0.28/0.31&asymp;0.903." }
      ]
    },
    {
      text: "In the formula P(A|B) = P(B|A) &middot; P(A) / P(B), which term is the 'prior'?",
      options: [
        { letter: 'A', text: 'P(A|B)', correct: false, wrongExplanation: "P(A|B) is the posterior — our updated belief in A after observing B. The prior is what we believed before seeing any evidence." },
        { letter: 'B', text: 'P(B|A)', correct: false, wrongExplanation: "P(B|A) is the likelihood — how probable the evidence B is, given A is true. It measures how well A 'explains' B." },
        { letter: 'C', text: 'P(A)', correct: true },
        { letter: 'D', text: 'P(B)', correct: false, wrongExplanation: "P(B) is the normalizing constant (marginal likelihood), computed via Total Probability. The prior is our initial belief P(A) before observing evidence." }
      ]
    },
    {
      text: "A disease test has 99% sensitivity P(+|D)=0.99 and 99% specificity P(-|\u00acD)=0.99. Disease prevalence is 0.1% (P(D)=0.001). What is P(D|+)?",
      options: [
        { letter: 'A', text: '0.99', correct: false, wrongExplanation: "That's the sensitivity, not the posterior. Even with 99% accuracy, a very rare disease (0.1%) makes false positives far outnumber true positives." },
        { letter: 'B', text: '0.50', correct: false, wrongExplanation: "The prior is so small that even a near-perfect test gives a much lower posterior. P(+)=0.99\u00d70.001+0.01\u00d70.999\u22480.01098; P(D|+)=0.00099/0.01098\u22480.09." },
        { letter: 'C', text: '0.09', correct: true },
        { letter: 'D', text: '0.001', correct: false, wrongExplanation: "That's the prior P(D). The positive test result updates this upward. With P(+)&asymp;0.011, posterior P(D|+)=0.00099/0.011&asymp;0.09 — 90&times; larger than the prior." }
      ]
    }
  ]
},

{
  id: 'expected_value', track: 'prob', prereqs: [],
  title: 'Expected Value E[X]',
  authors: 'Christiaan Huygens (1657) · Pascal & de Fermat · DAT401',
  lesson: `
<div class="prereq-box">Starting point &mdash; no prerequisites</div>
<div class="eq-box">
  <span class="eq-name">Expected Value (Discrete)</span>
  <div class="eq-line">E[X] = &Sigma; x&middot;P(X = x)</div>
  <div class="eq-sub">Linearity: E[aX + b] = a&middot;E[X] + b &nbsp;&middot;&nbsp; E[X+Y] = E[X] + E[Y]</div>
</div>
<div class="intuition-box">
  <span class="label">What it means</span>
  E[X] is the <strong>long-run average</strong> value over many repetitions. It's the center of mass of the distribution.
  <strong>Linearity of expectation</strong> is the key property: constants scale and shift the result.
  E[X+Y]=E[X]+E[Y] holds even when X and Y are dependent. Used everywhere: loss functions, risk, value of information.
</div>
<div class="example-box">
  <div class="example-title">Worked Example &mdash; Dice Game</div>
  <div class="step"><strong>Setup:</strong> Roll a fair 6-sided die. Win $X where X = number rolled.</div>
  <div class="step">E[X] = 1(1/6)+2(1/6)+3(1/6)+4(1/6)+5(1/6)+6(1/6) = 21/6 = <span class="step-result">3.5</span></div>
  <div class="step">You'd pay up to $3.50 per game to break even.</div>
  <div class="step"><strong>Now:</strong> Y = 3X + 5 (win 3&times; roll plus $5 bonus)</div>
  <div class="step">E[Y] = 3&middot;E[X] + 5 = 3(3.5) + 5 = 10.5 + 5 = <span class="step-result">$15.50</span></div>
  <div class="step">Linearity avoids recomputing the whole sum from scratch.</div>
</div>`,
  questions: [
    {
      text: 'X has P(X=0)=0.5, P(X=2)=0.3, P(X=10)=0.2. What is E[2X &minus; 1]?',
      options: [
        { letter: 'A', text: '2.6', correct: false, wrongExplanation: "That's E[X] = 0(0.5)+2(0.3)+10(0.2) = 2.6. You still need to apply the linear transformation: E[2X&minus;1] = 2&middot;E[X] &minus; 1." },
        { letter: 'B', text: '4.2', correct: true },
        { letter: 'C', text: '5.2', correct: false, wrongExplanation: "That's 2&middot;E[X] = 2(2.6) = 5.2. You forgot to subtract 1. The formula is E[aX+b] = a&middot;E[X]+b, so b=&minus;1 must be added." },
        { letter: 'D', text: '1.6', correct: false, wrongExplanation: "E[X]=2.6, so E[2X&minus;1] = 2(2.6)&minus;1 = 5.2&minus;1 = 4.2. Check: don't multiply the constant b by a." }
      ]
    },
    {
      text: 'E[X]=4 and E[Y]=7. What is E[3X &minus; 2Y + 5]?',
      options: [
        { letter: 'A', text: '3', correct: true },
        { letter: 'B', text: '9', correct: false, wrongExplanation: "That's 3&times;4&minus;2&times;7 = 12&minus;14 = &minus;2, without the +5. Apply all three terms: 3(4)&minus;2(7)+5 = 12&minus;14+5 = 3." },
        { letter: 'C', text: '&minus;2', correct: false, wrongExplanation: "That's 3E[X]&minus;2E[Y] = 12&minus;14 = &minus;2, but you forgot the additive constant +5. Linearity: E[aX+bY+c] = aE[X]+bE[Y]+c." },
        { letter: 'D', text: '19', correct: false, wrongExplanation: "That would be if you added instead of subtracted: 3(4)+2(7)+5 = 31 &ne; 19. The coefficient on Y is &minus;2: E[&minus;2Y] = &minus;2(7) = &minus;14." }
      ]
    },
    {
      text: 'A game: flip a fair coin. Heads you win $6, tails you lose $2. What is the expected net gain per flip?',
      options: [
        { letter: 'A', text: '$4', correct: false, wrongExplanation: "That's the win amount if you only considered heads. You must weight by probabilities: E = 0.5(6) + 0.5(&minus;2) = 3&minus;1 = $2." },
        { letter: 'B', text: '$2', correct: true },
        { letter: 'C', text: '$0', correct: false, wrongExplanation: "Zero E[X] would require equal magnitude wins and losses (e.g., win $2 or lose $2). Here the win is $6 vs. loss of $2, so the expectation is positive: 0.5(6)+0.5(&minus;2) = $2." },
        { letter: 'D', text: '$3', correct: false, wrongExplanation: "That's just 0.5&times;$6 &mdash; the expected win on heads alone, ignoring the tails loss. Full E = 0.5(6)+0.5(&minus;2) = 3&minus;1 = $2." }
      ]
    }
  ]
},

{
  id: 'variance', track: 'prob', prereqs: ['expected_value'],
  title: 'Variance and Standard Deviation',
  authors: 'Carl Friedrich Gauss (1809) · DAT401 Core',
  lesson: `
<div class="prereq-box">Requires: <span>Expected Value E[X]</span></div>
<div class="eq-box">
  <span class="eq-name">Variance &mdash; Computational Formula</span>
  <div class="eq-line">Var(X) = E[X&sup2;] &minus; (E[X])&sup2;</div>
  <div class="eq-sub">&sigma; = &radic;Var(X) &nbsp;&middot;&nbsp; Var(aX+b) = a&sup2;&middot;Var(X) &nbsp;&middot;&nbsp; Var(X+Y) = Var(X)+Var(Y) [if independent]</div>
</div>
<div class="intuition-box">
  <span class="label">What it means</span>
  Variance measures <strong>spread around the mean &mu; = E[X]</strong>. The shortcut E[X&sup2;]&minus;(E[X])&sup2; avoids computing (x&minus;&mu;)&sup2; for each x.
  Critical rules: <strong>Var(aX+b) = a&sup2;Var(X)</strong> (additive constant b has no effect on spread; only multiplicative constant matters, squared).
  For independent X,Y: Var(X+Y) = Var(X)+Var(Y).
</div>
<div class="example-box">
  <div class="example-title">Worked Example</div>
  <div class="step"><strong>X:</strong> P(X=1)=0.25, P(X=3)=0.50, P(X=5)=0.25</div>
  <div class="step"><strong>E[X]:</strong> 1(0.25)+3(0.50)+5(0.25) = 0.25+1.5+1.25 = <code>3.0</code></div>
  <div class="step"><strong>E[X&sup2;]:</strong> 1(0.25)+9(0.50)+25(0.25) = 0.25+4.5+6.25 = <code>11.0</code></div>
  <div class="step"><strong>Var(X):</strong> 11.0 &minus; 3.0&sup2; = 11.0 &minus; 9.0 = <span class="step-result">2.0</span></div>
  <div class="step"><strong>&sigma;:</strong> &radic;2.0 &asymp; <span class="step-result">1.414</span></div>
  <div class="step"><strong>Y = 2X+3:</strong> Var(Y) = 2&sup2;&times;Var(X) = 4&times;2.0 = <span class="step-result">8.0</span> (the +3 shifts mean, not spread)</div>
</div>`,
  questions: [
    {
      text: 'Random variable X has E[X]=5 and E[X&sup2;]=30. What is Var(3X)?',
      options: [
        { letter: 'A', text: '5', correct: false, wrongExplanation: "That's Var(X) = E[X&sup2;]&minus;(E[X])&sup2; = 30&minus;25 = 5. You still need to apply the scaling rule Var(aX) = a&sup2;&middot;Var(X) with a=3." },
        { letter: 'B', text: '15', correct: false, wrongExplanation: "That's 3&middot;Var(X) = 3&times;5 = 15. The rule is Var(aX) = a&sup2;&middot;Var(X), not a&middot;Var(X). Multiply by 3&sup2;=9, not 3." },
        { letter: 'C', text: '45', correct: true },
        { letter: 'D', text: '75', correct: false, wrongExplanation: "Var(X)&times;(3&times;E[X]) = 5&times;15 = 75. This mixes up scaling with the mean. The rule is simply Var(3X) = 9&middot;Var(X) = 9&times;5 = 45." }

      text: 'Var(X) = 9. What is Var(X + 10)?',
      options: [
        { letter: 'A', text: '19', correct: false, wrongExplanation: "Adding a constant shifts the distribution but not its spread. Var(X+10) = Var(X) + Var(10) = Var(X) + 0 = 9. Var of a constant is always 0." },
        { letter: 'B', text: '90', correct: false, wrongExplanation: "That's 10&times;Var(X) = 90. The +10 is additive, not multiplicative. Var(X+b) = Var(X) for any constant b." },
        { letter: 'C', text: '9', correct: true },
        { letter: 'D', text: '100', correct: false, wrongExplanation: "That's Var(X+10) if both terms were random. But 10 is a constant with Var=0. Adding a constant slides the whole distribution without changing its width." }

      text: 'X and Y are independent, each with Var(X)=Var(Y)=4. What is Var(X &minus; Y)?',
      options: [
        { letter: 'A', text: '0', correct: false, wrongExplanation: "Var(X&minus;Y)=0 only if X and Y are identical (not just equal variance). Independence means Var(X&minus;Y) = Var(X)+Var(&minus;Y) = Var(X)+(&minus;1)&sup2;Var(Y) = 4+4 = 8." },
        { letter: 'B', text: '4', correct: false, wrongExplanation: "That's Var(X) alone. Subtraction still adds variances for independent variables: Var(X&minus;Y) = Var(X)+Var(Y) = 8. Note (&minus;1)&sup2;=1 so signs don't reduce variance." },

        { letter: 'D', text: '16', correct: false, wrongExplanation: "That would be Var(X+Y) = 8 doubled. Var(X&minus;Y) = Var(X)+(&minus;1)&sup2;Var(Y) = 4+4 = 8, the same as Var(X+Y) for independent variables." }

<div class="eq-box">

  <div class="eq-line">&beta;&#x0302; = (X&#x1D40;X)&#x207B;&#x00B9; X&#x1D40;y</div>

</div>
<div class="intuition-box">

  We want &beta; that minimizes RSS. Setting the derivative &part;RSS/&part;&beta;=0 gives the normal equation X&#x1D40;(y&minus;X&beta;)=0,
  which rearranges to &beta;&#x0302;=(X&#x1D40;X)&sup2;X&#x1D40;y. The matrix (X&#x1D40;X) is always square (p&times;p); when features are linearly independent, it's invertible.
  When multicollinearity exists, add regularization (Ridge: (X&#x1D40;X+&lambda;I)&sup2;).

  <div class="step"><strong>Data:</strong> (x,y) = (1,2),(2,3),(3,5) &rarr; x&#x0304;=2, y&#x0304;=10/3&asymp;3.33</div>

  <div class="step"><strong>TSS:</strong> (2&minus;3.33)&sup2;+(3&minus;3.33)&sup2;+(5&minus;3.33)&sup2; = 1.769+0.109+2.789 = <code>4.667</code></div>

{

  title: 'Maximum Likelihood Estimation',
  authors: 'R.A. Fisher (1912) · DAT401 Module 5',
  lesson: `
<div class="prereq-box">Requires: <span>Bayes' Theorem</span>, <span>Expected Value E[X]</span></div>
<div class="eq-box">
  <span class="eq-name">Maximum Likelihood Estimation</span>
  <div class="eq-line">L(&theta;) = &Pi; P(x&shy; | &theta;)</div>
  <div class="eq-line">log L(&theta;) = &Sigma; log P(x&shy; | &theta;)</div>
  <div class="eq-sub">&theta;&#x0302;_MLE = argmax<sub>&theta;</sub> log L(&theta;)</div>
</div>
<div class="intuition-box">
  <span class="label">What it means</span>
  MLE finds the parameter &theta; that makes the observed data <strong>most probable</strong>.
  We maximize <strong>log-likelihood</strong> instead of likelihood because: (1) log turns products into sums &mdash; easier to differentiate;
  (2) log is monotone so same argmax; (3) avoids numerical underflow from multiplying many small probabilities.
  Setting d(log L)/d&theta;=0 and solving gives &theta;&#x0302;.
</div>
<div class="example-box">
  <div class="example-title">Worked Example &mdash; Bernoulli MLE</div>
  <div class="step"><strong>Data:</strong> Coin flips = {H,H,T,H,T} &rarr; 3 heads out of 5</div>
  <div class="step"><strong>L(p) = p&sup3;(1&minus;p)&sup2;</strong></div>
  <div class="step"><strong>log L(p)</strong> = 3&middot;log(p) + 2&middot;log(1&minus;p)</div>
  <div class="step"><strong>Maximize:</strong> d/dp [log L] = 3/p &minus; 2/(1&minus;p) = 0</div>
  <div class="step">&rarr; 3(1&minus;p) = 2p &rarr; 3 = 5p &rarr; <span class="step-result">p&#x0302; = 3/5 = 0.60</span></div>
  <div class="step">MLE for Bernoulli is always the <strong>sample proportion</strong>.</div>
</div>`,

  <div class="eq-line">&sigma;(z) = 1 / (1 + e&sup2;)</div>

</div>
<div class="intuition-box">
  <span class="label">What it means</span>
  Sigmoid <strong>squashes any real number z into (0,1)</strong>, making it interpretable as a probability.
  It's the link function in logistic regression: z = &beta;&sub;0;+&beta;&sub;1;x&sub;1;+&hellip; is the linear part; &sigma;(z) converts it to P(y=1|x).
  The derivative &sigma;'(z) = &sigma;(z)(1&minus;&sigma;(z)) is elegant and cheap to compute &mdash; essential for backpropagation.
</div>
<div class="example-box">
  <div class="example-title">Worked Example &mdash; Spam Classifier</div>

</div>`,

  lesson: `
<div class="prereq-box">Requires: <span>Cross-Entropy Loss</span></div>
<div class="eq-box">

  <div class="eq-line">&part;L/&part;w = (&part;L/&part;a) &middot; (&part;a/&part;z) &middot; (&part;z/&part;w)</div>
  <div class="eq-sub">z = w&middot;x+b &nbsp;&middot;&nbsp; a = &sigma;(z) &nbsp;&middot;&nbsp; L = &minus;log(a) [binary, y=1]</div>
</div>
<div class="intuition-box">
  <span class="label">What it means</span>
  Backpropagation computes <strong>&part;L/&part;w for every weight</strong> by repeatedly applying the chain rule from output to input.
  Each layer's gradient depends on the gradient from the layer above (closer to the output).
  <strong>Weight update:</strong> w &larr; w &minus; lr&middot;(&part;L/&part;w).
  Without backprop, we'd need 2 forward passes per parameter to estimate gradients numerically &mdash; impractical for millions of weights.
</div>

  <div class="step"><strong>&part;L/&part;a</strong> = &minus;1/a = &minus;1/0.731 &asymp; <code>&minus;1.368</code></div>
  <div class="step"><strong>&part;a/&part;z</strong> = &sigma;(z)(1&minus;&sigma;(z)) = 0.731&times;0.269 &asymp; <code>0.197</code></div>

        { letter: 'C', text: 'Forward propagation already computed the gradients; backprop just reverses their order', correct: false, wrongExplanation: "Forward propagation computes activations, not gradients. Gradients are a separate computation using the chain rule in reverse." },

      ]
    },
    {
      text: 'In the worked example, w increased from 0.5 to 0.554 after one update. Why did w increase?',
      options: [
        { letter: 'A', text: 'The loss was greater than 1.0, so weights always increase', correct: false, wrongExplanation: "Loss magnitude doesn't determine increase vs. decrease. The sign of the gradient determines direction: negative gradient &rarr; weight increases." },
        { letter: 'B', text: 'The gradient &part;L/&part;w was negative (&minus;0.539), so w &larr; w &minus; lr&times;(negative) = w + positive', correct: true },
        { letter: 'C', text: 'The learning rate lr=0.1 is positive, which always causes weight increases', correct: false, wrongExplanation: "lr is always positive. Direction depends on gradient sign. w &larr; w &minus; lr&times;gradient: positive gradient decreases w, negative gradient increases w." },
        { letter: 'D', text: 'Sigmoid outputs less than 1.0 always require the weight to increase', correct: false, wrongExplanation: "Weight direction depends on whether increasing w helps reduce loss. With y=1, p=0.731 (underpredicting), increasing w raises z and p, which reduces cross-entropy loss. The gradient captures this." }
      ]
    },
    {
      text: 'What causes vanishing gradients in deep networks with sigmoid activations?',
      options: [
        { letter: 'A', text: 'Sigmoid outputs between 0 and 1 are directly multiplied into the gradient at each layer', correct: false, wrongExplanation: "The activations themselves aren't multiplied; the DERIVATIVE &sigma;'(z) is. And &sigma;'(z) = &sigma;(z)(1&minus;&sigma;(z)) &le; 0.25 &mdash; that's the problematic shrinkage." },
        { letter: 'B', text: "&sigma;'(z) = &sigma;(z)(1&minus;&sigma;(z)) &le; 0.25 always; chaining many such terms through the chain rule makes early-layer gradients exponentially small", correct: true },

        { letter: 'D', text: 'Deep networks have too many parameters, causing the gradient to be divided by layer count', correct: false, wrongExplanation: "Gradients are not divided by layer count. Vanishing occurs because each sigmoid layer multiplies the gradient by at most 0.25, exponentially shrinking it over many layers." }
      ]
    }
  ]
}

];

// ─── STATE ───────────────────────────────────────────────────────────────────

const state = {
  active: null,
  tab: 'lesson',
  answered: {},
  qIndex: 0,
  completed: new Set(JSON.parse(localStorage.getItem('math1_completed') || '[]'))
};

function save() {
  localStorage.setItem('math1_completed', JSON.stringify([...state.completed]));
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function isPaperUnlocked(paper) {
  return paper.prereqs.every(id => state.completed.has(id));
}

function updateBadge() {
  document.getElementById('badge').textContent = `${state.completed.size} / 12 completed`;
}

function getTrackLabel(trackId) {
  return TRACKS.find(t => t.id === trackId)?.label || trackId;
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '';

  TRACKS.forEach(track => {
    const papers = PAPERS.filter(p => p.track === track.id);
    if (!papers.length) return;

    html += `<div class="track-label">${track.label}</div>`;

    papers.forEach(paper => {
      const unlocked = isPaperUnlocked(paper);
      const done = state.completed.has(paper.id);
      const active = state.active === paper.id;

      let icon = unlocked ? (done ? '&#10003;' : '&#9675;') : '&#128274;';
      let classes = 'sidebar-item';
      if (active) classes += ' active';
      if (!unlocked) classes += ' locked';

      const clickHandler = unlocked ? `onclick="openPaper('${paper.id}')"` : '';

      html += `
        <div class="${classes}" ${clickHandler}>
          <span class="si-icon">${icon}</span>
          <span class="si-title">${paper.title}</span>
          ${done ? '<span class="si-done">&#931;</span>' : ''}
        </div>
      `;
    });
  });

  sidebar.innerHTML = html;
}

// ─── WELCOME ─────────────────────────────────────────────────────────────────

function renderWelcome() {
  document.getElementById('paper-view').style.display = 'none';
  const wv = document.getElementById('welcome-view');
  wv.style.display = 'block';

  wv.innerHTML = `
    <div id="welcome-screen">
      <h2>ML Mathematics</h2>
      <p class="sub">The equations behind the papers &mdash; same math from DAT401 &amp; CIS412, applied to AI/ML concepts.</p>

      <div class="stats-row">
        <div class="stat-card">
          <div class="num">12</div>
          <div class="lbl">Equations</div>
        </div>
        <div class="stat-card">
          <div class="num">36</div>
          <div class="lbl">Problems</div>
        </div>
        <div class="stat-card">
          <div class="num">${state.completed.size}</div>
          <div class="lbl">Solved</div>
        </div>
      </div>

      <p class="welcome-desc">
        Each paper covers one ML equation: the formula displayed prominently, the intuition explained, a worked numerical example, then 3 problems to solve. Must pass all 3 to unlock dependent topics.
      </p>

      <div class="start-btns">
        <button class="btn" onclick="openPaper('bayes')">Start: Bayes' Theorem</button>
        <button class="btn secondary" onclick="openPaper('expected_value')">Start: Expected Value</button>
        <button class="btn secondary" onclick="openPaper('knn')">Start: KNN Distances</button>
      </div>

      <div class="track-overview">
        <h3>Tracks</h3>
        <div class="track-list">
          ${TRACKS.map(t => {
            const count = PAPERS.filter(p => p.track === t.id).length;
            const done = PAPERS.filter(p => p.track === t.id && state.completed.has(p.id)).length;
            return `<div class="track-chip"><span>${t.label}</span><br>${done}/${count} complete</div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

// ─── OPEN PAPER ──────────────────────────────────────────────────────────────

function openPaper(id) {
  const paper = PAPERS.find(p => p.id === id);
  if (!paper || !isPaperUnlocked(paper)) return;

  state.active = id;
  state.tab = 'lesson';
  state.answered = {};
  state.qIndex = 0;

  document.getElementById('welcome-view').style.display = 'none';
  document.getElementById('paper-view').style.display = 'block';

  renderSidebar();
  renderTabContent();

  document.getElementById('main').scrollTop = 0;
}

// ─── TAB CONTENT ─────────────────────────────────────────────────────────────

function showTab(tab) {
  state.tab = tab;
  renderTabContent();
}

function renderTabContent() {
  const paper = PAPERS.find(p => p.id === state.active);
  if (!paper) return;

  const pv = document.getElementById('paper-view');

  const lessonActive = state.tab === 'lesson' ? 'active' : '';
  const quizActive = state.tab === 'quiz' ? 'active' : '';

  pv.innerHTML = `
    <div class="paper-header">
      <div class="track-badge">${getTrackLabel(paper.track)}</div>
      <h2>${paper.title}</h2>
      <div class="authors">${paper.authors}</div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${lessonActive}" onclick="showTab('lesson')">Lesson</button>
      <button class="tab-btn ${quizActive}" onclick="showTab('quiz')">Problems (${paper.questions.length} questions)</button>
    </div>
    <div id="tab-body"></div>
  `;

  if (state.tab === 'lesson') {
    renderLesson(paper);
  } else {
    renderQuiz();
  }
}

// ─── LESSON ──────────────────────────────────────────────────────────────────

function renderLesson(paper) {
  const body = document.getElementById('tab-body');
  body.innerHTML = `
    <div class="lesson-body">${paper.lesson}</div>
    <div style="margin-top:28px;">
      <button class="btn" onclick="showTab('quiz')">Solve the Problems &rarr;</button>
    </div>
  `;
}

// ─── QUIZ ────────────────────────────────────────────────────────────────────

function renderQuiz() {
  const paper = PAPERS.find(p => p.id === state.active);
  const body = document.getElementById('tab-body');

  const q = paper.questions[state.qIndex];
  const answered = state.answered[state.qIndex];
  const total = paper.questions.length;
  const doneCount = Object.keys(state.answered).length;

  let optionsHtml = q.options.map(opt => {
    let cls = 'option-btn';
    let extraHtml = '';

    if (answered !== undefined) {
      if (opt.correct) {
        cls += ' correct';
        extraHtml = `<div class="correct-explanation" style="display:block;">Correct.</div>`;
      } else if (opt.letter === answered && !opt.correct) {
        cls += ' wrong';
        extraHtml = `<div class="wrong-explanation" style="display:block;">${opt.wrongExplanation}</div>`;
      }
    }

    const disabled = answered !== undefined ? 'disabled' : '';
    const clickHandler = answered === undefined ? `onclick="selectOption('${opt.letter}')"` : '';

    return `
      <button class="${cls}" ${disabled} ${clickHandler}>
        <span class="option-letter">${opt.letter}.</span>${opt.text}
      </button>
      ${extraHtml}
    `;
  }).join('');

  let nextHtml = '';
  if (answered !== undefined) {
    if (state.qIndex < total - 1) {
      nextHtml = `<button class="btn next-btn" onclick="nextQ()">Next Problem &rarr;</button>`;
    } else {
      nextHtml = `<button class="btn next-btn" onclick="checkDone()">Check Results</button>`;
    }
  }

  body.innerHTML = `
    <div class="quiz-progress">Problem <span>${state.qIndex + 1}</span> of <span>${total}</span> &nbsp;|&nbsp; ${doneCount} answered</div>
    <div class="question-card">
      <div class="question-text">${q.text}</div>
      ${optionsHtml}
      ${nextHtml}
    </div>
  `;
}

function selectOption(letter) {
  if (state.answered[state.qIndex] !== undefined) return;
  state.answered[state.qIndex] = letter;
  renderQuiz();
}

function nextQ() {
  const paper = PAPERS.find(p => p.id === state.active);
  if (state.qIndex < paper.questions.length - 1) {
    state.qIndex++;
    renderQuiz();
    document.getElementById('main').scrollTop = 0;
  }
}

function checkDone() {
  const p = PAPERS.find(x => x.id === state.active);
  const allPass = p.questions.every((q, i) => {
    const a = state.answered[i];
    return a !== undefined && q.options.find(o => o.letter === a)?.correct;
  });

  if (allPass) {
    state.completed.add(p.id);
    save();
    updateBadge();
    renderSidebar();
    renderCompletion(p);
  } else {
    state.qIndex = p.questions.findIndex((q, i) => {
      const a = state.answered[i];
      return !(a !== undefined && q.options.find(o => o.letter === a)?.correct);
    });
    renderQuiz();
  }
}

// ─── COMPLETION ──────────────────────────────────────────────────────────────

function renderCompletion(paper) {
  const body = document.getElementById('tab-body');

  const unlocked = PAPERS.filter(p =>
    p.prereqs.includes(paper.id) && isPaperUnlocked(p)
  );

  let unlockedHtml = '';
  if (unlocked.length > 0) {
    unlockedHtml = `
      <div class="unlocked-list">
        <h4>Newly Unlocked</h4>
        ${unlocked.map(p => `
          <div class="unlocked-item" onclick="openPaper('${p.id}')">
            ${p.title}
          </div>
        `).join('')}
      </div>
    `;
  }

  const allDone = state.completed.size === PAPERS.length;

  body.innerHTML = `
    <div class="completion-card">
      <div class="completion-icon">&#931;</div>
      <h2>${paper.title} Solved</h2>
      <p>You passed all ${paper.questions.length} problems. This equation is now marked complete.</p>
      ${unlockedHtml}
      ${allDone ? '<p style="color:#FFB300;font-weight:700;font-size:1rem;">All 12 equations complete. Math mastered.</p>' : ''}
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;">
        <button class="btn secondary" onclick="renderWelcome()">Back to Overview</button>
        ${unlocked.length > 0 ? `<button class="btn" onclick="openPaper('${unlocked[0].id}')">Next: ${unlocked[0].title}</button>` : ''}
      </div>
    </div>
  `;
}

// ─── INIT ────────────────────────────────────────────────────────────────────

updateBadge();
renderSidebar();
renderWelcome();
</script>
