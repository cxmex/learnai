<style>

<script>
const TRACKS = [
  { id: 'cloud_economics', label: 'Cloud Economics', papers: ['cloud_pricing','gpu_cost_math','token_economics'] },
  { id: 'finops_framework_track', label: 'FinOps Framework', papers: ['finops_framework','cost_allocation','reserved_capacity'] },
  { id: 'k8s_standards', label: 'Kubernetes & Standards', papers: ['opencost','focus_spec'] },
  { id: 'ai_finops', label: 'AI FinOps', papers: ['model_routing','finops_ai'] }
];

const PAPERS = [
  {
    id: 'cloud_pricing',
    title: 'Cloud Pricing Models',
    track: 'cloud_economics',
    authors: 'AWS/GCP/Azure pricing documentation + FinOps Foundation',
    prereqs: [],
    lesson: `<p>Cloud providers offer three fundamental pricing models for compute resources, each with distinct economics. Understanding these models is prerequisite knowledge for all AI cost engineering decisions.</p>
<p><strong>On-Demand Pricing</strong> charges by the hour or second with no commitment. On AWS, a <code>p4d.24xlarge</code> (8x A100 80GB) costs approximately $32.77/hour on-demand. On GCP, an <code>a2-megagpu-16g</code> (16x A100 40GB) runs ~$55.74/hour. These prices include no discount — you're paying for the ability to terminate at any time. On-demand is appropriate for: unpredictable spikes, short-duration jobs under 1 hour, and development/testing where waste is acceptable.</p>
<p><strong>Reserved Instances and Committed Use</strong>: Reserving capacity in 1-year or 3-year terms yields 30–60% discounts versus on-demand. AWS Reserved Instances for a <code>p3.2xlarge</code> (1x V100) drop from ~$3.06/hour on-demand to ~$1.53/hour with a 1-year no-upfront reservation — exactly 50% savings. The math: if you run 720 hours/month on a $3.06/hour instance, on-demand costs $2,203/month. A 1-year reservation at $1.53/hour costs $1,102/month — a $13,212/year saving on a single instance. For a fleet of 20 training nodes, that's $264,240/year.</p>
<p><strong>Spot and Preemptible Instances</strong> offer the steepest discounts — 60–90% off on-demand — but can be reclaimed with 2 minutes notice (AWS) or 30 seconds (GCP). A <code>p4d.24xlarge</code> spot price averages around $9.82/hour, versus $32.77 on-demand — a 70% discount. Spot is viable for: fault-tolerant training jobs with checkpointing every 15–30 minutes, batch inference pipelines, and data preprocessing. It is not viable for: real-time inference APIs with SLA requirements, stateful jobs without checkpointing.</p>
<p><strong>GPU Instance Type Economics</strong>:</p>
<ul>
  <li><strong>A100 40GB (AWS p4d):</strong> ~$4.10/GPU-hour on-demand; optimized for mixed training/inference</li>
  <li><strong>A100 80GB (AWS p4de):</strong> ~$5.23/GPU-hour; necessary for 70B+ parameter models</li>
  <li><strong>H100 80GB (AWS p5):</strong> ~$12.29/GPU-hour; 3x faster than A100 for transformer training</li>
  <li><strong>Google TPU v5e:</strong> ~$1.20/chip-hour at scale; most cost-efficient for JAX/TensorFlow inference at high throughput</li>
</ul>
<p><strong>Pay-Per-Token API Economics</strong>: Instead of managing GPU infrastructure, you pay per token processed. API pricing as of mid-2025: GPT-4o: $2.50/1M input, $10.00/1M output tokens. Claude Sonnet: $3.00/$15.00. Claude Haiku: $0.25/$1.25. Llama 3 70B (via Groq): ~$0.59/1M flat. The crossover point: if you generate fewer than ~50M tokens/day, API pricing typically beats self-hosted GPU costs when accounting for engineering overhead, idle time, and redundancy.</p>
<p><strong>Pricing Model Selection Framework</strong>: (1) Is the workload interruptible with checkpointing? → Spot. (2) Is baseline utilization &gt;60% for 12+ months? → Reserved. (3) Is throughput under 50M tokens/day? → API. (4) Otherwise → On-demand with a reserved baseline plus spot burst.</p>`,
    questions: [
      {
        text: "A startup runs GPU training jobs 8 hours/day, 5 days/week on a single A100 at $4.10/GPU-hour on-demand. They are considering a 1-year reservation at 50% discount. Approximately how much do they save annually?",
        options: [
          { letter: 'A', text: '$4,305', correct: false, explanation: 'This calculates only about 6 months of utilization rather than the full 52 weeks. Annual hours = 8 × 5 × 52 = 2,080 hours. Savings = 2,080 × $2.05 = $4,264 per GPU, so the full $8,528 requires using the correct annual hours.' },
          { letter: 'B', text: '$8,528', correct: true, explanation: 'Correct. Annual hours = 8h × 5 days × 52 weeks = 2,080 hours. Savings per hour = $4.10 × 50% = $2.05. Total annual saving = 2,080 × $2.05 = $8,528.' },
          { letter: 'C', text: '$12,792', correct: false, explanation: 'This assumes 24/7 utilization (8,760 hours/year), not the 8h/day 5-day schedule. It overstates runtime by 4.2x versus the actual ~2,080 hours/year worked.' },
          { letter: 'D', text: '$2,141', correct: false, explanation: 'This appears to annualize a single month\'s calculation incorrectly. Monthly hours = 2,080/12 ≈ 173 hours; savings per month = 173 × $2.05 = $355; annual = ~$4,260 — and even that shows $2,141 is far too low.' }
        ]
      },
      {
        text: "Which GPU instance type is most cost-effective for running a JAX-based model at high inference throughput on Google Cloud?",
        options: [
          { letter: 'A', text: 'A100 80GB on GCP', correct: false, explanation: 'A100 instances on GCP are general-purpose GPU instances. They support JAX but are more expensive per throughput unit than TPUs when running JAX workloads at scale, and they don\'t leverage Google\'s custom silicon optimizations.' },
          { letter: 'B', text: 'H100 on GCP', correct: false, explanation: 'H100 instances on GCP are the highest-cost option per hour. Their ~$12/GPU-hour price makes them the least cost-efficient choice for high-volume inference when cheaper alternatives are available.' },
          { letter: 'C', text: 'TPU v5e', correct: true, explanation: 'Correct. Google TPU v5e at ~$1.20/chip-hour is purpose-built for JAX/TensorFlow and delivers the highest throughput per dollar for high-volume inference on Google Cloud.' },
          { letter: 'D', text: 'Spot A100 on AWS', correct: false, explanation: 'AWS spot instances are not on GCP. Cross-cloud latency adds complexity without cost benefit, and spot instances carry interruption risk inappropriate for steady high-throughput inference.' }
        ]
      },
      {
        text: "A company processes 200M tokens/day via Claude Haiku API at $0.25/1M input tokens. At what approximate monthly API spend does it become worth seriously investigating self-hosted inference on reserved GPUs?",
        options: [
          { letter: 'A', text: 'When monthly spend exceeds $500', correct: false, explanation: 'At $500/month, self-hosted GPU costs — including a reserved A100 (~$1,100/month), engineering time, reliability engineering, and monitoring — would far exceed API spend. The break-even is much higher.' },
          { letter: 'B', text: 'When monthly spend exceeds $1,500', correct: false, explanation: 'Still below the cost floor for self-hosted. A single reserved A100 costs ~$1,100/month before any engineering, redundancy, or storage costs. $1,500/month API spend offers almost no margin for self-hosting to be cheaper.' },
          { letter: 'C', text: 'When monthly spend exceeds $15,000', correct: true, explanation: 'Correct. At $15,000+/month in API spend, the economics of a multi-GPU reserved cluster plus engineering overhead begin to pencil out favorably versus API billing.' },
          { letter: 'D', text: 'Self-hosted is always cheaper above 50M tokens/day', correct: false, explanation: 'The 50M token/day threshold is a rough heuristic, but "always cheaper" ignores model size, utilization rate, and engineering cost. A team with low GPU utilization and high engineering overhead can easily lose money on self-hosted even at 200M tokens/day.' }
        ]
      }
    ]
  },
  {
    id: 'gpu_cost_math',
    title: 'GPU Cost Math',
    track: 'cloud_economics',
    authors: 'NVIDIA DCGM docs; vLLM benchmarks; MLCommons',
    prereqs: ['cloud_pricing'],
    lesson: `<p>Knowing GPU hourly prices is only the start. The real skill is calculating cost per inference — the unit that lets you compare architectures, optimize batching, and set pricing for your API.</p>
<p><strong>GPU Utilization: The Hidden Multiplier</strong>: GPU utilization measures what percentage of the GPU's compute (CUDA cores / tensor cores) is actively processing. Most teams run at 30–50% utilization. True efficiency starts at 70%+. Utilization directly scales your effective cost. If you pay $4.10/GPU-hour at 40% utilization, your effective cost per unit of useful compute is $4.10 / 0.40 = $10.25/GPU-hour-equivalent. Getting to 80% utilization halves that to $5.13. The fastest path to cost reduction is almost always utilization improvement, not instance type switching. Monitor with: <code>nvidia-smi dmon -s u</code> for real-time SM utilization, or DCGM (Data Center GPU Manager) for fleet-level metrics.</p>
<p><strong>Cost Per Inference Formula</strong>:</p>
<ul>
  <li>Cost per inference = (GPU hourly cost × inference latency in hours) / batch size</li>
  <li>Cost per token = GPU hourly cost / (tokens per second throughput)</li>
  <li>Example: A single A100 running Llama 3 8B generates ~2,500 tokens/second at batch size 64 → $4.10 / (2,500 × 3,600) = $0.000000456/token = $0.456/1M tokens</li>
</ul>
<p><strong>Batch Size Optimization</strong>: Batch size is the single most powerful lever for GPU cost efficiency. Larger batches amortize the fixed overhead of a forward pass across more requests. Concrete throughput curve for Llama 3 8B on A100 40GB:</p>
<ul>
  <li>Batch size 1: ~180 tokens/second</li>
  <li>Batch size 8: ~720 tokens/second (4x throughput)</li>
  <li>Batch size 32: ~1,800 tokens/second (10x throughput)</li>
  <li>Batch size 64: ~2,500 tokens/second (13.9x throughput)</li>
</ul>
<p>Cost per token at batch 1 vs batch 64: $6.35/1M tokens vs $0.46/1M tokens — a 13.8x cost reduction from batching alone. The tradeoff is latency: batch 64 requires waiting for 64 requests to queue before processing. Practical approach: use dynamic batching with a max-wait window of 50–200ms. vLLM's continuous batching handles this automatically and achieves near-optimal throughput without the latency penalty of static batching.</p>
<p><strong>Memory Bandwidth vs Compute Cost</strong>: LLM inference is predominantly memory-bandwidth-bound during autoregressive generation (decoding). The model weights must be loaded from HBM for every single token generated. For a 70B parameter model in float16, that's 140GB of weight data read per forward pass.</p>
<ul>
  <li>A100 80GB HBM bandwidth: 2,000 GB/s → can do 2,000/140 = ~14 decoding steps/second per batch element at batch size 1</li>
  <li>H100 80GB HBM3 bandwidth: 3,350 GB/s → ~24 decoding steps/second per batch element</li>
</ul>
<p>Implication: for inference on large models, H100's 2x compute improvement over A100 does not translate to 2x throughput improvement. You get ~1.7x throughput improvement at batch 1 because bandwidth is the bottleneck. At large batch sizes where compute becomes the bottleneck, H100's advantage grows toward 3x.</p>
<p><strong>Practical Cost Reduction Checklist</strong>: Quantize weights to INT8 or INT4 (reduces memory footprint 2–4x). Use Flash Attention 2 (reduces memory reads during prefill by 5–10x). Enable continuous batching (vLLM, TGI). Profile SM utilization before switching instance types — utilization fix beats hardware upgrade 80% of the time.</p>`,

    title: 'LLM Token Economics',

    lesson: `<p>Token-based pricing is the dominant commercial model for LLM APIs. Understanding the economics at the token level lets you build cost models, select the right model for each task, and implement caching strategies that can cut costs by 60–90%.</p>
<p><strong>Token Pricing Fundamentals</strong>: Output tokens cost 4–10x more than input tokens because generating each output token requires a sequential forward pass (memory-bandwidth-bound), while processing input tokens happens in a single parallel prefill operation. Current pricing (mid-2025):</p>
<ul>
  <li>GPT-4o: $2.50 input / $10.00 output per 1M tokens</li>
  <li>Claude 3.5 Sonnet: $3.00 input / $15.00 output per 1M tokens</li>
  <li>Claude 3 Haiku: $0.25 input / $1.25 output per 1M tokens</li>
  <li>Gemini 1.5 Pro: $1.25 input / $5.00 output per 1M tokens (under 128K context)</li>
  <li>Llama 3 70B via Groq: $0.59/1M tokens flat</li>
</ul>
<p><strong>Practical Cost Modeling</strong>: Example — customer support chatbot on Claude Sonnet: System prompt 800 tokens + conversation history 1,200 tokens + user message 150 tokens = 2,150 input tokens. Average response: 300 output tokens. At 10,000 requests/day: Daily input cost = 10,000 × 2,150 / 1,000,000 × $3.00 = $64.50. Daily output cost = 10,000 × 300 / 1,000,000 × $15.00 = $45.00. Daily total: $109.50 → monthly: ~$3,285.</p>
<p><strong>Prompt Caching Economics</strong>: Prompt caching is the single highest-ROI optimization for most production LLM applications. Anthropic's cache pricing: write cache at $3.75/1M tokens (1.25x normal), read cache at $0.30/1M tokens (0.1x normal). Cache entries persist for 5 minutes and reset on each cache hit. Applying caching to the support chatbot: the 800-token system prompt can be cached. Cache read cost: 800 tokens × $0.30/1M = $0.00024 vs normal: 800 × $3.00/1M = $0.0024 — 90% reduction on the cached portion. At 10,000 requests/day, caching the system prompt saves ~$19.20/day → ~$576/month. Cache the largest static prefix you can: system prompts, few-shot examples, RAG retrieved context reused across users.</p>
<p><strong>Context Window Cost</strong>: Every token in the context window is charged as an input token on every request. A 128K context window filled with a document charged at $3.00/1M input tokens costs: 128,000 × $3.00/1,000,000 = $0.384 per request in input costs alone. Context management strategies: (1) Sliding window — keep only the last N turns; (2) Summarization compression — periodically summarize old conversation into 200–300 tokens; (3) RAG — retrieve only the 3–5 most relevant chunks rather than inserting the full document. Can reduce context from 128K to 2K — a 64x cost reduction on the input side.</p>
<p><strong>Input vs Output Pricing Asymmetry</strong>: Use structured outputs (JSON mode) to prevent verbose prose. Instruct models explicitly on output length. Measure output token inflation — models sometimes generate unnecessary preamble ("Certainly! Here is the...") — pure cost waste. Chain of thought is expensive: a 500-token reasoning chain at $15/1M output = $0.0075 per request. At 100K requests/day = $750/day just for CoT tokens.</p>
<p><strong>Model Selection by Cost-Quality Ratio</strong>: Classification, routing, summarization, and entity extraction rarely need Sonnet-level capability. Haiku at 12x cheaper handles most of these tasks at 85–95% of Sonnet quality.</p>`,

    title: 'FinOps Foundation Framework',
    track: 'finops_framework_track',
    authors: 'FinOps Foundation; Cloud Financial Management whitepaper',
    prereqs: [],
    lesson: `<p>The FinOps Foundation defines FinOps as "an operational framework and cultural practice that maximizes the business value of cloud spend." The framework gives engineering and finance teams a shared language and a maturity model for evolving from reactive cost management to proactive optimization.</p>
<p><strong>The Three Phases: Inform, Optimize, Operate</strong></p>
<p><strong>Inform</strong> — Create visibility before taking action. You cannot optimize what you cannot see. This phase focuses on: tagging infrastructure so costs can be attributed to teams and products; building dashboards showing cost trends, anomalies, and unit economics; allocating shared costs; establishing baseline metrics: cost per customer, cost per transaction, cost per API call.</p>
<p><strong>Optimize</strong> — Act on visibility to reduce waste and improve efficiency: rightsizing (identifying over-provisioned instances), commitment purchasing (buying reserved instances once utilization patterns are stable), architectural optimization (moving to serverless for bursty workloads), and waste elimination (terminating idle resources, deleting orphaned snapshots).</p>
<p><strong>Operate</strong> — Embed cost awareness into daily engineering workflow: cost checks in CI/CD pipelines, budget alerts with automated responses, regular cost review meetings, and chargeback or showback models that create team accountability.</p>
<p><strong>Crawl/Walk/Run Maturity Model</strong>:</p>
<ul>
  <li><strong>Crawl:</strong> Basic visibility and manual processes. Teams know total cloud bill but cannot attribute costs to specific teams. No tagging enforcement. Cost reviews happen reactively, after a surprise invoice. Unit economics unknown.</li>
  <li><strong>Walk:</strong> 70–80% of resources tagged. Showback reports reviewed monthly. Some reserved instances purchased based on historical data. Unit economics tracked for major products. Anomaly detection alerts but response is manual.</li>
  <li><strong>Run:</strong> Near-100% tagging compliance enforced by policy. Chargeback automated and teams receive internal invoices. Engineers check cost impact before merging PRs. ML models predict spend anomalies before they appear on the bill. Unit economics drive product roadmap decisions.</li>
</ul>
<p><strong>Unit Economics: The Core FinOps Metric</strong>: Unit economics translate cloud costs into business metrics: cost per API call, cost per active user (CPAU), cost per transaction, cost per 1K tokens processed. Example: a company spends $120,000/month with 40,000 MAU. CPAU = $3.00. If the product charges $29/month, gross margin on infrastructure is ($29 - $3) / $29 = 89.7%. If CPAU rises to $8, gross margin drops to 72.4% — a signal to optimize before it becomes a crisis.</p>
<p><strong>Showback vs Chargeback</strong>: <strong>Showback</strong> shows teams what they cost without actually charging them. Used in Crawl and early Walk stages. Builds cost awareness without financial consequences. <strong>Chargeback</strong> actually debits team budgets for cloud consumption. Used in Run stage. Creates real accountability and optimization incentives. Requires mature tagging and allocation to be credible. Hybrid "soft chargeback": teams receive internal invoices for informational purposes, but actual budget transfer happens only for overages above a threshold.</p>`,

    id: 'cost_allocation',
    title: 'Cost Allocation & Tagging',
    track: 'finops_framework_track',
    authors: 'AWS Cost Management docs; Kubernetes cost allocation patterns',
    prereqs: ['finops_framework'],
    lesson: `<p>Cost allocation is the practice of attributing cloud infrastructure costs to the organizational units — teams, products, cost centers, environments — that consumed them. Without allocation, you have a total bill but no accountability.</p>
<p><strong>Resource Tagging Strategy</strong>: Tags are key-value metadata attached to cloud resources. Recommended minimum tag set: <code>team</code> (owning engineering team), <code>product</code> (product or service), <code>environment</code> (production/staging/dev), <code>cost-center</code> (finance cost center code), <code>project</code> (specific initiative). Tagging enforcement strategies: AWS Service Control Policies (SCPs) can deny resource creation without required tags. GCP Organization Policy constraints enforce label requirements. Terraform/IaC enforces tags in module defaults. Tag compliance score: track percentage of spend covered by tags monthly; target 95%+ for Run maturity.</p>
<p><strong>Namespace-Level Attribution in Kubernetes</strong>: In Kubernetes environments, costs must be attributed at the namespace and workload level. OpenCost allocates cost based on pod resource requests. For each node: Pod CPU cost = (pod CPU requests / node allocatable CPU) × node hourly cost × CPU cost weight. Pod memory cost follows the same logic. Idle cost: the portion of node capacity not requested by any pod. OpenCost tracks idle cost separately. Idle cost is typically 20–40% of total cluster cost and represents optimization opportunity.</p>
<p><strong>Cost Center Mapping</strong>: Approaches: Direct mapping (tag all resources with cost center code at provisioning time), account/project-level mapping (dedicate AWS accounts or GCP projects to cost centers), allocation rules (apply percentage splits to shared resources). Shared cost challenges: networking egress, managed database clusters, monitoring/logging infrastructure. Common approaches: pro-rata by team spend, or fixed allocation percentages negotiated quarterly with finance.</p>
<p><strong>Cloud Cost Anomaly Detection</strong>: Anomaly detection identifies unexpected cost spikes before they become month-end surprises. AWS Cost Anomaly Detection uses ML to learn normal spend patterns and alerts when actual spend deviates beyond a configurable threshold. Detection approaches: threshold-based (alert when daily spend exceeds X% of 30-day average), statistical (alert when spend is more than 2–3 standard deviations from rolling mean), ML-based (accounts for weekly seasonality and growth trends). Response playbook: identify the service and tag group driving the spike, check for resource creation events in CloudTrail, determine if the spike is expected or unexpected, and for runaway resources, terminate and add guardrails.</p>`,

    id: 'model_routing',
    title: 'Model Routing Optimization',
    track: 'ai_finops',
    authors: 'Semantic Router docs; LLM routing research 2024',
    prereqs: ['token_economics', 'gpu_cost_math'],
    lesson: `<p>Model routing is the practice of directing each query to the cheapest model capable of handling it correctly. The price difference between frontier and small models is 10–50x. Claude Sonnet vs Claude Haiku: $3.00/$15.00 vs $0.25/$1.25 per 1M input/output tokens — a 12x cost difference. If 70% of queries can be handled by Haiku and 30% require Sonnet, routing delivers: weighted average cost = 0.70 × $0.25 + 0.30 × $3.00 = $1.075/1M input tokens vs Sonnet-only $3.00 — a 64% cost reduction. At 100M tokens/day: Sonnet-only costs $300/day; routed cost: $107.50/day. Annual saving: $70,263.</p>
<p><strong>Query Complexity Classification</strong>: (1) <strong>Rule-based routing</strong>: Apply keyword patterns and structural rules. Fast (sub-millisecond), free, interpretable. Example: query length &lt; 50 tokens AND no code → Haiku; contains code blocks → Sonnet. Limitation: brittle to rephrasing. (2) <strong>Embedding-based routing</strong>: Encode the query and classify against a pre-trained complexity taxonomy using cosine similarity or a lightweight classifier. Better generalization. Adds ~5–10ms latency. (3) <strong>LLM-based routing</strong>: Use a tiny model (GPT-4o-mini at $0.15/1M) to classify the query before sending it to the target model. Highest accuracy, but adds cost and latency. Break-even: classifier cost at 100 tokens/query = $0.000015/classification. If it successfully downgrades 5% of queries from Sonnet to Haiku at 1K tokens/query: saving = $0.0001375 vs $0.000015 cost — 9x ROI per correctly routed query.</p>
<p><strong>Cascade Architectures</strong>: A cascade pattern attempts the query with a cheap model first, evaluates confidence, and escalates to an expensive model only if the cheap model fails. Implementation: (1) Send to Haiku, request structured output with a confidence field. (2) If confidence &gt; 85 and output passes validation: return Haiku's response. (3) Else: send to Sonnet. Metrics to track: escalation rate (target 20–40%), cascade overhead (if escalation rate &gt; 60%, cascade is more expensive than Sonnet-only), latency overhead (escalated queries have 2x model latency).</p>
<p><strong>Routing by Latency vs Cost</strong>: A router optimizes a weighted objective: minimize α × cost + β × latency + γ × error_rate. For latency-sensitive queries: Groq (Llama 3 70B, ~800 tokens/second, $0.59/1M flat) or self-hosted vLLM (Llama 3 8B, ~2,500 t/s). For quality-sensitive queries: Sonnet or GPT-4o. For batch/async: cheapest model that meets quality threshold.</p>`,

      {
        text: "A production system handles 500,000 queries/day. Rule-based routing sends 60% to Claude Haiku ($0.25/1M input, $1.25/1M output) and 40% to Claude Sonnet ($3.00/1M input, $15.00/1M output). Average query: 800 input tokens, 200 output tokens. What is the daily cost saving vs Sonnet-only?",

          { letter: 'C', text: '$262/day', correct: false, explanation: 'This is approximately half the correct saving, suggesting a calculation error such as dividing by 2 somewhere, possibly treating the 60% Haiku routing as 30%.' },

        text: "A cascade architecture sends queries to Haiku first, then escalates to Sonnet if confidence < 85. The escalation rate rises from 25% to 55% over 2 weeks. What does this indicate and what action should you take?",

    id: 'opencost',
    title: 'OpenCost & CNCF Tools',
    track: 'k8s_standards',
    authors: 'CNCF OpenCost specification; Kubernetes cost allocation patterns',
    prereqs: ['cost_allocation'],
    lesson: `<p>OpenCost is the CNCF (Cloud Native Computing Foundation) sandbox project that provides an open-source, vendor-neutral standard for measuring and allocating Kubernetes infrastructure costs. It integrates natively with Prometheus.</p>
<p><strong>OpenCost Architecture</strong>: Three components: (1) Cost model engine: fetches cloud provider pricing (AWS Pricing API, GCP Cloud Billing API, Azure Rate Card API) and combines it with Kubernetes resource metrics to compute cost-per-resource. (2) Prometheus exporter: exposes cost metrics as Prometheus time-series at <code>/metrics</code> endpoint. (3) REST API: serves allocation queries at <code>/allocation</code>, <code>/assets</code>, and <code>/summary</code> endpoints, consumed by Grafana dashboards and custom applications. Deployment via Helm chart; begins computing namespace-level cost within 5–10 minutes of deployment.</p>
<p><strong>Kubernetes Cost Allocation Methodology</strong>: OpenCost allocates cost based on pod resource requests (not limits, not actual utilization) — requests represent the capacity the scheduler reserves. For each node: Pod CPU cost = (pod CPU requests / node allocatable CPU) × node hourly cost × CPU cost weight. Pod memory cost follows the same logic. GPU cost = (pod GPU requests / node GPU count) × node GPU hourly cost. Default cost weights: CPU 50%, memory 50%. Idle cost (capacity not requested by any pod) is tracked separately — typically 20–40% of total cluster cost. OpenCost can distribute idle cost pro-rata to namespaces or report it as a cluster-level line item.</p>
<p><strong>Cost Per Pod and Namespace</strong>: OpenCost API: <code>GET /allocation?window=24h&amp;aggregate=namespace&amp;step=1h</code>. Response includes per-namespace: cpuCost, memoryCost, gpuCost, pvCost (persistent volumes), networkCost, sharedCost, totalCost, efficiency (actual utilization / requested). A namespace at 43% efficiency is the immediate optimization target: either reduce resource requests to match actual usage, or improve code to utilize the capacity being reserved.</p>
<p><strong>Integration with Prometheus</strong>: Key metrics: <code>container_cpu_allocation</code>, <code>container_memory_allocation_bytes</code>, <code>pod_pvc_allocation</code>, <code>node_total_hourly_cost</code>. Example PromQL: <code>sum(rate(container_cpu_allocation[24h]) * on(node) group_left node_total_hourly_cost) by (namespace)</code>. Set Prometheus alerts when namespace daily cost exceeds budget threshold, or when efficiency drops below 40% for more than 2 hours.</p>
<p><strong>OpenCost vs Kubecost</strong>: OpenCost: free, Kubernetes-native, focuses on cost measurement and Prometheus integration. Kubecost Enterprise: adds multi-cluster aggregation, SAML SSO, team-based access control, automated rightsizing recommendations, anomaly detection, and dedicated support. For teams with &lt;5 clusters and internal Grafana expertise: OpenCost + custom dashboards is sufficient. For enterprises with 20+ clusters: Kubecost Enterprise pays for itself in engineering time saved.</p>
<p><strong>CNCF FinOps Ecosystem</strong>: Keda (Kubernetes Event-Driven Autoscaling): scales workloads to zero when idle — eliminates idle cost entirely for batch workloads. Cluster Autoscaler: adds/removes nodes based on pending pods and utilization. VPA (Vertical Pod Autoscaler): automatically right-sizes pod resource requests based on historical utilization.</p>`,

    id: 'focus_spec',
    title: 'FOCUS Specification',
    track: 'k8s_standards',
    authors: 'FinOps Foundation FOCUS Working Group, 2023–2024',
    prereqs: ['cost_allocation'],
    lesson: `<p>FOCUS (FinOps Open Cost and Usage Specification) is an open standard developed by the FinOps Foundation to normalize cloud cost and usage data across providers. Before FOCUS, every cloud provider exported billing data in a proprietary schema, making multi-cloud cost analysis require custom ETL pipelines for each provider combination.</p>
<p><strong>FOCUS Column Schema</strong> — mandatory columns all compliant providers must include:</p>
<ul>
  <li><strong>BilledCost:</strong> the actual amount charged after discounts, in billing currency</li>
  <li><strong>EffectiveCost:</strong> the amortized cost including commitment-based discounts applied over the commitment period</li>
  <li><strong>ListCost:</strong> the on-demand price for the resource, before any discounts</li>
  <li><strong>UsageQuantity / UsageUnit:</strong> the quantity and unit of resource consumed (e.g., 2.5 vCPU-hours)</li>
  <li><strong>ResourceId / ResourceType:</strong> unique identifier and normalized resource category (e.g., "Virtual Machine", "Object Storage")</li>
  <li><strong>ServiceName / ServiceCategory:</strong> cloud service name and normalized category across providers ("Compute", "Storage", "AI and Machine Learning")</li>
  <li><strong>ChargeType:</strong> the type of charge — "Usage", "Purchase" (for reservations), "Tax", "Credit", "Adjustment"</li>
  <li><strong>ChargePeriodStart / ChargePeriodEnd:</strong> ISO 8601 timestamps</li>
  <li><strong>Provider:</strong> the cloud provider name ("AWS", "Google Cloud", "Microsoft Azure")</li>
  <li><strong>Tags:</strong> key-value metadata from resource tags/labels, normalized across providers</li>
</ul>
<p><strong>EffectiveCost vs BilledCost: The Critical Distinction</strong>: For a 1-year reserved instance paid upfront, BilledCost = full upfront payment on day 1, then $0 for the remaining 11 months. EffectiveCost = the amortized cost spread evenly over the commitment period. For a $12,000/year reservation: EffectiveCost = $1,000/month = $32.88/day. For cost allocation and unit economics, always use EffectiveCost. BilledCost creates misleading spikes at purchase time that make one team's January cost appear 12x higher — a data artifact, not a real cost change.</p>
<p><strong>Cross-Cloud Normalization</strong>: AWS "Amazon Elastic Compute Cloud" + GCP "Google Compute Engine" → both map to ServiceCategory: "Compute". With FOCUS-normalized data: <code>SELECT Provider, SUM(EffectiveCost) FROM billing WHERE ServiceCategory = 'AI and Machine Learning' AND Tags['env'] = 'production' GROUP BY Provider</code> — a single query spanning all clouds.</p>
<p><strong>Provider Implementations (2025)</strong>: AWS CUR 2.0 (released 2023) supports FOCUS 1.0 export natively. GCP BigQuery billing export available with FOCUS-compatible view. Azure FOCUS 1.0 export in Cost Management exports as of late 2024. Oracle Cloud: FOCUS 1.0 support in Cost and Usage reports. Snowflake, Databricks: Marketplace billing data available in FOCUS format.</p>`,

    id: 'reserved_capacity',
    title: 'Reserved Capacity Strategies',
    track: 'finops_framework_track',
    authors: 'AWS Savings Plans docs; GCP Committed Use Discount documentation',
    prereqs: ['cloud_pricing', 'finops_framework'],
    lesson: `<p>Reserved capacity is the primary lever for reducing baseline cloud spend. The discount mechanics differ across providers, but the underlying principle is the same: trade flexibility for price.</p>
<p><strong>AWS Reserved Instances (RIs)</strong>: Commit to a specific instance type in a specific region for 1 or 3 years. Three payment options: All Upfront (maximum discount — typically 40–60% off on-demand), Partial Upfront (~50% upfront, rest monthly; slightly less discount but preserves cash flow), No Upfront (monthly with no initial payment; smallest discount ~30–40%). RI types: Standard RIs (fixed to specific instance type, best discount, cannot be changed) vs Convertible RIs (can be exchanged for different instance type of equal or greater value; ~10% less discount; use when instance type may change due to GPU generation upgrades). Example: <code>p3.2xlarge</code> (1x V100) on-demand $3.06/hour → 1-year All Upfront Standard RI: ~$1.20/hour effective rate — 61% saving. Over 8,760 hours/year: $26,805 vs $10,512 reserved — $16,293 annual saving per instance.</p>
<p><strong>AWS Savings Plans</strong>: Instead of committing to a specific instance type, you commit to a dollar-per-hour spend level. Compute Savings Plans (apply to any EC2 instance family, size, OS, and region, plus Fargate and Lambda; most flexible; up to 66% discount) vs EC2 Instance Savings Plans (commit to specific instance family in a region; up to 72% discount). Savings Plans recommendation workflow: (1) Run on-demand for 2–3 months to establish stable baseline. (2) Use AWS Cost Explorer's recommendations. (3) Commit to 70–80% of baseline (not 100%) — leave headroom for variability and spot to cover peaks. (4) Set calendar reminder to review and renew 60 days before expiry.</p>
<p><strong>GCP Committed Use Discounts (CUDs)</strong>: Resource-based CUDs: commit to vCPU and memory in a specific region. Applied to any machine type using those resources. 1-year: ~28% off; 3-year: ~46% off. GCP Sustained Use Discounts (SUDs): automatic discounts when an instance runs for more than 25% of a month with no commitment required. SUDs cannot be combined with CUDs on the same resource — choose one.</p>
<p><strong>Spot Instance Strategies</strong>: Diversified spot pools — request spot capacity across multiple instance types and availability zones to reduce interruption probability. Spot with on-demand fallback — AWS Spot Fleet and GCP Managed Instance Groups support automatic fallback to on-demand when spot capacity is unavailable. Checkpointing — for ML training, checkpoint model weights to S3/GCS every 15–30 minutes so training resumes from the last checkpoint on interruption.</p>
<p><strong>The Reservation Coverage vs Utilization Equation</strong>: Coverage: target 80%+ for stable workloads (below 70% = over-paying for on-demand; above 95% = over-reserved). Utilization: target 90%+ of reserved capacity actually used (below 85% = paying for unused commitments — consider selling unused RIs on AWS Marketplace). Optimal balance: 80–85% coverage with 90%+ utilization.</p>`,

          { letter: 'D', text: 'Use on-demand for all instances to maintain flexibility as team GPU needs evolve', correct: false, explanation: 'The 2 inference instances running 24/7 are a textbook use case for reservations. On-demand for 24/7 production workloads when usage is stable is pure waste — 40–60% overpayment with zero benefit.' }

          { letter: 'B', text: '72% of your purchased Savings Plans commitment is being consumed; you are over-committed — consider not renewing at the same commitment level', correct: true, explanation: 'Correct. At 72% utilization you\'re paying for 28% of committed capacity that you\'re not using. Target is 90%+. The corrective action is to let excess plans expire and recommit at a lower level after measuring actual steady-state usage.' },

const KEY = 'pa6_completed';
const ICON = '💰';
const state = {
  active: null,
  tab: 'lesson',
  completed: new Set(),
  answered: {},
  qIndex: 0
};

function save() {
  localStorage.setItem(KEY, JSON.stringify([...state.completed]));
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '[]');
    state.completed = new Set(d);
  } catch(e) {}
}
load();

function isPaperUnlocked(paper) {
  return paper.prereqs.every(id => state.completed.has(id));
}

function getPaperById(id) {
  return PAPERS.find(p => p.id === id);
}

function updateBadge() {
  document.getElementById('badge-count').textContent = state.completed.size;
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  TRACKS.forEach(track => {
    const trackPapers = track.papers.map(id => getPaperById(id)).filter(Boolean);
    const div = document.createElement('div');
    div.className = 'sidebar-track';
    const label = document.createElement('div');
    label.className = 'track-label';
    label.textContent = track.label;
    div.appendChild(label);
    trackPapers.forEach(paper => {
      const unlocked = isPaperUnlocked(paper);
      const completed = state.completed.has(paper.id);
      const item = document.createElement('div');
      item.className = 'sidebar-item' +
        (state.active === paper.id ? ' active' : '') +
        (completed ? ' completed' : '') +
        (!unlocked ? ' locked' : '');
      let icon = '○';
      if (completed) icon = ICON;
      else if (!unlocked) icon = '🔒';
      else icon = '◉';
      let prereqHint = '';
      if (!unlocked) {
        const missing = paper.prereqs.filter(id => !state.completed.has(id));
        const names = missing.map(id => { const p = getPaperById(id); return p ? p.title : id; });
        prereqHint = `<span class="prereq-hint">Requires: ${names.join(', ')}</span>`;
      }
      item.innerHTML = `<span class="icon">${icon}</span><span class="item-title">${paper.title}${prereqHint}</span>`;
      if (unlocked) {
        item.addEventListener('click', () => openPaper(paper.id));
      }
      div.appendChild(item);
    });
    sidebar.appendChild(div);
  });
}

function openPaper(id) {
  state.active = id;
  state.tab = 'lesson';
  if (!state.answered[id]) state.answered[id] = {};
  state.qIndex = 0;
  renderSidebar();
  renderMain();
}

function showTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  renderTabContent();
}

function renderMain() {
  const main = document.getElementById('main');
  if (!state.active) {
    renderWelcome();
    return;
  }
  const paper = getPaperById(state.active);
  if (!paper) { renderWelcome(); return; }
  if (!isPaperUnlocked(paper)) {
    renderLockedView(paper);
    return;
  }
  const answered = state.answered[paper.id] || {};
  const totalQ = paper.questions.length;
  const answeredCount = Object.keys(answered).length;
  const allCorrect = paper.questions.every((q, i) => answered[i] && answered[i].correct);
  main.innerHTML = `
    <div class="paper-view">
      <div class="paper-header">
        <div class="track-badge">${TRACKS.find(t => t.papers.includes(paper.id))?.label || paper.track}</div>
        <h2>${paper.title}</h2>
        <div class="authors">${paper.authors}</div>
      </div>
      <div class="tabs">
        <button class="tab-btn${state.tab === 'lesson' ? ' active' : ''}" data-tab="lesson" onclick="showTab('lesson')">Lesson</button>
        <button class="tab-btn${state.tab === 'quiz' ? ' active' : ''}" data-tab="quiz" onclick="showTab('quiz')">Quiz (${answeredCount}/${totalQ})</button>
      </div>
      <div id="tab-content"></div>
    </div>
  `;
  renderTabContent();
}

function renderTabContent() {
  const container = document.getElementById('tab-content');
  if (!container) return;
  if (state.tab === 'lesson') {
    const paper = getPaperById(state.active);
    container.innerHTML = `<div class="lesson-content">${paper.lesson}</div>`;
  } else {
    renderQuiz(container);
  }
}

function renderQuiz(container) {
  const paper = getPaperById(state.active);
  const answered = state.answered[paper.id] || {};
  const allCorrect = paper.questions.every((q, i) => answered[i] && answered[i].correct);

  if (allCorrect && state.completed.has(paper.id)) {
    const letters = ['A','B','C','D'];
    container.innerHTML = `
      <div class="all-correct-banner" style="display:block">${ICON} All questions answered correctly! This paper is complete.</div>
      ${renderQuizQuestion(paper, state.qIndex, answered)}
    `;
    return;
  }

  container.innerHTML = renderQuizQuestion(paper, state.qIndex, answered);
}

function renderQuizQuestion(paper, qIdx, answered) {
  const q = paper.questions[qIdx];
  const ans = answered[qIdx];
  const letters = ['A','B','C','D'];
  const dots = paper.questions.map((_, i) => {
    let cls = 'progress-dot';
    if (answered[i]) cls += answered[i].correct ? ' answered-correct' : ' answered-wrong';
    else if (i === qIdx) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  const options = q.options.map((opt, oi) => {
    let cls = 'option';
    if (ans) {
      cls += ' disabled';
      if (opt.correct) cls += ' correct';
      else if (ans.selectedIndex === oi) cls += ' wrong';
    }
    const expStyle = ans ? '' : 'display:none';
    const expClass = opt.correct ? 'correct' : (ans && ans.selectedIndex === oi ? 'wrong' : '');
    const onclick = ans ? '' : `onclick="selectOption('${paper.id}', ${qIdx}, ${oi})"`;
    return `
      <div class="${cls}" ${onclick}>
        <div class="letter">${letters[oi]}</div>
        <div class="option-body">
          <div class="option-text">${opt.text}</div>
          ${ans ? `<div class="option-explanation">${opt.explanation}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  const isLast = qIdx === paper.questions.length - 1;
  const btnLabel = isLast ? 'Finish Quiz' : 'Next Question';
  const btnVisible = ans ? 'visible' : '';

  return `
    <div class="quiz-wrap">
      <div class="quiz-progress">
        <span class="q-label">Question ${qIdx + 1} of ${paper.questions.length}</span>
        <div class="progress-dots">${dots}</div>
      </div>
      <div class="question-card">
        <div class="question-text">${q.text}</div>
        <div class="options">${options}</div>
      </div>
      <div class="quiz-actions">
        <button class="btn-next ${btnVisible}" onclick="nextQ('${paper.id}', ${qIdx})">${btnLabel}</button>
      </div>
    </div>
  `;
}

function selectOption(paperId, qIdx, selectedIndex) {
  const paper = getPaperById(paperId);
  if (!paper) return;
  if (!state.answered[paperId]) state.answered[paperId] = {};
  if (state.answered[paperId][qIdx]) return; // already answered
  const correct = paper.questions[qIdx].options[selectedIndex].correct;
  state.answered[paperId][qIdx] = { selectedIndex, correct };

  const container = document.getElementById('tab-content');
  renderQuiz(container);

  // Update quiz tab label
  const answered = state.answered[paperId];
  const answeredCount = Object.keys(answered).length;
  const tabBtn = document.querySelector('.tab-btn[data-tab="quiz"]');
  if (tabBtn) tabBtn.textContent = `Quiz (${answeredCount}/${paper.questions.length})`;
}

function nextQ(paperId, currentIdx) {
  const paper = getPaperById(paperId);
  if (!paper) return;
  const answered = state.answered[paperId] || {};
  const isLast = currentIdx === paper.questions.length - 1;

  if (isLast) {
    checkDone(paperId);
  } else {
    state.qIndex = currentIdx + 1;
    const container = document.getElementById('tab-content');
    renderQuiz(container);
  }
}

function checkDone(paperId) {
  const paper = getPaperById(paperId);
  const answered = state.answered[paperId] || {};
  const allCorrect = paper.questions.every((q, i) => answered[i] && answered[i].correct);

  if (allCorrect) {
    state.completed.add(paperId);
    save();
    updateBadge();
    renderSidebar();

    // Check if all papers done
    if (state.completed.size === PAPERS.length) {
      state.active = null;
      renderMain();
      return;
    }

    // Show completion for this paper
    state.qIndex = 0;
    const container = document.getElementById('tab-content');
    renderQuiz(container);
    const tabBtn = document.querySelector('.tab-btn[data-tab="quiz"]');
    if (tabBtn) tabBtn.textContent = `Quiz (${paper.questions.length}/${paper.questions.length})`;
  } else {
    // Find first wrong question
    const firstWrong = paper.questions.findIndex((q, i) => !answered[i] || !answered[i].correct);
    if (firstWrong !== -1) {
      state.qIndex = firstWrong;
      // Clear wrong answers so user can retry
      paper.questions.forEach((q, i) => {
        if (answered[i] && !answered[i].correct) {
          delete state.answered[paperId][i];
        }
      });
    }
    const container = document.getElementById('tab-content');
    renderQuiz(container);
  }
}

function renderLockedView(paper) {
  const main = document.getElementById('main');
  const prereqChips = paper.prereqs.map(id => {
    const p = getPaperById(id);
    const done = state.completed.has(id);
    return `<span class="prereq-chip ${done ? 'done' : 'todo'}">${done ? '✓' : '✗'} ${p ? p.title : id}</span>`;
  }).join('');

  main.innerHTML = `
    <div class="paper-view">
      <div class="locked-view">
        <div class="lock-icon">🔒</div>
        <h3>${paper.title}</h3>
        <p>Complete the prerequisite papers to unlock this topic.</p>
        <div class="prereq-list">${prereqChips}</div>
      </div>
    </div>
  `;
}

function renderWelcome() {
  const main = document.getElementById('main');
  if (state.completed.size === PAPERS.length) {
    renderCompletion();
    return;
  }
  const startPapers = PAPERS.filter(p => p.prereqs.length === 0);
  const startBtns = startPapers.map(p => `
    <button class="btn-start" onclick="openPaper('${p.id}')">
      <span>▶</span> ${p.title}
    </button>
  `).join('');

  main.innerHTML = `
    <div class="welcome">
      <h2>FinOps & AI Cost Engineering</h2>
      <p class="subtitle">Master cloud economics, cost allocation, Kubernetes tooling, and AI-specific FinOps strategies.</p>
      <div class="stats-row">
        <div class="stat-card">
          <div class="num">10</div>
          <div class="label">Topics</div>
        </div>
        <div class="stat-card">
          <div class="num">30</div>
          <div class="label">Questions</div>
        </div>
        <div class="stat-card">
          <div class="num">${state.completed.size}</div>
          <div class="label">Completed</div>
        </div>
        <div class="stat-card">
          <div class="num">4</div>
          <div class="label">Tracks</div>
        </div>
      </div>
      <div class="welcome-section">
        <h3>Start Here</h3>
        <div class="start-btns">${startBtns}</div>
      </div>
      <div class="welcome-section">
        <h3>Tracks</h3>
        <div class="stats-row" style="flex-wrap:wrap">
          ${TRACKS.map(t => {
            const done = t.papers.filter(id => state.completed.has(id)).length;
            return `<div class="stat-card" style="min-width:160px">
              <div style="font-size:13px;font-weight:700;color:var(--accent2);margin-bottom:6px">${t.label}</div>
              <div style="font-size:12px;color:var(--muted)">${done}/${t.papers.length} complete</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderCompletion() {
  const main = document.getElementById('main');
  const completedList = PAPERS.map(p => `
    <div class="completion-item">${ICON} ${p.title}</div>
  `).join('');
  main.innerHTML = `
    <div class="completion-screen">
      <div class="trophy">${ICON}</div>
      <h2>Course Complete</h2>
      <p>You've mastered all 10 topics across FinOps & AI Cost Engineering.</p>
      <div class="completion-grid">${completedList}</div>
      <button class="btn-reset" onclick="resetAll()">Reset Progress</button>
    </div>
  `;
}

function resetAll() {
  localStorage.removeItem(KEY);
  state.completed = new Set();
  state.active = null;
  state.answered = {};
  state.qIndex = 0;
  updateBadge();
  renderSidebar();
  renderMain();
}

// Init
updateBadge();
renderSidebar();
renderWelcome();
</script>
