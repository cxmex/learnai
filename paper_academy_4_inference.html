    lesson: `
<h3>Why Autoregressive Decoding is Expensive</h3>
<p>Transformers generate tokens one at a time. Without any optimization, computing attention at step N means attending over all N previous tokens — that's O(N²) work per token. For a 4,096-token response, that's catastrophic.</p>
<h3>What KV Cache Is</h3>
<p>During the forward pass, each transformer layer computes three projections of each token: Query (Q), Key (K), and Value (V). The Query changes with each new token, but Keys and Values for past tokens are <strong>reusable</strong>. KV Cache stores these K and V tensors so only the new token's projections need to be computed at each step.</p>
<div class="callout">After caching: each new token requires one forward pass attending to cached K/V. Generating 2,048 tokens goes from N² attention calls to N linear attention operations. 10-100× speedup depending on sequence length.</div>
<h3>The Memory Problem</h3>
<p>Memory cost is significant. LLaMA-2 70B uses 80 transformer layers with 8,192-dimensional hidden states. Each token consumes approximately <strong>2.6 MB of KV cache</strong>. A 4,096-token context = ~10 GB of KV cache alone, on top of the 140 GB of model weights.</p>
<h3>Modern Optimizations</h3>
<ul>
  <li><strong>PagedAttention (vLLM, SOSP 2023):</strong> OS-style virtual memory paging for KV cache. Instead of pre-allocating max-length contiguous blocks per request (wasting 60-80% due to variable lengths), blocks are allocated in fixed-size pages on demand. Near-zero fragmentation.</li>
  <li><strong>H2O (NeurIPS 2023):</strong> "Heavy-Hitter Oracle" — evicts tokens whose K/V entries receive minimal cumulative attention. Keeps heavy hitters + recent tokens. Enables very long contexts on smaller hardware.</li>
  <li><strong>KIVI (ICML 2024):</strong> 2-bit asymmetric quantization of the KV cache itself. Keys are more sensitive than values, so keys get per-channel quant, values get per-token quant.</li>
  <li><strong>Grouped-Query Attention (GQA):</strong> Multiple query heads share a single K/V head. If 32 Q heads share 8 K/V heads, that's a 4× reduction in cached tensor size. Used in LLaMA-2, Mistral.</li>
  <li><strong>DeepSeek MLA:</strong> Compresses K and V into low-rank latent vectors. Radical reduction: from 512 KV dimensions to 128, then reconstruct on demand.</li>
</ul>
<h3>Production Impact</h3>
<p>Without KV cache, generating a 2,048-token response from a 70B model would require re-attending to all prior tokens at every step — effectively impossible at commercial scale. This is the baseline that makes serving LLMs economically viable. vLLM, Together AI, Fireworks AI, Groq (prefix caching), and Anthropic (prompt caching) all build on this foundation.</p>
<div class="callout amber">Key intuition: the KV cache trades GPU memory for GPU compute. As sequences get longer, the memory cost grows but compute cost per token stays constant.</div>

  {

    title: 'Quantization (INT8, INT4, GPTQ, AWQ)',

    lesson: `
<h3>The Core Idea</h3>
<p>LLaMA-2 70B in FP16 requires 140 GB of VRAM. In INT8, that's 70 GB. In INT4, it's 35 GB. Quantization reduces weight precision to shrink memory footprint, often speeding up matrix math as a bonus. The challenge: precision loss degrades model quality.</p>
<h3>Why Naive INT8 Fails on LLMs</h3>
<p>Standard quantization divides the min-max range into 256 equal buckets (INT8). LLMs have <strong>activation outliers</strong> — a tiny fraction (~0.1%) of values that are 100× larger than average. These outliers force the quantization scale so high that normal-magnitude values collapse to just a few discrete levels, causing significant quality degradation.</p>
<h3>bitsandbytes INT8 — Mixed-Precision Decomposition</h3>
<p>Dettmers et al. (NeurIPS 2022) solve this with LLM.int8(): decompose matrix multiplication into two parts. Outlier columns (identified dynamically) stay in FP16; all other values use INT8. The outlier fraction is typically less than 0.1% of values, so memory savings remain substantial while quality is preserved.</p>
<h3>GPTQ — Second-Order Post-Training Quantization</h3>
<p>GPTQ (Frantar et al., ICLR 2023) targets INT4. Instead of quantizing weights independently, it processes weights row by row using <strong>Hessian information</strong> — measuring each weight's sensitivity to quantization error. After quantizing one weight, it compensates by adjusting the remaining weights in that row to minimize reconstruction error. This "second-order" approach achieves near-FP16 quality at INT4.</p>
<div class="code">GPTQ loss: E[||WX - Q(W)X||²]
Hessian captures d²L/dw² — curvature of loss surface
High curvature → quantize carefully
Low curvature → quantize aggressively</div>
<h3>AWQ — Activation-Aware Weight Quantization</h3>
<p>AWQ (Lin, Tang et al., MLSys 2024) takes a different approach: <em>which weights matter most?</em> By analyzing activations across a calibration dataset, AWQ identifies ~1% of weight channels that are most frequently and strongly activated. These salient channels are scaled up before uniform quantization (so they receive more of the quantization budget), then the scaling is folded back in — no precision mixed, all INT4, but where precision counts most is preserved.</p>
<div class="callout">AWQ numbers: 4× memory reduction, up to 8.5× latency speedup, ~3.25× throughput gain vs FP16. Best quality-per-bit of any post-training INT4 method as of 2024.</div>
<h3>What Each Enables</h3>
<table>
<tr><th>Method</th><th>Precision</th><th>Memory vs FP16</th><th>Key Idea</th><th>Use Case</th></tr>
<tr><td>bitsandbytes</td><td>INT8</td><td>50% reduction</td><td>Mixed-precision for outliers</td><td>Research, low-overhead</td></tr>
<tr><td>GPTQ</td><td>INT4</td><td>75% reduction</td><td>Hessian compensation</td><td>Local inference, edge</td></tr>
<tr><td>AWQ</td><td>INT4</td><td>75% reduction</td><td>Activation-aware scaling</td><td>Best quality at INT4</td></tr>
</table>
<p><strong>Ecosystem:</strong> Ollama (GGUF/GPTQ), LM Studio, Together AI, Modal Labs, Hugging Face (AutoGPTQ, bitsandbytes integration).</p>
    `,

    id: 'speculative_decoding',
    title: 'Speculative Decoding',

    lesson: `
<h3>The Memory Bandwidth Problem</h3>
<p>Single-user LLM inference at small batch sizes is <strong>memory-bandwidth-bound</strong>. Generating each token requires loading all model weights from HBM (High Bandwidth Memory) once. A 70B FP16 model = 140 GB of weights. At 3.35 TB/s (H100 HBM), that's ~42ms per token minimum — regardless of how many FLOPs are available. The GPU is spending most of its time waiting for data, not computing.</p>
<h3>The Draft-Verify Trick</h3>
<p>Speculative decoding exploits a key asymmetry: <em>verifying K tokens in parallel costs roughly the same as generating 1 token</em>. Here's why: model weights are still loaded once from HBM, but the forward pass now processes K tokens in parallel (a batch of K), producing K+1 useful outputs in the same memory-bound step.</p>
<div class="callout">
<strong>Algorithm:</strong><br>
1. Small draft model generates K tokens cheaply (cheap weights → cheap HBM load)<br>
2. Large target model verifies all K tokens in one parallel forward pass<br>
3. Accept token i with probability min(1, p_target(i) / p_draft(i))<br>
4. If rejected at position j, sample from corrected distribution and discard drafts j+1…K<br>
5. Repeat from next token
</div>
<h3>The Mathematical Guarantee</h3>
<p>The acceptance criterion is <strong>token-level rejection sampling</strong>. The joint process samples exactly from p_target, provably — no quality loss regardless of draft model quality. Poor draft models just have lower acceptance rates (more iterations), but never produce incorrect distributions.</p>
<p>Acceptance rates in practice: 70-90% for same-family draft/target pairs (e.g., TinyLlama drafting for LLaMA-2). Net speedup: <strong>2-4× over standard generation</strong>.</p>
<h3>Variants</h3>
<ul>
  <li><strong>Classic speculative decoding:</strong> Separate small draft model (e.g., 7B draft + 70B target)</li>
  <li><strong>Medusa:</strong> Extra "heads" attached to the target model itself — no separate draft model needed</li>
  <li><strong>EAGLE:</strong> Autoregressive draft head trained to mimic the target's hidden states — highest acceptance rates</li>
  <li><strong>Prompt lookup decoding:</strong> Uses repetitions in the input prompt as draft — free, effective for summarization/editing tasks</li>
</ul>
<h3>Real-World Use</h3>
<p>Groq hardware integrates speculative decoding natively. vLLM supports all major variants. TensorRT-LLM bundles it. Google Gemini uses it in production serving infrastructure. The technique is most impactful for <em>latency-sensitive, low-batch applications</em> — chatbots, interactive agents — where throughput optimization (continuous batching) gives diminishing returns.</p>
    `,

  {
    id: 'continuous_batching',

    year: '2022–2023',
    track: 'Memory Systems',
    prereqs: ['kv_cache'],
    lesson: `
<h3>The Static Batching Problem</h3>
<p>Early LLM serving systems used <strong>static batching</strong>: group N requests into a batch, process the batch until all sequences finish, then load the next batch. This has a critical flaw: <em>the entire batch must wait for the longest sequence</em>. If 7 of 8 requests finish in 100 tokens but 1 runs to 2,000 tokens, 7 GPU slots sit idle for 1,900 steps. GPU utilization: 30-40% in production workloads.</p>
<div class="callout">Static batching: "the convoy problem." The entire convoy moves at the speed of the slowest truck.</div>
<h3>Iteration-Level Scheduling (Orca, 2022)</h3>
<p>Orca (Yu et al., OSDI 2022) introduced <strong>continuous batching</strong>: make the scheduling decision at every forward pass step, not per batch. When a sequence finishes, its slot is immediately freed. New requests from the waiting queue are inserted at the next step. GPU utilization jumps from ~40% to 70-80%+.</p>
<h3>PagedAttention (vLLM, 2023)</h3>

    lesson: `
<h3>Why Model Parallelism Is Necessary</h3>
<p>LLaMA-2 70B in FP16 = 140 GB. An H100 has 80 GB. You cannot fit it on one GPU. Model parallelism splits the model across multiple GPUs. There are two primary strategies: tensor parallelism and pipeline parallelism. Production systems use both.</p>
<h3>Tensor Parallelism</h3>
<p>Split weight matrices within each layer across GPUs along the hidden dimension. Megatron-LM (NVIDIA, 2020) formalized this for transformers:</p>
<ul>
  <li><strong>Column-parallel linear:</strong> Split weight matrix column-wise across N GPUs. Each GPU holds a different subset of output features. No communication needed before the split.</li>
  <li><strong>Row-parallel linear:</strong> Split weight matrix row-wise. Each GPU holds a different input partition. Requires <strong>AllReduce</strong> to sum partial results after the operation.</li>
  <li>Each transformer block requires exactly 2 AllReduce operations (one per MLP sub-layer pair).</li>
</ul>
<div class="callout">NVLink provides 600-900 GB/s bandwidth within a node. AllReduce for a 70B model's hidden state (~33 MB) takes ~0.04ms at NVLink speeds vs ~5ms at PCIe 4.0 bandwidth (64 GB/s). That's the difference between tensor parallelism being profitable or not.</div>
<h3>Pipeline Parallelism</h3>
<p>Assign consecutive transformer layers to different GPUs. GPU 0 handles layers 1-20, GPU 1 handles layers 21-40, etc. Activations are passed between stages via network (InfiniBand for cross-node). The fundamental problem: <strong>pipeline bubbles</strong>.</p>
<p>In a pipeline of p stages, at startup p-1 stages sit idle. At flush (end of forward pass), p-1 stages again sit idle. Bubble fraction ≈ (p-1) / (m+p-1) where m = number of micro-batches. Minimize bubbles by using many small micro-batches (large m).</p>
<h3>3D Parallelism (Megatron-LM SC 2021)</h3>
<p>Production training and inference at scale combines all three:</p>
<ul>
  <li><strong>Data parallelism:</strong> Multiple identical model copies on different data shards. Gradients synchronized via AllReduce.</li>
  <li><strong>Tensor parallelism:</strong> Within-node, using NVLink (600-900 GB/s)</li>
  <li><strong>Pipeline parallelism:</strong> Across nodes, using InfiniBand (200-400 GB/s)</li>
</ul>
<p>GPT-3 175B was trained with 8-way tensor parallelism within each node, 8-way pipeline parallelism across nodes, and 64-way data parallelism. 1,024 A100 GPUs total.</p>

<h3>The Core Idea: Soft Labels Contain More Information</h3>
<p>Suppose you train a model to classify animals. The hard label for a cat image is [0, 0, 1, 0, 0] (cat=1, everything else=0). But a powerful teacher model's output might be [0.001, 0.05, 0.92, 0.02, 0.009] — encoding that cats are more similar to tigers than to cars. This <strong>dark knowledge</strong> teaches relationships between classes that binary labels discard.</p>
<h3>Training Loss</h3>
<div class="code">L = α × KL(p_teacher(T) || p_student(T)) + (1-α) × CrossEntropy(y_hard, p_student)

T = temperature (softens distributions)
α = balancing weight (typically 0.5–0.9)
KL = Kullback-Leibler divergence</div>
<p>Higher temperature T spreads probability mass to non-top classes, making soft targets more informative about inter-class relationships. At T=1, you get the teacher's raw output. At T=5, even small similarities become visible.</p>
<h3>DistilBERT (Hugging Face, 2019)</h3>
<p>First landmark application to large language models. Student architecture: 6 transformer layers (vs BERT's 12), trained on BERT's soft targets + hidden state alignment. Results: <strong>50% fewer parameters, 40% smaller, 60% faster inference, 97% of BERT's GLUE performance</strong>.</p>
<h3>Distilling Step-by-Step (ACL 2023)</h3>
<p>A 770M parameter student model was trained not just on teacher output probabilities, but on chain-of-thought <strong>rationales</strong> generated by PaLM-540B. The small student learned the reasoning process, not just the answers. Result: 770M model with CoT rationales outperformed <em>few-shot PaLM-540B</em> on several benchmarks — a <strong>700× parameter reduction</strong> for equivalent task performance.</p>
<h3>Modern Applications</h3>
<ul>
  <li><strong>TinyLlama (2024):</strong> 1.1B parameter model trained on 3T tokens, distilling from LLaMA-2 architecturally — demonstrates that small models can punch above their weight with massive data.</li>

  <li><strong>API compression:</strong> Companies fine-tune small models on outputs from GPT-4/Claude — effectively distilling without access to weights.</li>
</ul>
<div class="callout">Key tension: quantization preserves architecture but reduces numerical precision. Distillation preserves numerical precision but changes the architecture. At extreme compression ratios, distillation typically wins. At moderate compression (2-4×), quantization is simpler.</div>

<h3>The Problem MoE Solves</h3>
<p>Dense models scale quality by adding more parameters — but every parameter is used for every token, making inference more expensive as models grow. MoE decouples <em>capacity</em> from <em>compute per token</em>.</p>
<h3>Architecture</h3>
<p>Replace the dense Feed-Forward Network (FFN) layer in each transformer block with N expert networks plus a router:</p>
<div class="code">For each token x:
  routing_weights = softmax(Router(x))     # N scores
  top_k_experts = argtop_k(routing_weights, k=2)
  output = Σ routing_weights[i] × Expert_i(x) for i in top_k_experts</div>
<p>Total parameters scale with N experts. Compute per token scales with K (typically 2). Capacity and compute are now independently tunable.</p>
<h3>Mixtral 8×7B — The Landmark Model</h3>
<p>Mistral AI's Mixtral 8×7B (2024): 8 expert FFNs, top-2 routing, resulting in:</p>
<ul>

  <li><strong>~13B active parameters per token</strong> (2/8 experts active)</li>
  <li>Matches LLaMA-2 70B performance at 13B-equivalent compute cost</li>
  <li>Requires 47B of VRAM (all experts must be loaded for routing decisions)</li>
</ul>
<div class="callout">Memory vs compute distinction: you need all 47B in VRAM, but you only run FLOPs through ~13B per token. Memory cost is full model, compute cost is sparse fraction.</div>
<h3>Training Challenge: Expert Collapse</h3>
<p>Without intervention, one expert becomes slightly better → gets selected more → improves faster → dominates routing. All other experts are starved. Solution: <strong>load-balancing auxiliary loss</strong> during training that penalizes imbalanced routing distributions, encouraging all experts to be utilized.</p>
<h3>Inference Challenges</h3>
<ul>

<p>Understanding kernel optimization requires understanding GPU memory hierarchy:</p>

<tr><th>Level</th><th>Size</th><th>Bandwidth</th><th>Latency</th></tr>
<tr><td>Registers</td><td>~256 KB/SM</td><td>~80 TB/s</td><td>~1 cycle</td></tr>

<tr><td>L2 Cache</td><td>~50 MB</td><td>~7 TB/s</td><td>~200 cycles</td></tr>
<tr><td>HBM (global)</td><td>80 GB</td><td>~3.35 TB/s</td><td>~700 cycles</td></tr>
</table>
<p>The bottleneck for most LLM operations: HBM reads/writes. PyTorch eager execution writes each operation's output back to HBM and reads it for the next operation. For RMSNorm → Linear → SwiGLU (3 sequential ops), that's 6 HBM trips instead of 1.</p>
<h3>Kernel Fusion</h3>
<p>A custom kernel keeps intermediates in on-chip SRAM/registers across multiple compute steps. The fused RMSNorm+Linear+SwiGLU operation: reads input once from HBM, computes all three operations with intermediates in SRAM, writes final output once to HBM. Result: 6× fewer HBM accesses, 8× faster wall-clock time.</p>
<h3>FlashAttention (Stanford, NeurIPS 2022)</h3>
<p>Standard attention materializes the N×N attention score matrix in HBM — O(N²) memory, major bottleneck for long sequences. FlashAttention solves this with <strong>IO-aware tiling</strong>:</p>
<ul>
  <li>Divide Q, K, V into blocks that fit in SRAM (~20 MB)</li>
  <li>Compute attention block by block, accumulating output and normalizer incrementally</li>
  <li>Use <strong>online softmax</strong> — maintains running max and sum to compute correct normalized scores without storing the full matrix</li>
  <li>Write only the final output to HBM</li>
</ul>
<div class="callout">FlashAttention results: O(N) memory instead of O(N²). 7.6× speedup on A100. EXACT same output (not approximate). This is purely an IO optimization — the math is identical, just computed in a smarter order.</div>
<h3>FlashAttention-2 and FlashAttention-3</h3>
<p>FA-2 (ICLR 2024): better parallelism across attention heads, reduced non-matmul operations (matmuls are accelerated by Tensor Cores; other ops are not). FA-3: asynchronous pipeline exploiting H100's WGMMA instructions for near-theoretical peak utilization.</p>
<h3>Triton — Programmable GPU Kernels Without CUDA</h3>
<p>OpenAI's Triton (2019) provides a Python-native DSL for writing tiled GPU kernels. Instead of writing CUDA C++, you write Triton Python that compiles to efficient PTX. Lowered barrier: ML researchers (not just CUDA engineers) can write custom kernels.</p>
<p>Triton handles: block scheduling, shared memory management, coalesced memory access. Developer handles: tile sizes, algorithmic structure. The Liger Kernel library (LinkedIn, 2024): pure Triton implementations of RMSNorm, SwiGLU, CrossEntropy, LoRA — 20% throughput improvement on LLaMA training with a one-line import.</p>

    prereqs: ['continuous_batching', 'triton_cuda', 'hardware'],
    lesson: `
<h3>Why This Is Hard</h3>
<p>A production LLM serving system must simultaneously handle: dynamic request streams with variable lengths, KV cache memory management under memory pressure, multiple GPUs with model parallelism, batching decisions every ~20ms, different model architectures and quantization formats, and HTTP API compatibility. Each framework makes different trade-offs.</p>
<h3>Framework Comparison</h3>
<table>
<tr><th>Framework</th><th>Origin</th><th>Core Innovation</th><th>Setup Complexity</th></tr>
<tr><td>vLLM</td><td>UC Berkeley, 2023</td><td>PagedAttention + continuous batching</td><td>Low</td></tr>
<tr><td>TGI</td><td>HuggingFace, 2022</td><td>HF ecosystem + early continuous batching</td><td>Low</td></tr>
<tr><td>TensorRT-LLM</td><td>NVIDIA, 2023</td><td>Compiled CUDA engines, FP8, Transformer Engine</td><td>High</td></tr>
<tr><td>Ollama</td><td>Community, 2023</td><td>One-command local deployment via llama.cpp</td><td>Minimal</td></tr>
<tr><td>SGLang</td><td>UC Berkeley, 2024</td><td>RadixAttention + structured generation DSL</td><td>Low-Medium</td></tr>
</table>
<h3>vLLM — The Production Default</h3>
<p>Open-source, rapidly iterating. PagedAttention for memory efficiency, continuous batching for throughput, tensor parallelism for multi-GPU. OpenAI-compatible API. Most popular open-source LLM serving framework as of 2024-2025. Weakness: not the highest raw throughput — compiled frameworks beat it at maximum load.</p>
<h3>TensorRT-LLM — Maximum NVIDIA Throughput</h3>
<p>Compiles a model into a hardware-specific engine file: fused CUDA kernels, FP8 Transformer Engine, optimal memory layouts for the specific GPU model. 20-40% higher throughput than vLLM at maximum concurrency. Cost: <strong>compilation takes 30 min to 2+ hours</strong> per model/GPU/precision combination and must be regenerated for any change. Not suitable for experimentation; excellent for stable production workloads on known hardware.</p>
<h3>SGLang — Structured Generation and Prefix Sharing</h3>
<p>UC Berkeley (2024). RadixAttention: implements a radix tree (trie) indexing all KV cache blocks by their prefix content. Any new request automatically gets the longest matching prefix reuse, without explicit configuration. Critical for RAG workloads where many requests share retrieval context, and for multi-turn agents where system prompts are fixed. The structured generation DSL (SGL) enables efficient multi-call workflows.</p>
<h3>Ollama — Local Deployment</h3>
<p>Wraps llama.cpp for one-command model management: `ollama run llama3.2`. Automatic GGUF quantized model downloads, Metal backend for Apple Silicon, CPU+GPU mixed inference. Targets single-user local deployments, not multi-user production serving. Throughput: excellent for one user, poor for concurrent requests.</p>
<h3>Decision Framework</h3>
<div class="callout">High-concurrency production → <strong>vLLM</strong><br>
Max throughput on known NVIDIA hardware → <strong>TensorRT-LLM</strong><br>
RAG / repeated prefixes / structured outputs → <strong>SGLang</strong><br>
Local development / Apple Silicon → <strong>Ollama</strong><br>
HuggingFace model hub integration → <strong>TGI</strong></div>
    `,
    questions: [
      {
        q: 'TensorRT-LLM achieves higher throughput than vLLM but is rarely used for rapid experimentation. Why?',
        options: ['TensorRT-LLM does not support INT4 or FP8 precision formats','It requires compiling a hardware-specific engine for each model/GPU/precision combination, taking 30 min to 2+ hours and requiring full recompilation for any model change','It requires writing custom CUDA code for each model architecture you want to deploy','TensorRT-LLM\'s API is not OpenAI-compatible, requiring custom client code'],
        correct: 1,
        explain: ['TensorRT-LLM actually has the broadest precision support of any framework — INT8, INT4, FP8, FP16, BF16 with Transformer Engine.', null, 'Pre-built TensorRT-LLM backends exist for LLaMA, Mistral, GPT, Falcon, and other popular architectures.', 'TensorRT-LLM via Triton Inference Server supports OpenAI-compatible REST endpoints. API compatibility is not the barrier.']
      },
      {
        q: 'Ollama uses llama.cpp. What does this mean specifically for Apple M-series users?',
        options: ['llama.cpp\'s Metal backend uses Apple Silicon\'s unified memory (up to 192 GB on M2 Ultra, 400 GB/s on M2 Max) for GPU inference without an NVIDIA GPU — enabling competitive inference speeds for quantized models','llama.cpp converts models to Core ML format for the Apple Neural Engine','llama.cpp is CPU-only on Apple Silicon; GPU acceleration requires a separate tool','Models must be converted to Apple\'s MLPackage format before Ollama can run them on Mac'],
        correct: 0,
        explain: [null, 'llama.cpp uses the Metal API for GPU acceleration, not Core ML. The ANE (Apple Neural Engine) is separate and used for specific Apple-developed models.', 'Metal GPU acceleration is a first-class, well-optimized backend in llama.cpp — it\'s not CPU-only.', 'GGUF format works directly on all platforms including Mac. No format conversion is needed.']
      },
      {
        q: 'What is SGLang\'s RadixAttention advantage over vLLM\'s prefix caching?',
        options: ['Radix sort speeds up attention score computation across batched requests','A radix tree indexes all cached KV blocks by prefix content, enabling automatic longest-prefix matching for any new request — vLLM requires manual prefix configuration, SGLang catches all sharing automatically','RadixAttention skips certain token positions based on learned attention importance','Splits the attention matrix into radix-2 blocks for faster cache-line-aligned memory access'],
        correct: 1,
        explain: ['"Radix" here refers to the radix tree data structure (a compressed trie), not radix sort. Attention computation order is unrelated.', null, 'Sparse attention (skipping positions) is a different class of optimization. RadixAttention computes full, exact attention.', '"Radix" is the data structure (prefix tree), not binary decomposition. Block sizes are determined by PagedAttention/memory constraints, not radix-2.']
      }
    ]
  }
];

const TRACKS = [
  { id: 'Memory Systems', label: 'Memory Systems' },
  { id: 'Compression', label: 'Compression' },
  { id: 'Scale', label: 'Parallelism & Scale' },
  { id: 'Production', label: 'Production' }
];

const state = {
  completed: new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')),
  active: null,
  tab: 'lesson',
  qIndex: 0,
  answered: {}
};

function save() {
  localStorage.setItem(LS_KEY, JSON.stringify([...state.completed]));
}

function isPaperUnlocked(paper) {
  return paper.prereqs.every(id => state.completed.has(id));
}

function updateBadge() {
  document.getElementById('progress-badge').textContent = `${state.completed.size} / ${PAPERS.length}`;
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  TRACKS.forEach(track => {
    const papers = PAPERS.filter(p => p.track === track.id);
    if (!papers.length) return;
    const lbl = document.createElement('div');
    lbl.className = 'track-label';
    lbl.textContent = track.label;
    sb.appendChild(lbl);
    papers.forEach(paper => {
      const unlocked = isPaperUnlocked(paper);
      const completed = state.completed.has(paper.id);
      const div = document.createElement('div');
      div.className = 'paper-node' + (paper.id === state.active ? ' active' : '') + (completed ? ' completed' : '') + (!unlocked ? ' locked' : '');
      div.innerHTML = `<div class="title">${paper.title}</div><div class="meta">${paper.year}</div>` +
        (completed ? '<div class="check">✓</div>' : (!unlocked ? '<div class="lock-icon">🔒</div>' : ''));
      if (unlocked) div.onclick = () => openPaper(paper.id);
      sb.appendChild(div);
    });
  });
}

function openPaper(id) {
  state.active = id;
  state.tab = 'lesson';
  state.qIndex = 0;
  state.answered = {};
  renderSidebar();
  renderMain();
}

function renderMain() {
  const paper = PAPERS.find(p => p.id === state.active);
  if (!paper) {
    renderWelcome();
    return;
  }
  const unlocked = isPaperUnlocked(paper);
  const completed = state.completed.has(paper.id);
  const main = document.getElementById('main');
  if (!unlocked) {
    main.innerHTML = `<div class="paper-view"><div class="locked-msg"><h3>🔒 Prerequisites Required</h3><p>Complete the following first:</p><div class="prereq-tags">${paper.prereqs.map(id => { const p = PAPERS.find(x=>x.id===id); return `<span class="prereq-tag">${p?p.title:id}</span>`; }).join('')}</div></div></div>`;
    return;
  }
  main.innerHTML = `
    <div class="paper-view">
      <div class="paper-header">
        <h2>${paper.title}</h2>
        <div class="meta" style="color:#aaa;font-size:0.85rem;margin-top:4px">${paper.authors}</div>
        <div class="paper-meta">
          <span class="pill gold">${paper.track}</span>
          <span class="pill">${paper.year}</span>
          ${completed ? '<span class="pill" style="border-color:#FF8F00;color:#FF8F00">✓ Completed</span>' : ''}
          ${paper.prereqs.length ? `<span class="pill">Prereqs: ${paper.prereqs.map(id=>{ const p=PAPERS.find(x=>x.id===id); return p?p.title:id; }).join(', ')}</span>` : '<span class="pill">Starting paper</span>'}
        </div>
      </div>
      <div class="tabs">
        <div class="tab ${state.tab==='lesson'?'active':''}" onclick="showTab('lesson')">Lesson</div>
        <div class="tab ${state.tab==='quiz'?'active':''}" onclick="showTab('quiz')">Quiz (${paper.questions.length}q)</div>
      </div>
      <div id="tab-content"></div>
    </div>`;
  renderTabContent();
}

function showTab(tab) {
  state.tab = tab;
  state.qIndex = 0;
  state.answered = {};
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.startsWith(tab === 'lesson' ? 'Lesson' : 'Quiz')));
  renderTabContent();
}

function renderTabContent() {
  const tc = document.getElementById('tab-content');
  if (!tc) return;
  if (state.tab === 'lesson') {
    const paper = PAPERS.find(p => p.id === state.active);
    tc.innerHTML = `<div class="lesson-body">${paper.lesson}<div style="margin-top:24px"><button class="btn btn-primary" onclick="showTab('quiz')">Start Quiz →</button></div></div>`;
  } else {
    renderQuiz();
  }
}

function renderQuiz() {
  const tc = document.getElementById('tab-content');
  const paper = PAPERS.find(p => p.id === state.active);
  const q = paper.questions[state.qIndex];
  const totalQ = paper.questions.length;
  const answered = state.answered[state.qIndex];
  const allCorrect = paper.questions.every((_, i) => state.answered[i] === 'correct');

  if (allCorrect) {
    renderCompletion(paper);
    return;
  }

  const letters = ['A','B','C','D'];
  let optionsHTML = q.options.map((opt, i) => {
    let cls = 'option';
    if (answered) {
      cls += ' disabled';
      if (i === q.correct) cls += ' correct';
      else if (answered === i) cls += ' wrong';
    }
    const explain = answered !== undefined && i !== q.correct && q.explain[i] ? `<div class="opt-explain">${q.explain[i]}</div>` : '';
    const correctExplain = answered !== undefined && i === q.correct && answered !== 'correct' ? `<div class="opt-explain" style="display:block;color:#88cc88">This is correct.</div>` : '';
    return `<div class="${cls}" onclick="selectOption(${i})"><div class="opt-letter">${letters[i]}</div><div class="opt-body"><div class="opt-text">${opt}</div>${explain}${correctExplain}</div></div>`;
  }).join('');

  let nav = '';
  if (answered !== undefined) {
    if (answered === q.correct || answered === 'correct') {
      if (state.qIndex < totalQ - 1) {
        nav = `<button class="btn btn-primary" onclick="nextQuestion()">Next Question →</button>`;
      } else {
        nav = `<button class="btn btn-primary" onclick="checkAllDone()">Finish Quiz →</button>`;
      }
    } else {
      nav = `<button class="btn btn-secondary" onclick="retryQuestion()">Try Again</button>`;
      if (state.qIndex < totalQ - 1) {
        nav += ` <button class="btn btn-primary" onclick="nextQuestion()">Skip for now →</button>`;
      }
    }
  }

  tc.innerHTML = `<div class="quiz-wrap">
    <div class="quiz-progress">Question ${state.qIndex + 1} of ${totalQ} — ${state.completed.has(paper.id) ? 'Already completed' : 'Must pass ALL to unlock next papers'}</div>
    <div class="q-card">
      <div class="q-text">${q.q}</div>
      ${optionsHTML}
    </div>
    <div class="q-nav">${nav}</div>
  </div>`;
}

function selectOption(i) {
  if (state.answered[state.qIndex] !== undefined) return;
  const paper = PAPERS.find(p => p.id === state.active);
  const q = paper.questions[state.qIndex];
  state.answered[state.qIndex] = (i === q.correct) ? 'correct' : i;
  renderQuiz();
}

function nextQuestion() {
  state.qIndex++;
  renderQuiz();
}

function retryQuestion() {
  delete state.answered[state.qIndex];
  renderQuiz();
}

function checkAllDone() {
  const paper = PAPERS.find(p => p.id === state.active);
  const allCorrect = paper.questions.every((_, i) => state.answered[i] === 'correct' || state.answered[i] === paper.questions[i].correct);
  // Actually check all answered correctly
  const allPass = paper.questions.every((q, i) => {
    const ans = state.answered[i];
    return ans === 'correct' || ans === q.correct;
  });
  if (allPass) {
    state.completed.add(paper.id);
    save();
    updateBadge();
    renderSidebar();
    renderCompletion(paper);
  } else {
    // Find first failed question
    const firstFail = paper.questions.findIndex((q, i) => {
      const ans = state.answered[i];
      return ans !== 'correct' && ans !== q.correct;
    });
    state.qIndex = firstFail;
    renderQuiz();
  }
}

function renderCompletion(paper) {
  const paper2 = PAPERS.find(p => p.id === state.active);
  const tc = document.getElementById('tab-content');

  // Mark as completed
  if (!state.completed.has(paper.id)) {
    state.completed.add(paper.id);
    save();
    updateBadge();
    renderSidebar();
  }

  const unlocked = PAPERS.filter(p => p.prereqs.includes(paper.id) && isPaperUnlocked(p));
  tc.innerHTML = `<div class="quiz-wrap"><div class="completion">
    <div class="star">⚡</div>
    <h3>Section Complete: ${paper.title}</h3>
    <p style="margin-top:8px">All questions answered correctly.</p>
    ${unlocked.length ? `<p style="margin-top:16px;color:#FFD700">Unlocked: ${unlocked.map(p=>`<strong>${p.title}</strong>`).join(', ')}</p>` : ''}
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:center">
      <button class="btn btn-secondary" onclick="showTab('lesson')">Review Lesson</button>
      ${unlocked.length ? `<button class="btn btn-primary" onclick="openPaper('${unlocked[0].id}')">Next: ${unlocked[0].title} →</button>` : ''}
    </div>
  </div></div>`;
}

function renderWelcome() {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="welcome">
    <h2>LLM Inference Optimization</h2>
    <p>From KV Cache to serving frameworks — the papers and systems that make large language models fast enough to deploy at scale. Master each concept in order, unlock the next building block.</p>
    <div class="stats">
      <div class="stat-card"><div class="num">${PAPERS.length}</div><div class="lbl">Topics</div></div>
      <div class="stat-card"><div class="num">${PAPERS.reduce((a,p)=>a+p.questions.length,0)}</div><div class="lbl">Quiz Questions</div></div>
      <div class="stat-card"><div class="num">${state.completed.size}</div><div class="lbl">Completed</div></div>
    </div>
    <p>Start with any unlocked paper (no lock icon). Complete the quiz to unlock dependent topics.</p>
    <div style="margin-top:24px">
      <button class="btn btn-primary" onclick="openPaper('kv_cache')">Start: KV Cache →</button>
    </div>
  </div>`;
}

// Init
updateBadge();
renderSidebar();
renderWelcome();
</script>
