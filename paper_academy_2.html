{
  id:'faiss', title:'FAISS — Vector Search', shortTitle:'FAISS', year:2017,
  authors:'Johnson, Douze, Jégou · Meta AI Research',
  venue:'IEEE TPAMI 2021 (arXiv 2017)', category:'Retrieval & Memory', prereqs:[],
  icon:'🔎', tagline:'Searching a billion vectors in milliseconds',
  lesson:[
    {h:'The Problem: Nearest Neighbor at Scale',body:`Given a query vector (e.g., the embedding of a user\'s question), find the k most similar vectors among a billion stored embeddings. This is the "nearest neighbor search" problem.

Brute force: compute cosine similarity between the query and all 1B vectors. On a single CPU: 1B dot products ≈ 10-100 seconds. For a real-time search engine, unacceptable.

FAISS (Facebook AI Similarity Search) solves this with approximate nearest neighbor (ANN) search — trading a tiny bit of recall for orders-of-magnitude speedup.`},
    {h:'How FAISS Works: Indexing Strategies',body:`FAISS offers several index types:
<ul>
<li><strong>Flat Index:</strong> Exact brute force. Slow but perfect recall. Used for small datasets.</li>
<li><strong>IVF (Inverted File):</strong> Cluster vectors into groups (k-means). Search only nearby clusters. 10-100× faster, ~95%+ recall.</li>
<li><strong>PQ (Product Quantization):</strong> Compress vectors to 1/8th size by quantizing subspaces. 8× memory reduction.</li>
<li><strong>HNSW (Hierarchical Navigable Small World):</strong> Graph-based index. Fastest queries, high recall.</li>
</ul>`,callout:`FAISS can search 1 billion 128-dimensional vectors in under 1 second on a GPU. This is what makes vector databases possible.`},
    {h:'The Vector Database Industry',body:`FAISS is the search engine inside every vector database:
<ul>
<li><strong>Pinecone:</strong> Managed vector DB, $750M raised</li>
<li><strong>Weaviate:</strong> Open-source + cloud, $160M raised</li>
<li><strong>Chroma:</strong> Open-source, the default for LangChain/LlamaIndex dev workflows</li>
<li><strong>Qdrant:</strong> Rust-based, high performance</li>
<li><strong>pgvector:</strong> Vector search inside PostgreSQL</li>
</ul>
The rise of RAG (Retrieval Augmented Generation) made vector search a first-class infrastructure component. Every LLM application that retrieves relevant context before generating a response depends on FAISS-style search.`}
  ],
  questions:[
    {q:'Why is approximate nearest neighbor (ANN) search used instead of exact nearest neighbor for large-scale vector search?',
     opts:['ANN is more accurate than exact search','Exact nearest neighbor requires computing similarity against every stored vector — at 1B+ scale this takes seconds per query. ANN methods trade a small recall reduction (finding 95%+ of true neighbors) for 100-1000× speedup','ANN uses less memory than exact search','Exact search requires special GPU hardware unavailable in commodity clouds'],
     correct:1,
     explain:['ANN is approximate by definition — it may miss some true nearest neighbors. Exact search finds all true neighbors but is too slow.',null,'A real-time search endpoint has a latency budget of 10-100ms. Exact search over 1B 768-dimensional embeddings requires 1B dot products ≈ several seconds on CPU. IVF-based ANN search touches only ~1% of vectors (the nearest clusters) and returns in milliseconds. For most applications, finding 95-99% of true nearest neighbors is indistinguishable from exact search in downstream quality.',  'ANN with Product Quantization uses LESS memory — that\'s a separate benefit. But the primary motivation for ANN is query speed.','Exact search runs on standard hardware. The issue is latency at scale, not hardware availability.']},
    {q:'In a RAG (Retrieval-Augmented Generation) system, what is FAISS searching for?',
     opts:['FAISS searches for the exact words from the user\'s query in a document database','FAISS finds document chunks whose embedding vectors are most similar (in cosine/dot product distance) to the query embedding — enabling semantic search beyond keyword matching','FAISS searches for the model weights that best match the current input','FAISS selects which LLM to use based on the query type'],
     correct:1,
     explain:['Exact keyword search is traditional full-text search (Elasticsearch/BM25). FAISS operates on dense embedding vectors, enabling semantic matches like "heart attack" matching "myocardial infarction."',null,'The user\'s question is embedded into a dense vector (e.g., 1536 dimensions using an embedding model). FAISS finds the k stored document chunks whose embeddings are most similar. These semantically relevant chunks are then injected into the LLM prompt as context. This enables the LLM to answer questions about proprietary data it was never trained on — because the relevant information is retrieved at query time.','FAISS searches a vector index, not model weights. Model selection is handled by routing logic, not similarity search.','FAISS doesn\'t select models. It\'s a search library that returns vectors, not model routing logic.']},
  ]
},

{
  id:'rag', title:'Retrieval-Augmented Generation (RAG)', shortTitle:'RAG', year:2020,
  authors:'Lewis, Perez, Piktus, Peters, Rocktäschel, Stenetorp, Riedel · Meta FAIR + UCL',
  venue:'NeurIPS 2020', category:'Retrieval & Memory', prereqs:['faiss'],
  icon:'📚', tagline:'Give LLMs access to external knowledge at query time',
  lesson:[
    {h:'The LLM Knowledge Problem',body:`Large language models have a critical limitation: their knowledge is frozen at training time. GPT-4 knows nothing about events after its cutoff date. It cannot access your company\'s internal documents, your customer database, or yesterday\'s news. Fine-tuning to add new knowledge is expensive ($100K+) and must be repeated as data changes.

RAG (Retrieval-Augmented Generation) solves this: retrieve relevant documents at query time, inject them into the prompt, and let the LLM generate answers grounded in retrieved content.`},
    {h:'The RAG Architecture',body:`Three components:
<ul>
<li><strong>Indexing pipeline:</strong> Chunk documents → embed each chunk → store in vector database</li>
<li><strong>Retrieval:</strong> Embed user query → vector search → retrieve top-k relevant chunks</li>
<li><strong>Generation:</strong> Inject retrieved chunks into prompt as context → LLM generates answer citing retrieved content</li>
</ul>`,callout:`RAG is not just about adding context. The LLM must be instructed to use the context (system prompt: "Answer only based on the provided documents"). Without this, the LLM ignores context and hallucinates from its parametric memory.`},
    {h:'Why Every Enterprise AI App Uses RAG',body:`RAG solves all three major LLM deployment problems:
<ul>
<li><strong>Knowledge cutoff:</strong> Retrieval happens at query time — data is always fresh</li>
<li><strong>Hallucination:</strong> LLM is grounded in retrieved documents — cites sources</li>
<li><strong>Private data:</strong> Internal docs never go into training — stay in your vector DB</li>
</ul>
Glean (ex-Google, $7.2B) is essentially RAG at enterprise scale: embed all Slack messages, Confluence pages, and Google Docs, then retrieve relevant context for any query. That\'s the product.`,callout_green:`RAG → Glean ($7.2B), Perplexity ($21B), every enterprise LLM product. The entire "AI on your data" industry is RAG with a good UI.`}
  ],
  questions:[
    {q:'What problem does RAG solve that fine-tuning cannot?',
     opts:['RAG produces higher quality text than fine-tuned models','Fine-tuning bakes knowledge into model weights at training time — it\'s expensive, slow, and immediately stale. RAG retrieves knowledge at query time from an always-current external index — handling fresh information without retraining','RAG is faster at inference than fine-tuned models','Fine-tuning requires more data than RAG'],
     correct:1,
     explain:['Fine-tuned models can produce very high quality text for their domain. Quality is not the primary distinction.',null,'If your documentation updates daily, fine-tuning a model weekly costs tens of thousands of dollars and introduces a perpetual lag. RAG\'s retrieval index can be updated in minutes (re-embed new documents, add to vector DB). This makes RAG the right architecture for any application where data changes — which is most enterprise applications.','RAG actually adds latency (retrieval step + longer context → more tokens to process). Fine-tuned models can be faster at inference.','Both RAG and fine-tuning require curated datasets. Fine-tuning typically requires thousands of examples; RAG requires documents chunked for retrieval.']},
    {q:'What is "chunking" in a RAG pipeline and why does chunk size matter?',
     opts:['Chunking compresses documents to save storage','Documents are split into smaller pieces (chunks) for embedding and retrieval — too large a chunk dilutes the embedding signal; too small loses context that the LLM needs to answer correctly','Chunking encrypts document sections for access control','Chunks are the unit of billing in RAG API services'],
     correct:1,
     explain:['Chunking has nothing to do with compression. The original text is preserved; it\'s just split into pieces.',null,'An embedding model produces one vector per input. If you embed an entire 100-page PDF as one vector, that vector must capture everything — the embedding is diluted and retrieval becomes imprecise. Splitting into 200-word chunks means each embedding represents a focused concept. But chunks too small (one sentence) lose surrounding context the LLM needs to generate a coherent answer. Typical optimal chunk size is 256-512 tokens with 20% overlap between adjacent chunks.','Access control is a separate concern. Chunking is about retrieval granularity, not security.','Chunking is a pre-processing step you implement — it\'s not a billing unit in standard RAG APIs.']},
  ]
},

// ─── EFFICIENCY TRACK ─────────────────────────────────────────────────────────
{
  id:'lora', title:'LoRA — Low-Rank Adaptation', shortTitle:'LoRA', year:2021,
  authors:'Hu, Shen, Wallis, Allen-Zhu, Li, Wang, Chen · Microsoft Research',
  venue:'ICLR 2022', category:'Efficiency', prereqs:['resnet'],
  icon:'🪶', tagline:'Fine-tune a 70B model for $20',
  lesson:[
    {h:'The Fine-Tuning Problem',body:`A pre-trained model like LLaMA-70B has 70 billion parameters. Full fine-tuning updates all 70B parameters — requiring 8× A100 GPUs, $50K+ in compute, and weeks of training. This makes customizing LLMs inaccessible to most organizations.

LoRA (Low-Rank Adaptation) fine-tunes a fraction of the parameters by making a key observation: the weight updates during fine-tuning are low-rank — they can be approximated by small matrices.`},
    {h:'The Math: Low-Rank Decomposition',body:`For a weight matrix W of size d×k (e.g., 4096×4096 = 16M parameters):

Instead of updating W directly, add a low-rank update: W' = W + BA

Where B is d×r and A is r×k, and r << d (rank, e.g., r=8).

Parameters in update: r×d + r×k = r×(d+k) = 8×8192 = 65,536 — instead of 16,777,216. That\'s a 256× reduction.

During training: W is frozen. Only A and B are updated. At inference: merge W + BA back into W — zero runtime overhead.`,callout:`Only 0.1-1% of parameters are trained. Yet fine-tuning quality approaches full fine-tuning for most tasks. A consumer GPU (RTX 4090, 24GB VRAM) can fine-tune a 7B model with LoRA.`},
    {h:'QLoRA and Democratization',body:`QLoRA (Dettmers et al., 2023) combined LoRA with 4-bit quantization of the frozen base model — the base model weights are compressed to 4 bits (from 16), reducing memory by 4×. With QLoRA:
<ul>
<li>Fine-tune LLaMA-65B on a single 48GB GPU</li>
<li>Fine-tune a 7B model on a consumer RTX 3090 (24GB)</li>
<li>Full fine-tuning cost: ~$100K. QLoRA cost: ~$20</li>
</ul>
This democratized LLM fine-tuning. Hugging Face PEFT library made LoRA accessible with 5 lines of code.`,callout_green:`LoRA + QLoRA → every organization can fine-tune their own LLM on domain data. The fine-tuning API economy (Together AI, Replicate, Modal) is built on making this even easier. This is why open-source LLMs (LLaMA) became competitive with proprietary ones.`}
  ],
  questions:[
    {q:'Why does LoRA work despite updating only 0.1% of model parameters?',
     opts:['LoRA fine-tunes the most important 0.1% of parameters while skipping the rest','The hypothesis is that weight updates during fine-tuning have low intrinsic rank — the change in weights lives in a low-dimensional subspace, which LoRA\'s BA decomposition captures accurately','LoRA uses a smarter optimizer that achieves the same result with fewer gradient steps','0.1% of 70B parameters is still 70M — enough parameters to express any function'],
     correct:1,
     explain:['LoRA doesn\'t select which specific weights are most important — it adds a low-rank update alongside ALL attention weight matrices uniformly.',null,'The key empirical finding from the LoRA paper: the rank of weight update matrices (ΔW) during fine-tuning is very low — typically rank 1-8 is sufficient to capture the task-specific changes. This suggests that adapting a model to a new task requires changing a relatively small "direction" in weight space, not all 70B weights independently. LoRA explicitly parameterizes this low-rank structure.','LoRA uses the same optimizers (Adam) as full fine-tuning. The efficiency comes from the number of parameters, not optimizer improvement.',  '70M parameters is indeed large, but this answer misses the point. The question is WHY it works — the mathematical reason is the low-rank hypothesis, not just parameter count.']},
    {q:'What is "rank" in the context of LoRA, and how does choosing a higher rank affect the trade-off?',
     opts:['Rank refers to the model\'s position in a leaderboard — higher rank means better performance','Rank (r) determines the size of the LoRA matrices (B is d×r, A is r×k) — higher rank means more trainable parameters and more expressive updates, but more memory and compute; lower rank is more efficient but may underfit complex tasks','Rank is the number of training epochs used','Rank determines how quickly the model converges during training'],
     correct:1,
     explain:['This uses "rank" in a colloquial sense. In linear algebra, rank is the dimensionality of the matrix\'s column space.',null,'With r=1, you train the minimal possible update — a single "direction" of change. With r=64, you can express richer adaptations. In practice, r=4 to r=16 suffices for most fine-tuning tasks (instruction following, domain adaptation). r=64+ is used for complex style transfer or knowledge injection. The sweet spot balances expressiveness against compute/memory cost.','LoRA rank is a model architecture hyperparameter, not a training schedule parameter.','Convergence speed depends on learning rate and optimizer, not LoRA rank.']},
  ]
},

{
  id:'flashattn', title:'FlashAttention', shortTitle:'FlashAttention', year:2022,
  authors:'Dao, Fu, Ermon, Rudra, Ré · Stanford / Together AI',
  venue:'NeurIPS 2022', category:'Efficiency', prereqs:['lora'],
  icon:'⚡', tagline:'The algorithmic breakthrough that made long contexts possible',
  lesson:[
    {h:'The Memory Bottleneck in Attention',body:`Standard attention computes a N×N matrix (N = sequence length) storing attention scores between all token pairs. For N=8192 tokens: 8192² = 67 million entries × 4 bytes = 256MB just for the attention matrix — just for one layer, one head, one example. With 96 layers and large batches, this exceeds GPU memory for long sequences.

The GPU memory bottleneck (not compute) was limiting context window size. FlashAttention fixed this by rethinking HOW attention is computed.`},
    {h:'IO-Aware Attention: Tiling',body:`FlashAttention\'s insight: standard attention writes the entire N×N attention matrix to GPU HBM (high-bandwidth memory), then reads it back for the softmax and value computation. This memory transfer is the bottleneck.

Solution: compute attention in tiles that fit in the fast SRAM (on-chip memory, 100× faster than HBM). The full N×N matrix is never materialized.

Algorithm: divide Q, K, V into blocks. For each block of Q, iterate over blocks of K and V, accumulating the softmax statistics incrementally. The result is mathematically identical to standard attention but without ever writing the full attention matrix to HBM.`,callout:`FlashAttention is 2-4× faster than standard attention and uses O(N) memory instead of O(N²). This enabled context windows to scale from 2K tokens to 128K+ tokens.`},
    {h:'What This Enabled',body:`FlashAttention directly enabled:
<ul>
<li><strong>Long contexts:</strong> 128K tokens (Claude), 1M tokens (Gemini 1.5 Pro) became feasible</li>
<li><strong>Faster training:</strong> Most LLM training today uses FlashAttention as default</li>
<li><strong>Multi-head parallelism:</strong> FlashAttention-2 parallelizes across heads and sequence length</li>
</ul>

Tri Dao (FlashAttention author) co-founded Together AI (AI cloud for open-source models, ~$1B valuation). Every major LLM training framework (HuggingFace, Megatron-LM, NanoGPT) uses FlashAttention as default.`,callout_green:`FlashAttention is the reason you can have a 1-hour meeting transcript in one Claude context window. Before it, context was limited by GPU memory, not model capability.`}
  ],
  questions:[
    {q:'FlashAttention achieves the same mathematical result as standard attention but is 2-4× faster. How?',
     opts:['It approximates attention with a sparser matrix','It moves the attention computation to CPU to free GPU memory','It restructures the computation to avoid writing the full N×N attention matrix to GPU high-bandwidth memory — tiling operations to use fast on-chip SRAM instead','It reduces the number of attention heads'],
     correct:2,
     explain:['FlashAttention is exact — not an approximation. Sparse attention (Longformer, BigBird) is a different approach that changes the attention pattern. FlashAttention computes full attention.',null,'Moving computation to CPU would be dramatically slower, not faster. The bottleneck is GPU memory bandwidth, and the solution is staying on GPU but using faster on-chip memory.','The GPU has two memory types: fast on-chip SRAM (~10-20MB per streaming multiprocessor, very fast) and off-chip HBM (~40-80GB, 10-100× slower). Standard attention writes the N×N matrix to HBM, then reads it back. FlashAttention tiles the computation so intermediate results stay in SRAM. The final result is identical but the expensive HBM round-trips are eliminated.','Number of attention heads is a model architecture choice, not something FlashAttention changes. It works with any number of heads.']},
    {q:'Why does the O(N²) memory complexity of standard attention limit context window size?',
     opts:['O(N²) compute means longer sequences take exponentially more time','The N×N attention matrix must fit in GPU memory — at sequence length 8192, this is 256MB per layer per batch element. With 96 layers and large batches, total GPU memory is exceeded','O(N²) requires special hardware not available in consumer GPUs','Standard attention is limited by the vocabulary size, not sequence length'],
     correct:1,
     explain:['O(N²) compute (not just memory) does increase training time, but this is separate from the memory wall. The memory issue is what creates the hard limit on sequence length.',null,'At 8192 tokens, the attention score matrix for one head is 8192² = 67M fp16 values = 134MB. Multiply by 96 layers × number of heads × batch size = tens to hundreds of GB. An A100 has 80GB of HBM. The attention matrix alone can exhaust GPU memory, preventing training with longer sequences. FlashAttention\'s O(N) memory requirement removes this constraint — only tiles of the matrix exist in memory at any time.','Both standard attention and FlashAttention run on the same consumer and data center GPUs. Hardware type is not the constraint.','Vocabulary size affects embedding table size but not attention matrix size. Sequence length is the variable that creates the N×N bottleneck.']},
  ]
},

// ─── OPEN SOURCE / ECOSYSTEM TRACK ───────────────────────────────────────────
{
  id:'ppo', title:'PPO — Proximal Policy Optimization', shortTitle:'PPO', year:2017,
  authors:'Schulman, Wolski, Dhariwal, Radford, Klimov · OpenAI',
  venue:'arXiv 2017', category:'RL & Alignment', prereqs:['qlearning'],
  icon:'🎯', tagline:'The RL algorithm inside ChatGPT',
  lesson:[
    {h:'Why Policy Gradient Needed Improvement',body:`Basic policy gradient (REINFORCE) works but is unstable: the gradient can be huge when a batch of episodes happened to get high rewards, causing a catastrophic policy update that destroys months of training. This is like a student who had a lucky exam and decides to study nothing else — overreacting to one data point.

Trust Region Policy Optimization (TRPO, 2015) added a constraint: don\'t move the policy too far from its current version. But TRPO required computing second-order derivatives — slow and complex to implement.

PPO achieves the same stability guarantee as TRPO with first-order gradients — simple, fast, and the default RL algorithm for the past 7 years.`},
    {h:'The Clipped Objective',body:`PPO\'s key innovation: clip the probability ratio between the new and old policy.

r_t(θ) = π_θ(a|s) / π_θ_old(a|s)  (how much more/less likely is this action under the new policy?)

L^CLIP = E[min(r_t · A_t, clip(r_t, 1-ε, 1+ε) · A_t)]

If r_t > 1+ε: the action became too much more likely — clip it. Stop the update here.
If r_t < 1-ε: the action became too much less likely — clip it.

A_t = advantage (did this action lead to better-than-average reward?). Update only happens within the "trust region" defined by ε (typically 0.2).`,callout:`PPO is default because it\'s simple (no second-order derivatives, no complex constraint), stable (clipping prevents large updates), and general (same algorithm works for games, robotics, RLHF, and chip design).`},
    {h:'PPO in RLHF: Training ChatGPT',body:`The RLHF pipeline:
<ol>
<li>Pre-train GPT on internet text</li>
<li>Collect human preferences: show 2 model responses, human picks the better one</li>
<li>Train a reward model to predict human preferences from response pairs</li>
<li>Use PPO to fine-tune the LLM to maximize the reward model\'s score</li>
</ol>

In this context: the LLM is the "policy" (maps prompt → response). The reward model score is the "reward." PPO updates the LLM to produce responses that the reward model scores highly — i.e., responses humans prefer. A KL divergence penalty keeps the LLM from drifting too far from the original pre-trained model (prevents reward hacking).`,callout_green:`PPO → RLHF → InstructGPT → ChatGPT. The same RL algorithm that OpenAI used to train Dota 2 bots (OpenAI Five) is what makes ChatGPT follow instructions and refuse harmful requests.`}
  ],
  questions:[
    {q:'What specific problem does PPO\'s clipping solve in RL training?',
     opts:['Clipping prevents the reward from being too large','Clipping prevents the policy update from being too large — large updates can destroy the policy if the gradient happens to be in the wrong direction for that batch','Clipping is used to remove outlier experiences from the replay buffer','Clipping reduces GPU memory usage during training'],
     correct:1,
     explain:['Reward clipping (capping reward magnitude) is a separate technique used in some environments like Atari. PPO\'s clipping is on the policy probability ratio.',null,'If a batch of rollouts happened to get high rewards due to luck (not because the policy improved), the raw gradient can be enormous. Without clipping, the policy update can be so large it destroys the previously learned policy — the model forgets everything useful. PPO clips the probability ratio to [1-ε, 1+ε], ensuring no single update moves the policy too far regardless of the gradient magnitude.','Replay buffers are a separate concept used in Q-Learning, not standard PPO. PPO is on-policy and doesn\'t use a replay buffer.','Clipping is a gradient-level operation that doesn\'t affect memory allocation.']},
    {q:'In RLHF, what is the "reward model" and what data is it trained on?',
     opts:['The reward model is a simulator of the environment that generates synthetic training data','The reward model is trained on human preference data (human choices between pairs of model responses) to predict which responses humans prefer — it becomes a proxy for human judgment during PPO training','The reward model is a pre-trained LLM that scores responses on grammatical correctness','The reward model is the same as the language model but run in reverse'],
     correct:1,
     explain:['A simulator generates new states from actions. The reward model doesn\'t generate new text — it scores text that the policy (LLM) generates.',null,'Collecting human preferences at scale for every PPO gradient step is impossible — a human cannot label millions of rollouts per second. The reward model is trained offline on thousands of preference examples (response A is better than response B, as judged by humans). It then acts as a learned proxy: for every response the LLM generates during PPO, the reward model scores it in milliseconds — approximating what humans would prefer. This is the key scalability trick.','Grammar correction was not the training objective. The reward model is trained on holistic human preferences — helpfulness, harmlessness, and honesty — not any single linguistic property.','The reward model is a separate neural network from the language model. It takes a prompt+response pair as input and outputs a scalar score.']},
  ]
},

{
  id:'mamba', title:'Mamba / State Space Models', shortTitle:'Mamba/SSM', year:2023,
  authors:'Gu, Dao · Carnegie Mellon + Stanford → Together AI',
  venue:'arXiv 2023', category:'Efficiency', prereqs:['flashattn'],
  icon:'🐍', tagline:'The first serious alternative to the Transformer',
  lesson:[
    {h:'The Transformer\'s Fundamental Scaling Problem',body:`Transformers have quadratic attention complexity: O(N²) in sequence length N. Even with FlashAttention making this tractable, the memory and compute still scale quadratically. A 1M token context window with standard attention requires computing a 1M×1M matrix — eventually hitting physical limits.

State Space Models (SSMs) offer O(N) linear scaling. Each token is processed through a structured recurrence — like an RNN but with mathematical properties that allow parallel training.`},
    {h:'How SSMs Work: Continuous-Time State Space',body:`SSMs come from control theory — a mathematical framework for modeling dynamical systems. A continuous-time SSM:

h\'(t) = Ah(t) + Bx(t) (hidden state evolves based on itself and input)
y(t) = Ch(t) + Dx(t) (output from hidden state)

Discretized for sequences, this becomes a linear recurrence that can be computed as a convolution (parallel during training) or recurrently (fast inference, O(1) per token).

Mamba adds "selective" SSMs: the matrices A, B, C are input-dependent (unlike standard SSMs where they\'re fixed). This lets the model selectively remember or forget information based on content.`,callout:`Mamba achieves: O(N) memory and compute, constant-time per-token inference (no key-value cache growing with context), and matches or exceeds transformer quality on language modeling benchmarks up to 3B parameters.`},
    {h:'Where Mamba Stands in 2026',body:`Mamba is not yet a transformer replacement at frontier scale. Empirically:
<ul>
<li>Matches transformers on language modeling at 1-3B parameters</li>
<li>Unclear if it maintains this at 70B+ parameter scale</li>
<li>Struggles with in-context learning / few-shot tasks relative to transformers</li>
<li>Better for very long sequences (genomics, audio, time series) where O(N²) is prohibitive</li>
</ul>
Hybrid models (Jamba: transformer + Mamba layers) emerged as a practical approach — using transformers for their expressiveness and Mamba for long-context efficiency.`,callout_green:`Mamba is the strongest signal that the transformer monopoly may end. The architecture question is open. Albert Gu and Tri Dao (FlashAttention) both at Together AI — the two people most likely to crack transformer-alternative architectures are at one company.`}
  ],
  questions:[
    {q:'What is the computational advantage of SSMs/Mamba over Transformers, and in what setting is this advantage most relevant?',
     opts:['SSMs are always faster than transformers for all tasks','SSMs scale linearly O(N) with sequence length vs. O(N²) for attention — making them dramatically more efficient for very long sequences (100K+ tokens) in genomics, audio, and video','SSMs require less training data than transformers','SSMs are better because they use convolutions which GPUs are optimized for'],
     correct:1,
     explain:['For short sequences (< 2K tokens), transformers with FlashAttention are faster. The SSM advantage only manifests at long sequence lengths.',null,'At 1M tokens, transformer attention requires 1M² = 10¹² operations per layer per head. An SSM processes each token in O(1) — 10¹² vs 10⁶ operations. For protein sequences (20K amino acids), long legal documents, audio at 44KHz, and genomic sequences, this difference is the boundary between feasible and infeasible.','Training data requirements are similar. Architecture doesn\'t change the data efficiency (though selective SSMs may require more data to match transformer quality).','Convolutions are indeed GPU-friendly, and SSMs can be trained as convolutions. But the key advantage over transformers is algorithmic complexity scaling, not convolution efficiency.']},
    {q:'What makes "selective" SSMs (Mamba) more powerful than earlier fixed-parameter SSMs?',
     opts:['Selective SSMs process tokens in random order for better generalization','The state transition matrices are input-dependent — the model can selectively remember or forget information based on content, not just position. Fixed SSMs treat all inputs identically.','Selective SSMs use a larger hidden state dimension','Selective means the model only processes tokens it selects as important'],
     correct:1,
     explain:['Token order matters in SSMs — changing the order changes the computation. Processing is sequential in the recurrent form.',null,'In a fixed SSM, the same transition matrix A is applied regardless of input content — it\'s a fixed dynamical system with no content-awareness. In Mamba, A, B, C are functions of the current input x_t. This means the model can decide "this is a key piece of information, update my hidden state strongly" vs. "this is punctuation, barely update my state." This content-aware selectivity is analogous to attention\'s ability to focus on relevant tokens.','Hidden state dimension is a hyperparameter separate from the selectivity property.','All tokens are processed — "selective" refers to selective state updates, not token filtering.']},
  ]
},

];

const TRACKS = [
  {label:'Foundations', ids:['resnet','pytorch','qlearning']},
  {label:'Generative Models', ids:['vae','gan','diffusion','clip']},
  {label:'Data Systems', ids:['spark','kafka','ray']},
  {label:'Retrieval & Memory', ids:['faiss','rag']},
  {label:'Efficiency & Scale', ids:['lora','flashattn','mamba']},
  {label:'RL & Alignment', ids:['ppo']},
];

let state = {
  completed: JSON.parse(localStorage.getItem('pa2_completed') || '{}'),
  currentPaper: null, currentTab: 'learn', quizState: null
};
function saveState(){ localStorage.setItem('pa2_completed', JSON.stringify(state.completed)); }
function resetProgress(){ if(!confirm('Reset all progress?')) return; state.completed={}; state.currentPaper=null; saveState(); renderTree(); showHome(); updateProgressBar(); }
function isPaperUnlocked(p){ return p.prereqs.every(pid => state.completed[pid]); }

function renderTree(){
  const tree=document.getElementById('tree'); tree.innerHTML='';
  const pm={}; PAPERS.forEach(p=>pm[p.id]=p);
  TRACKS.forEach(track=>{
    const lbl=document.createElement('div'); lbl.className='track-label'; lbl.textContent=track.label; tree.appendChild(lbl);
    track.ids.forEach(pid=>{
      const paper=pm[pid]; if(!paper) return;
      const unlocked=isPaperUnlocked(paper), completed=!!state.completed[pid], active=state.currentPaper?.id===pid;
      const node=document.createElement('div');
      node.className='paper-node'+(completed?' completed':'')+(active?' active':'')+(!unlocked?' locked':'');
      node.innerHTML=`<div class="node-icon">${completed?'✓':paper.icon}</div><div class="node-text"><div class="node-title">${paper.shortTitle}</div><div class="node-year">${paper.year} · ${paper.category}</div></div>`;
      if(unlocked) node.onclick=()=>openPaper(paper);
      tree.appendChild(node);
    });
  });
}
function updateProgressBar(){
  const total=PAPERS.length, done=Object.keys(state.completed).length;
  document.getElementById('progress-label').textContent=`${done} of ${total} papers completed`;
  document.getElementById('progress-fill').style.width=`${(done/total)*100}%`;
}
function openPaper(paper){
  state.currentPaper=paper; state.currentTab='learn'; state.quizState=null;
  document.getElementById('paper-tag').textContent=paper.category;
  document.getElementById('paper-title-main').textContent=paper.title;
  document.getElementById('paper-meta').textContent=`${paper.authors} · ${paper.venue}`;
  renderTree(); showTab('learn');
}
function showHome(){
  state.currentPaper=null;
  document.getElementById('paper-tag').textContent='Select a paper';
  document.getElementById('paper-title-main').textContent='Welcome to Paper Academy II';
  document.getElementById('paper-meta').textContent='';
  document.getElementById('tab-learn').classList.add('active');
  document.getElementById('tab-quiz').classList.remove('active');
  const unlocked=PAPERS.filter(p=>isPaperUnlocked(p)&&!state.completed[p.id]);
  const done=Object.keys(state.completed).length;
  document.getElementById('content').innerHTML=`<div class="fade-in" style="max-width:700px">
    <h2 style="font-size:1.4rem;font-weight:800;color:#fff;margin-bottom:8px">Beyond Google: The Rest of AI</h2>
    <p style="color:#888;font-size:0.85rem;line-height:1.7;margin-bottom:8px">The parallel universe of research that built Databricks, Midjourney, ChatGPT, Pinecone, and the open-source ML ecosystem — none of it from Google.</p>
    <p style="color:#555;font-size:0.75rem;margin-bottom:20px">Progress: ${done}/${PAPERS.length} completed</p>
    ${unlocked.length>0?`<div style="font-size:0.72rem;color:#FF6D00;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Ready to learn</div><div class="start-grid">${unlocked.map(p=>`<div class="start-card" onclick="openPaper(PAPERS.find(x=>x.id==='${p.id}'))"><div class="sc-year">${p.year} · ${p.category}</div><div class="sc-title">${p.icon} ${p.shortTitle}</div><div class="sc-desc">${p.tagline}</div></div>`).join('')}</div>`
    :`<div class="start-grid">
      <div class="start-card" onclick="openPaper(PAPERS.find(p=>p.id==='resnet'))"><div class="sc-year">2015 · Foundations</div><div class="sc-title">🏗️ ResNet</div><div class="sc-desc">How to train a 1,000-layer network</div></div>
      <div class="start-card" onclick="openPaper(PAPERS.find(p=>p.id==='pytorch'))"><div class="sc-year">2016 · Foundations</div><div class="sc-title">🔥 PyTorch</div><div class="sc-desc">The framework that beat TensorFlow</div></div>
      <div class="start-card" onclick="openPaper(PAPERS.find(p=>p.id==='spark'))"><div class="sc-year">2012 · Data Systems</div><div class="sc-title">⚡ Spark</div><div class="sc-desc">In-memory computing → Databricks</div></div>
      <div class="start-card" onclick="openPaper(PAPERS.find(p=>p.id==='kafka'))"><div class="sc-year">2011 · Data Systems</div><div class="sc-title">📨 Kafka</div><div class="sc-desc">Real-time streaming at LinkedIn</div></div>
      <div class="start-card" onclick="openPaper(PAPERS.find(p=>p.id==='qlearning'))"><div class="sc-year">1992 · Foundations</div><div class="sc-title">🎮 RL Foundations</div><div class="sc-desc">Teaching agents to maximize reward</div></div>
      <div class="start-card" onclick="openPaper(PAPERS.find(p=>p.id==='faiss'))"><div class="sc-year">2017 · Retrieval</div><div class="sc-title">🔎 FAISS</div><div class="sc-desc">Billion-scale vector search</div></div>
    </div>`}
  </div>`;
}
function showTab(tab){
  state.currentTab=tab;
  document.getElementById('tab-learn').classList.toggle('active',tab==='learn');
  document.getElementById('tab-quiz').classList.toggle('active',tab==='quiz');
  if(!state.currentPaper){showHome();return;}
  if(tab==='learn') renderLesson(); else renderQuiz();
}
function renderLesson(){
  const p=state.currentPaper;
  let html=`<div class="fade-in" style="max-width:700px">
    <div class="origin-badge">Origin: ${p.authors.split('·').pop().trim()}</div>`;
  p.lesson.forEach(sec=>{
    html+=`<div class="lesson-section"><h3>${sec.h}</h3><p>${sec.body}</p>`;
    if(sec.callout) html+=`<div class="callout">${sec.callout}</div>`;
    if(sec.callout_green) html+=`<div class="callout green">${sec.callout_green}</div>`;
    if(sec.callout_amber) html+=`<div class="callout amber">${sec.callout_amber}</div>`;
    html+=`</div>`;
  });
  const done=!!state.completed[p.id];
  html+=`<div style="margin-top:24px;padding:16px;background:#16213E;border-radius:10px;border:1px solid #2a2a4a;display:flex;align-items:center;justify-content:space-between;">
    <span style="font-size:0.82rem;color:#888;">${done?'✓ Completed — quiz passed':'Ready to test your understanding?'}</span>
    <button onclick="showTab('quiz')" style="padding:9px 20px;background:${done?'#FFAB0022':'#FF6D00'};color:${done?'#FFAB00':'#fff'};border:${done?'1px solid #FFAB0044':'none'};border-radius:7px;font-size:0.8rem;font-weight:700;cursor:pointer;">
      ${done?'Retake Quiz':'Take Quiz →'}
    </button>
  </div></div>`;
  document.getElementById('content').innerHTML=html;
}
function renderQuiz(){
  const p=state.currentPaper;
  if(!state.quizState) state.quizState={current:0,passed:[],total:p.questions.length};
  const qs=state.quizState;
  if(qs.current>=qs.total){renderCompletion();return;}
  const q=p.questions[qs.current];
  let dots='';
  for(let i=0;i<qs.total;i++) dots+=`<div class="qp-dot ${i<qs.current?'done':i===qs.current?'current':''}"></div>`;
  const letters=['A','B','C','D'];
  let opts=q.opts.map((o,i)=>`<button class="option" id="opt-${i}" onclick="selectOption(${i})"><div class="option-letter">${letters[i]}</div><div class="option-text">${o}</div></button>`).join('');
  document.getElementById('content').innerHTML=`<div id="quiz-wrap" class="fade-in" style="max-width:680px">
    <div class="quiz-progress">${dots}</div>
    <div class="question-card">
      <div class="question-num">Question ${qs.current+1} of ${qs.total}</div>
      <div class="question-text">${q.q}</div>
      <div class="options" id="options-wrap">${opts}</div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">${qs.current+1<qs.total?'Next Question →':'See Results →'}</button>
    </div>
  </div>`;
}
function selectOption(idx){
  const p=state.currentPaper, q=p.questions[state.quizState.current];
  document.querySelectorAll('.option').forEach(o=>{o.classList.add('disabled');o.onclick=null;});
  const fb=document.getElementById('feedback'), nb=document.getElementById('next-btn');
  if(idx===q.correct){
    document.getElementById(`opt-${idx}`).classList.add('selected-right');
    fb.className='feedback right'; fb.innerHTML=`<strong>Correct.</strong> ${q.explain[idx]||'That\'s the key insight.'}`;
    state.quizState.passed.push(true);
  } else {
    document.getElementById(`opt-${idx}`).classList.add('selected-wrong');
    document.getElementById(`opt-${q.correct}`).classList.add('revealed-right');
    fb.className='feedback wrong'; fb.innerHTML=`<strong>Not quite.</strong> ${q.explain[idx]}`;
    state.quizState.passed.push(false);
  }
  nb.style.display='block';
  nb.textContent=state.quizState.current+1<state.quizState.total?'Next Question →':'See Results →';
}
function nextQuestion(){ state.quizState.current++; renderQuiz(); }
function renderCompletion(){
  const p=state.currentPaper, qs=state.quizState;
  const correct=qs.passed.filter(Boolean).length, total=qs.total, passed=correct===total;
  if(passed&&!state.completed[p.id]){ state.completed[p.id]=true; saveState(); renderTree(); updateProgressBar(); }
  const newlyUnlocked=PAPERS.filter(np=>np.prereqs.includes(p.id)&&np.prereqs.every(pid=>state.completed[pid])&&!state.completed[np.id]);
  const sc=passed?'#FFAB00':correct>=total*0.6?'#FF6D00':'#FF5252';
  let html=`<div class="fade-in" style="max-width:600px">
    <div style="background:#16213E;border:1px solid ${sc}44;border-radius:12px;padding:32px;text-align:center;margin-bottom:24px;">
      <div style="font-size:3rem;font-weight:900;color:${sc}">${correct}/${total}</div>
      <div style="font-size:1.1rem;font-weight:700;color:#fff;margin:8px 0">${passed?'Paper completed!':correct>=2?'Good effort — review and retry':'Keep studying and retry'}</div>
      <div style="font-size:0.82rem;color:#888;margin-bottom:20px">${passed?p.title+' marked complete.':'Get all questions correct to unlock next papers.'}</div>`;
  if(passed&&newlyUnlocked.length>0){
    html+=`<div style="margin-bottom:16px"><div style="font-size:0.72rem;color:#FFAB00;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Unlocked</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
    ${newlyUnlocked.map(np=>`<span style="background:#FFAB0011;border:1px solid #FFAB0044;color:#FFAB00;padding:5px 14px;border-radius:20px;font-size:0.8rem;cursor:pointer" onclick="openPaper(PAPERS.find(p=>p.id==='${np.id}'))">${np.icon} ${np.shortTitle}</span>`).join('')}</div></div>`;
  }
  html+=`<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button onclick="state.quizState=null;renderQuiz()" style="padding:9px 18px;background:#16213E;color:#ccc;border:1px solid #2a2a4a;border-radius:7px;font-size:0.8rem;cursor:pointer">Retry Quiz</button>
    <button onclick="showTab('learn')" style="padding:9px 18px;background:#FF6D00;color:#fff;border:none;border-radius:7px;font-size:0.8rem;font-weight:700;cursor:pointer">Back to Lesson</button>
    ${passed&&newlyUnlocked.length>0?`<button onclick="openPaper(PAPERS.find(p=>p.id==='${newlyUnlocked[0].id}'))" style="padding:9px 18px;background:#FFAB00;color:#000;border:none;border-radius:7px;font-size:0.8rem;font-weight:700;cursor:pointer">Next Paper →</button>`:''}
  </div></div>`;
  html+=`<div style="margin-top:20px"><div style="font-size:0.75rem;color:#555;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px">Review</div>`;
  p.questions.forEach((q,i)=>{
    const ok=qs.passed[i];
    html+=`<div style="background:#16213E;border:1px solid ${ok?'#FFAB0022':'#FF525222'};border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px">
      <span style="color:${ok?'#FFAB00':'#FF5252'};font-size:1rem;flex-shrink:0">${ok?'✓':'✗'}</span>
      <span style="font-size:0.8rem;color:#aaa;line-height:1.5">${q.q}</span></div>`;
  });
  html+=`</div></div>`;
  document.getElementById('content').innerHTML=html;
}
window.PAPERS=PAPERS;
renderTree(); updateProgressBar(); showHome();
</script>

<script>
(function(){
  var SU='https://gbkhkbfbarsnpbdkxzii.supabase.co';
  var SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia2hrYmZiYXJzbnBiZGt4emlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQzODAzNzMsImV4cCI6MjA0OTk1NjM3M30.mcOcC2GVEu_wD3xNBzSCC3MwDck3CIdmz4D8adU-bpI';
  var MOD='pa2';
  var LSK='pa2_completed';
  var FMT='object';

  function getIds(){
    var raw=localStorage.getItem(LSK);
    if(!raw) return [];
    try{
      var p=JSON.parse(raw);
      if(Array.isArray(p)) return p;
      return Object.keys(p).filter(function(k){return p[k];});
    }catch(e){return [];}
  }

  function push(){
    var email=localStorage.getItem('academy_email');
    if(!email) return;
    var ids=getIds();
    if(!ids.length) return;
    fetch(SU+'/rest/v1/academy_progress',{
      method:'POST',
      headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({email:email,module:MOD,completed:ids,updated_at:new Date().toISOString()})
    }).catch(function(){});
  }

  var _orig=Storage.prototype.setItem;
  Storage.prototype.setItem=function(k,v){
    _orig.call(this,k,v);
    if(k===LSK) push();
  };

  window.addEventListener('load',function(){
    var email=localStorage.getItem('academy_email');
    if(!email) return;
    fetch(SU+'/rest/v1/academy_progress?email=eq.'+encodeURIComponent(email)+'&module=eq.'+MOD+'&select=completed',{
      headers:{'apikey':SK,'Authorization':'Bearer '+SK}
    }).then(function(r){return r.json();}).then(function(rows){
      if(!rows||!rows[0]||!rows[0].completed||!rows[0].completed.length) return;
      var remote=rows[0].completed;
      var raw=localStorage.getItem(LSK);
      var merged;
      if(FMT==='object'){
        merged=raw?JSON.parse(raw):{};
        remote.forEach(function(id){merged[id]=true;});
        _orig.call(localStorage,LSK,JSON.stringify(merged));
      } else {
        var local=raw?JSON.parse(raw):[];
        var s=new Set(local);
        remote.forEach(function(id){s.add(id);});
        _orig.call(localStorage,LSK,JSON.stringify(Array.from(s)));
      }
      if(typeof renderTree==='function') renderTree();
      if(typeof updateProgressBar==='function') updateProgressBar();
      if(typeof render==='function') render();
    }).catch(function(){});
  });

  var btn=document.createElement('a');
  btn.href='index.html';
  btn.innerHTML='&#8592; Menu';
  btn.style.cssText='position:fixed;top:10px;left:10px;z-index:9999;background:#16213E;color:#7C4DFF;border:1px solid #7C4DFF44;padding:5px 12px;border-radius:7px;font-size:0.75rem;font-weight:700;text-decoration:none;opacity:0.8;transition:opacity 0.2s';
  btn.onmouseover=function(){this.style.opacity='1';};
  btn.onmouseout=function(){this.style.opacity='0.8';};
  document.body.appendChild(btn);
})();
</script>
