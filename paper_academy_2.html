<script>
const PAPERS = [

// ─── FOUNDATIONS TRACK ───────────────────────────────────────────────────────
{
  id:'resnet', title:'Deep Residual Learning (ResNet)', shortTitle:'ResNet', year:2015,
  authors:'He, Zhang, Ren, Sun · Microsoft Research',
  venue:'CVPR 2016 (Best Paper)', category:'Foundations', prereqs:[],
  icon:'🏗️', tagline:'How to train a 1,000-layer network',
  lesson:[
    {h:'The Depth Problem',body:`By 2015, researchers knew deeper networks were more powerful — but training them was a disaster. Stacking more layers made the model WORSE. Counterintuitively, a 56-layer plain network performed worse on training data than a 20-layer one. This is the "degradation problem": deeper networks became harder to optimize, not harder to generalize.

The symptoms: gradients vanished or exploded as they backpropagated through many layers. By the time the gradient signal reached early layers, it was effectively zero. Early layers stopped learning.`},
    {h:'The Fix: Skip Connections',body:`He et al. at Microsoft Research proposed a radical simple fix: let layers learn the <em>residual</em> — the difference from the input — instead of the full mapping.

Instead of learning H(x), learn F(x) = H(x) - x, so H(x) = F(x) + x.

Implemented as a "skip connection": the input x is added directly to the layer's output. If the layer learns nothing (F(x) = 0), the output is just the identity — the input passes through unchanged. It's now impossible for adding a layer to make things worse.`,callout:`This is why it's called "residual": each block learns the residual correction on top of the identity shortcut. If the optimal function is close to identity (a common case in deep networks), F(x) ≈ 0 is easy to learn.`},
    {h:'What It Enabled',body:`ResNet-152 (152 layers) won the 2015 ImageNet competition with 3.57% top-5 error — surpassing human-level performance (5.1%) for the first time.

More importantly, skip connections became a universal component:
<ul>
<li>Every transformer uses residual connections (the "Add & Norm" step)</li>
<li>UNet (medical imaging, Stable Diffusion) uses skip connections between encoder and decoder</li>
<li>DenseNet, EfficientNet, ViT — all use residuals</li>
</ul>
You cannot understand any modern neural network architecture without understanding ResNet.`,callout_green:`Skip connections appear in every transformer block in BERT, GPT, Claude, Gemini. ResNet didn't just win a competition — it provided a fundamental component used by every architecture that followed.`}
  ],
  questions:[
    {q:'What is the "degradation problem" that ResNet solved?',
     opts:['Models with more parameters are harder to deploy','Deeper networks performed WORSE on training data than shallower ones — more layers made optimization harder, not better','Deeper networks overfit training data too quickly','ResNets degraded in accuracy over multiple retraining cycles'],
     correct:1,
     explain:['Deployment difficulty is an engineering problem, not the degradation problem. ResNet was a training-time breakthrough.',null,'If deeper networks overfitted, they would perform BETTER on training data but worse on test data. The degradation problem was the opposite: 56-layer networks performed worse on training data itself, proving it was an optimization problem, not a generalization problem.','ResNet does not refer to repeated retraining. Degradation here means deeper plain networks achieve higher training error than shallower ones.']},
    {q:'Why does a skip connection (residual connection) solve the vanishing gradient problem?',
     opts:['Skip connections bypass certain layers entirely, reducing the effective depth','Gradients can flow directly through the skip connection (addition operation has gradient=1), providing a "highway" through which gradient can reach early layers','Skip connections double the number of parameters, making gradients stronger','They reduce the learning rate automatically for deeper layers'],
     correct:1,
     explain:['Skip connections don\'t bypass layers — all layers still run. The skip adds the input to the layer\'s output; both the layer AND the shortcut contribute to the final representation.',null,'The derivative of addition is 1. So when backpropagating through an addition node, the gradient passes through unchanged. Even if the convolutional layers in a block have near-zero gradients, the gradient signal can travel through the shortcut path with magnitude 1, ensuring early layers receive a usable gradient.','Skip connections don\'t add parameters — they\'re just element-wise addition with no learned weights (when dimensions match).','Skip connections have no effect on learning rate. They solve the gradient flow problem structurally.']},
    {q:'Skip connections appear in transformer blocks. In that context, what do they connect?',
     opts:['They connect the encoder to the decoder directly','They add the input of a sublayer (attention or feedforward) to its output before layer normalization','They connect the first layer to the last layer, skipping everything in between','They connect different transformer models together in an ensemble'],
     correct:1,
     explain:['Encoder-decoder connections exist in the full transformer, but they\'re cross-attention, not skip connections. Skip connections in transformers are within each sublayer.',null,'In each transformer block: output = LayerNorm(x + Sublayer(x)). The x + is the skip connection. This means every block has a residual path — if attention learns nothing useful, the identity still flows through. This is what makes transformers stable to train with many layers (e.g., 96 layers in GPT-3).','Each block has its own skip connection within that block. There is no single connection from layer 1 to the last layer.','Ensembles are multiple separate models. Skip connections are within a single model.']},
  ]
},

{
  id:'pytorch', title:'PyTorch', shortTitle:'PyTorch', year:2016,
  authors:'Paszke, Gross, Massa et al. · Meta FAIR',
  venue:'NeurIPS 2019 (paper); released 2016', category:'Foundations', prereqs:[],
  icon:'🔥', tagline:'The framework that beat TensorFlow',
  lesson:[
    {h:'The Framework Wars',body:`By 2015, Google\'s TensorFlow was the dominant deep learning framework. But researchers hated it. TensorFlow used a "define-and-run" approach: you first declare a static computation graph, then feed data through it. Debugging was painful — you couldn\'t inspect values mid-computation with standard Python tools. Error messages were cryptic. Iteration was slow.

Meta AI Research built PyTorch on a different philosophy: "define-by-run" (dynamic computation graphs).`},
    {h:'Dynamic Graphs: Why It Won',body:`PyTorch builds the computation graph on-the-fly as you run code. This means:
<ul>
<li>You can use standard Python control flow (if/else, for loops) in your model</li>
<li>You can inspect any tensor at any point with a print statement</li>
<li>Errors look like normal Python errors, not cryptic graph errors</li>
<li>Changing model architecture is as simple as changing Python code</li>
</ul>
For researchers who change model architecture dozens of times per day, this was transformative.`,callout:`The research community switched to PyTorch rapidly. By 2019, the majority of NeurIPS and ICML papers used PyTorch. By 2022, virtually every AI startup's training code was PyTorch. Google responded with JAX, which adopts a functional approach to dynamic computation.`},
    {h:'The Ecosystem It Built',body:`PyTorch enabled Hugging Face — a startup that built a library of pre-trained transformer models on top of PyTorch. Hugging Face's <code>transformers</code> library became the npm of AI: every model, every architecture, freely available. Hugging Face is now valued at $4.5B.

PyTorch also enabled PyTorch Lightning, fast.ai, and eventually became the foundation of torchaudio, torchvision, and torchtext — domain-specific extension libraries that made audio, vision, and NLP research accessible.`,callout_green:`Today: almost every LLM (LLaMA, Mistral, Falcon), every diffusion model, and every robotics model is trained and served in PyTorch. TensorFlow is largely relegated to production serving at Google.`}
  ],
  questions:[
    {q:'What is the key architectural difference between PyTorch\'s "define-by-run" and TensorFlow 1.x\'s "define-and-run"?',
     opts:['PyTorch uses GPUs; TensorFlow runs on CPUs only','PyTorch builds the computation graph dynamically as code executes, enabling standard Python debugging; TensorFlow required declaring a static graph before running it','PyTorch is written in Python; TensorFlow is written in C++','PyTorch can only train small models; TensorFlow scales to large ones'],
     correct:1,
     explain:['Both frameworks support GPUs. GPU support was present in TensorFlow 1.x from the start.',null,'With a static graph, you declare all operations first, compile the graph, then run data through it. Bugs in the graph don\'t appear until execution, and you can\'t inspect intermediate values easily. Dynamic graphs mean the graph is constructed as Python runs — if you add a print() inside a loop, you see actual tensor values, just like regular Python debugging.','Both are primarily Python APIs with C++/CUDA backends for performance. The language of the API wasn\'t the differentiation.','PyTorch trains the largest models in existence (GPT-4-scale). Scale is not the distinction.']},
    {q:'Why did the research community adopt PyTorch over TensorFlow despite TensorFlow having a 2-year head start?',
     opts:['PyTorch was cheaper to license','Researcher iteration speed — debugging and modifying experimental models was dramatically faster with dynamic graphs, which mattered more than production efficiency','PyTorch produced more accurate models','Meta forced researchers to use it'],
     correct:1,
     explain:['Both are open-source and free.',null,'In research, the bottleneck is the researcher\'s iteration cycle — hypothesis → implementation → debug → result → next hypothesis. TensorFlow\'s static graphs made debugging slow and model modification painful. PyTorch reduced iteration time from hours to minutes for many experiment types. Researchers optimize for their own productivity, not for production deployment efficiency.','Same model, same architecture, same accuracy. PyTorch doesn\'t change what\'s mathematically possible.','Meta contributed PyTorch but couldn\'t force adoption. The research community chose it because it was better for research workflows.']},
  ]
},

{
  id:'qlearning', title:'Q-Learning & Policy Gradient Methods', shortTitle:'RL Foundations', year:1992,
  authors:'Watkins (Q-Learning) · Williams (REINFORCE) · Various',
  venue:'Machine Learning 1992 / 1992', category:'Foundations', prereqs:[],
  icon:'🎮', tagline:'Teaching agents to maximize reward through experience',
  lesson:[
    {h:'What Reinforcement Learning Is',body:`Reinforcement Learning (RL) is the third paradigm of machine learning — alongside supervised learning (labeled examples) and unsupervised learning (structure in unlabeled data). In RL:
<ul>
<li>An <strong>agent</strong> takes actions in an <strong>environment</strong></li>
<li>The environment returns a <strong>reward</strong> (positive or negative) and a new <strong>state</strong></li>
<li>The agent's goal: learn a <strong>policy</strong> (mapping from state to action) that maximizes cumulative reward</li>
</ul>
No labeled "correct action" is given. The agent must discover good actions through trial and error.`},
    {h:'Q-Learning: Learning Action Values',body:`Q-Learning (Watkins, 1992) learns a Q-function: Q(state, action) = expected cumulative reward of taking this action in this state and acting optimally afterward.

The Bellman equation makes this tractable:
<br><br>Q(s,a) ← Q(s,a) + α[r + γ·max Q(s',a') - Q(s,a)]<br><br>
Update Q toward the observed reward plus the discounted best Q of the next state. Over many episodes, Q converges to the optimal policy.`,callout:`Key property: Q-Learning is "off-policy" — you can learn from experiences of ANY policy, including a random one. This is why replay buffers work: store old experiences, learn from them later.`},
    {h:'Policy Gradient: Directly Optimize the Policy',body:`Q-Learning learns values, then derives actions. Policy Gradient methods (Williams 1992, REINFORCE) directly parameterize a policy π(a|s) as a neural network and use gradient ascent to maximize expected reward.

The gradient: ∇J(θ) = E[∇log π(action|state) · reward]

Intuition: actions that led to high reward → increase their probability. Actions that led to low reward → decrease their probability. This is the algorithm used in ChatGPT's RLHF training (specifically PPO, a variant).`,callout_green:`Q-Learning → DQN (DeepMind, 2013, Atari) → PPO (OpenAI, 2017) → RLHF (OpenAI, 2022) → ChatGPT. The entire "alignment" stack for LLMs runs on RL foundations from the early 1990s.`}
  ],
  questions:[
    {q:'What makes Reinforcement Learning fundamentally different from supervised learning?',
     opts:['RL requires more data than supervised learning','RL agents receive no labeled "correct action" — they must discover good actions through trial and error, guided only by reward signals from the environment','RL can only be applied to games, not real-world problems','RL does not use neural networks'],
     correct:1,
     explain:['Data requirements vary by problem — RL can be extremely sample-efficient or very sample-hungry depending on the algorithm and environment.', null,'In supervised learning, every training example has a label telling the model the correct output. In RL, the agent only knows whether its sequence of actions led to a high or low reward — often only at the end of an episode. No one tells it which specific action was the mistake. This credit assignment problem is the central challenge of RL.','RL is used in robotics, drug discovery, chip design (Google used RL to optimize chip floorplanning), recommendation systems, and LLM alignment. Games were early testbeds but not the only application.','DQN (2013) and policy gradient methods explicitly use deep neural networks. RL + deep learning = Deep RL.']},
    {q:'The Bellman equation underpins Q-Learning. What is its core insight?',
     opts:['The optimal Q-value of a state-action pair can be recursively defined: it equals the immediate reward plus the discounted optimal Q-value of the best next state-action','The Bellman equation computes the gradient of the reward function directly','Bellman equations require knowing the transition dynamics of the environment','The Q-value equals the average reward over all possible next actions'],
     correct:0,
     explain:[null,'This is the key insight — it makes the problem tractable. Instead of estimating the total future reward by simulating the entire future (impossible), you can bootstrap: the Q-value of this step is the immediate reward + how good the best next step is (which you already have an estimate of). Apply this update repeatedly and Q converges to the optimal policy.','Policy gradient methods compute gradients of the reward function. Q-Learning does not use direct gradient computation on rewards.','Q-Learning can work model-free — you don\'t need to know transition dynamics. You learn Q from experience, not from a known model of the world.','Q-Learning takes the MAX over next actions, not the average. This "greedy" bootstrap toward the best possible next action is what makes it off-policy and convergent to the optimal Q.']},
    {q:'PPO (Proximal Policy Optimization) is used in RLHF to train ChatGPT. What problem does PPO solve compared to basic policy gradient?',
     opts:['PPO is faster because it uses fewer samples','Basic policy gradient updates can be too large, destabilizing training — PPO clips the update size to stay "proximal" (close) to the previous policy','PPO eliminates the need for a reward model','PPO allows training without any human feedback'],
     correct:1,
     explain:['PPO often requires MORE samples than simpler methods — it\'s valued for stability, not sample efficiency.',null,'In basic policy gradient (REINFORCE), if a batch of episodes happened to produce very high rewards, the policy update can be enormous — overshooting and destroying the policy. PPO clips the probability ratio between new and old policy to a range (e.g., [0.8, 1.2]). If the update would move the policy too far, it\'s clipped. This makes training stable even with noisy reward signals — critical for RLHF where reward model scores are noisy.','PPO still requires a reward signal (from a reward model in RLHF or from the environment in games). It doesn\'t replace the reward model.','RLHF requires human feedback to train the reward model. PPO is the optimization algorithm applied after the reward model is built.']},
  ]
},

// ─── GENERATIVE MODELS TRACK ─────────────────────────────────────────────────
{
  id:'vae', title:'Variational Autoencoder (VAE)', shortTitle:'VAE', year:2013,
  authors:'Kingma & Welling · University of Amsterdam',
  venue:'ICLR 2014', category:'Generative Models', prereqs:['resnet'],
  icon:'🎲', tagline:'Learning a compressed, navigable space of data',
  lesson:[
    {h:'The Autoencoder Idea',body:`An autoencoder compresses data into a low-dimensional "latent" vector (encoder), then reconstructs it back (decoder). Train on many images of faces, and the latent space captures face features. Problem: the standard autoencoder's latent space has holes and discontinuities — interpolating between two points in latent space produces garbage.

VAE fixes this by making the latent space a smooth probability distribution.`},
    {h:'The Key Innovation: Latent as Distribution',body:`Instead of encoding an input to a single point z, the VAE encoder outputs a mean μ and variance σ² — defining a Gaussian distribution. The decoder samples from this distribution.

Training objective (ELBO — Evidence Lower Bound):
<ul>
<li><strong>Reconstruction loss:</strong> The decoded sample should look like the original input</li>
<li><strong>KL divergence:</strong> The distribution q(z|x) should stay close to a standard normal N(0,1)</li>
</ul>`,callout:`The KL term forces all latent representations to cluster around the origin. This is what creates a smooth, navigable latent space — every point in the space (not just training examples) decodes to something meaningful.`},
    {h:'Why the Latent Space Matters',body:`A smooth latent space enables:
<ul>
<li><strong>Interpolation:</strong> Mix two face images by averaging their latent vectors. The result is a smooth blend.</li>
<li><strong>Generation:</strong> Sample a random point from N(0,1) and decode it — a new face that never existed.</li>
<li><strong>Editing:</strong> If one dimension controls "smiling," add a vector in that direction to make any face smile.</li>
</ul>
This concept of a learned latent space underlies Stable Diffusion (which operates in latent space to be faster), DALL-E's image generation, and the "latent" in Latent Labs (protein design startup).`,callout_green:`VAE latent space concept → Stable Diffusion's latent diffusion architecture → every image/video generation model. The company Stability AI's core insight was to run diffusion in VAE latent space, making image generation 8× faster.`}
  ],
  questions:[
    {q:'What problem with standard autoencoders does the VAE solve?',
     opts:['Autoencoders are too slow to train','Standard autoencoder latent spaces have holes — points between training examples don\'t decode to meaningful outputs. VAE forces a smooth, continuous distribution.','Autoencoders cannot work on images, only text','VAE uses less memory than a standard autoencoder'],
     correct:1,
     explain:['Training speed is not the problem VAE addresses. Standard autoencoders and VAEs have comparable training speeds.',null,'The standard autoencoder can place different classes in completely disconnected regions of latent space with arbitrary structure. If you sample between two known points, you land in an unstructured region that decodes to noise. VAE\'s KL divergence regularization forces all encodings to cluster near the origin in a Gaussian — guaranteeing that any sampled point decodes to something coherent.','Autoencoders work on any data modality — images, text, tabular data, protein sequences. Modality is not the distinction.','VAE actually adds parameters (the variance head on the encoder) compared to a standard autoencoder. It uses slightly more memory, not less.']},
    {q:'What is the "reparameterization trick" and why is it necessary for training VAEs?',
     opts:['It renames variable names to make code cleaner','Sampling is not differentiable — the trick moves the randomness outside the computation graph (z = μ + σ·ε, ε~N(0,1)), allowing gradients to flow through μ and σ','It prevents the KL divergence from becoming too large during training','It converts discrete samples to continuous ones'],
     correct:1,
     explain:['This is a software engineering term, not a machine learning one.',null,'If z is sampled from q(z|x) directly, the sampling operation has no gradient — backpropagation cannot flow through a stochastic node. The trick: instead of sampling z ~ N(μ, σ²), sample ε ~ N(0,1) and compute z = μ + σ·ε. Now z is a deterministic function of μ and σ (with ε as external noise), so gradients can flow through to train the encoder.','Gradient clipping handles exploding gradients. The reparameterization trick is about differentiability, not gradient magnitude.','VAEs operate on continuous latent spaces. Handling discrete samples requires different techniques (Gumbel-Softmax, etc.).']},
    {q:'Stable Diffusion uses a VAE as part of its architecture. What specific role does it play?',
     opts:['The VAE generates the final image directly, and diffusion only refines text prompts','The VAE compresses images into a smaller latent space; diffusion runs in this latent space (not pixel space), making generation 8× faster','The VAE handles text encoding while diffusion handles image generation','VAE is used only during training, not at inference time'],
     correct:1,
     explain:['In Stable Diffusion, diffusion does the heavy lifting of generation. The VAE compresses and decompresses images but does not generate them independently.',null,'Running diffusion in pixel space (512×512×3 ≈ 786K dimensions) requires hundreds of denoising steps — too slow. The VAE encodes images into a 64×64×4 latent (16K dimensions — 48× smaller). Diffusion runs in this compressed space: same number of denoising steps but on a much smaller tensor. The VAE decoder then converts the denoised latent back to pixels. This is the "latent" in "Latent Diffusion Models."','Text encoding is handled by a CLIP text encoder (a transformer), not the VAE. The VAE is specifically for image compression.','The VAE decoder runs at inference time to convert the diffusion output latent back into a pixel image. Without it, you get a latent vector, not an image.']},
  ]
},

{
  id:'gan', title:'Generative Adversarial Networks (GANs)', shortTitle:'GANs', year:2014,
  authors:'Goodfellow, Pouget-Abadie, Mirza, Xu, Warde-Farley, Ozair, Courville, Bengio · Université de Montréal',
  venue:'NeurIPS 2014', category:'Generative Models', prereqs:['vae'],
  icon:'🎭', tagline:'Two networks competing to generate reality',
  lesson:[
    {h:'The Adversarial Idea',body:`Ian Goodfellow invented GANs over a single night in 2014, reportedly after arguing about generative models at a bar. The idea is a two-player game:

<ul>
<li><strong>Generator (G):</strong> Takes random noise, produces fake data (images, audio, text). Goal: fool the discriminator.</li>
<li><strong>Discriminator (D):</strong> Takes real or generated data, outputs probability it's real. Goal: correctly distinguish real from fake.</li>
</ul>

Train both simultaneously: G gets better at fooling D; D gets better at detecting fakes; repeat. At convergence, G produces data indistinguishable from real.`},
    {h:'The Training Objective',body:`Minimax game — the value function V(G, D):

min_G max_D V(D,G) = E[log D(x)] + E[log(1 - D(G(z)))]

D tries to maximize: assign high probability to real x, low probability to generated G(z).
G tries to minimize: make D assign high probability to its fake outputs.

In practice: train D for k steps, then train G for 1 step, alternating. The generator never directly sees real data — it only receives gradients from the discriminator.`,callout:`The elegant part: no explicit likelihood estimation. Traditional generative models tried to explicitly model the data distribution p(x) — a hard problem. GANs sidestep this entirely. The discriminator implicitly estimates how close G's distribution is to real data.`},
    {h:'What GANs Produced',body:`GANs went from generating blurry 28×28 digit images (2014) to photorealistic human faces (StyleGAN2, NVIDIA, 2020) with zero artifacts. Deepfakes are GAN outputs.

Applications: face generation (Thispersondoesnotexist.com), image-to-image translation (pix2pix), super-resolution (SRGAN), drug molecule generation, data augmentation for rare diseases.`,callout:`GANs are notoriously hard to train: mode collapse (G only generates a few types of outputs), vanishing gradients when D becomes too good, and instability requiring careful hyperparameter tuning. These training difficulties motivated diffusion models, which are more stable.`},
    {h:'GANs vs. Diffusion: Why GANs Lost',body:`By 2022, diffusion models surpassed GANs for image quality and diversity. Reasons:
<ul>
<li>Diffusion training is more stable — no adversarial game, no mode collapse</li>
<li>Diffusion generates more diverse outputs</li>
<li>Diffusion scales better with compute</li>
</ul>
GANs still win on speed (one forward pass vs. hundreds of diffusion steps) and find use in video generation and real-time applications. StyleGAN3 is still used in film and game production.`,callout_green:`GANs → deepfakes → synthetic data for ML training → face generation APIs → early image generation. Diffusion models replaced GANs for quality/diversity in 2022, but GANs pioneered the generative AI industry.`}
  ],
  questions:[
    {q:'In a GAN, the Generator never directly sees real training data. How does it learn to produce realistic outputs?',
     opts:['The Generator reads the real data but in encrypted form','The Generator receives gradient signals from the Discriminator — backpropagation through D tells G which changes to its outputs made D more likely to be fooled','The Generator copies real data with small random modifications','The Generator and Discriminator share weights, so G learns by observing D'],
     correct:1,
     explain:['GANs don\'t use encryption. The Generator sees only its own output and the gradient signal.',null,'The Discriminator scores G\'s output. If D says "80% real" for a generated image, D\'s training loss is low (it was fooled). G\'s goal is to maximize this confusion. The gradient of D\'s classification loss with respect to G\'s output tells G exactly what to change to become more convincing. G learns the gradient of "how real does D think this is" with respect to its own generated pixels.',  'Copying with modifications is data augmentation, not generation. G starts from random Gaussian noise — it has no access to real images.','Generator and Discriminator are separate networks with separate weights. They have opposing objectives and cannot share weights.']},
    {q:'What is "mode collapse" in GAN training, and why does it happen?',
     opts:['The GAN\'s discriminator collapses to always outputting 0.5','The generator learns to produce only a small subset of the data distribution — e.g., generating only one type of face regardless of noise input — because this fools the discriminator without covering the full distribution','Mode collapse means the model runs out of GPU memory','It occurs when the training data has too few examples'],
     correct:1,
     explain:['When D outputs 0.5 on real and fake equally, it means it cannot distinguish them — this is actually training success (discriminator is fooled), not collapse.',null,'If generating one particular face consistently fools D, G has no incentive to explore other face types. It found one "mode" (one region of the data distribution) that works and collapsed there. The minimax objective doesn\'t directly penalize this. Diffusion models don\'t have this problem because generation is not adversarial — the denoising process naturally covers all modes of the distribution.','Memory issues are hardware problems, not mode collapse. Mode collapse is a training dynamics issue visible even with unlimited memory.','Mode collapse is a training failure mode even with millions of training examples. Dataset size is not the cause.']},
    {q:'Why did diffusion models largely replace GANs for image generation by 2022?',
     opts:['Diffusion models are faster at inference time','GANs produce lower resolution images than diffusion models','Diffusion training is more stable (no adversarial game, no mode collapse), generates more diverse outputs, and scales better with compute — at the cost of slower inference','Diffusion models require less training data than GANs'],
     correct:2,
     explain:['The opposite is true — GANs are FASTER at inference (one forward pass). Diffusion requires 20-1000 iterative denoising steps. Speed is GANs\' remaining advantage.',null,'GANs produced 1024×1024 images (StyleGAN) before diffusion models existed. Resolution is not the distinction.','This captures the key trade-off. Stable Diffusion and DALL-E 2 produce higher diversity (no mode collapse) and better semantic consistency (better at following text prompts). The training stability difference is particularly important at scale — it\'s what allowed diffusion models to be trained on internet-scale datasets without the instability problems that plagued large GANs.','Both require large datasets. Diffusion models were trained on LAION-5B (5 billion image-text pairs) — if anything requiring MORE data than GAN experiments.']},
  ]
},

{
  id:'diffusion', title:'Denoising Diffusion Probabilistic Models', shortTitle:'Diffusion', year:2020,
  authors:'Ho, Jain, Abbeel · UC Berkeley',
  venue:'NeurIPS 2020', category:'Generative Models', prereqs:['vae','gan'],
  icon:'✨', tagline:'Generate images by learning to reverse noise',
  lesson:[
    {h:'The Physics Intuition',body:`Diffusion borrows from non-equilibrium thermodynamics. Imagine dropping ink into water: the ink diffuses from a structured pattern into pure noise. Diffusion models ask: can a neural network learn to reverse this process — to "un-diffuse" noise back into structure?

Forward process: gradually add Gaussian noise to an image over T steps (T=1000 typically) until it's pure noise.
Backward process: train a neural network to predict and remove a small amount of noise at each step.
Generation: start from pure random noise, apply the learned denoising backward process 1000 times.`},
    {h:'The Training Objective',body:`Training is surprisingly simple: at each step t, take a real image, add exactly t steps worth of noise (directly computable in one step using a closed-form formula), and train the network to predict the noise that was added.

L = ||ε - ε_θ(√ᾱ_t x₀ + √(1-ᾱ_t)ε, t)||²

The model ε_θ learns "given a noisy image at step t, what noise was added?" Equivalently: it learns to denoise. No adversarial game. No mode collapse. Stable training.`,callout:`The neural network used is typically a U-Net with attention blocks — combining ResNet skip connections (for detail preservation) with transformer attention (for global coherence). Cross-attention to text embeddings is how text conditioning works.`},
    {h:'Text-to-Image: DDPM + CLIP',body:`DDPM alone generates images unconditionally. To condition on text ("a cat astronaut on the moon"), inject text embeddings via cross-attention at each denoising step. The U-Net's attention layers learn to make each denoising step consistent with the text.

Classifier-free guidance (Ho & Salimans, 2021): train with and without text conditioning. At inference, amplify the difference — push the generation further toward text-consistent outputs. Higher guidance scale = images more faithful to text but less diverse.`},
    {h:'The Industry It Created',body:`DDPM → Stable Diffusion (Rombach et al., CompVis/Stability AI, 2022) — open-sourced. This single release created an entire industry:
<ul>
<li>Midjourney: $200M+/year revenue, no VC funding, 15-person team</li>
<li>Runway: $50M ARR, $1.5B valuation, video generation</li>
<li>ElevenLabs: audio diffusion, $80M Series B at $1.1B</li>
<li>Stability AI: $101M raised, valuation collapsed due to governance issues</li>
</ul>`,callout_green:`DDPM (Berkeley, 2020) → Latent Diffusion (Heidelberg/CompVis, 2022) → Stable Diffusion (open-source) → Midjourney, Runway, Adobe Firefly, DALL-E 3. The entire generative image industry.`}
  ],
  questions:[
    {q:'What is the forward process in a diffusion model and what is its mathematical purpose?',
     opts:['The model generates images from text prompts — this is the forward direction','The forward process adds Gaussian noise to real images over many steps until the image becomes indistinguishable from pure noise — creating training examples of (noisy image, noise amount, original) tuples','The forward process is inference — running the model on new inputs','The forward process trains the discriminator in the adversarial game'],
     correct:1,
     explain:['Generation (text-to-image) is the REVERSE process — denoising from noise back to an image.',null,'The forward process is the data preparation step. Critically, it\'s analytically tractable — you can directly compute what an image looks like after exactly t steps of noise addition using a closed-form formula, without simulating each step. This means you can train the neural network on (image at step t, noise that was added) pairs directly, at any noise level, which makes training efficient and stable.','Inference is the reverse process — the denoising direction. The forward process only runs during training data preparation.','Diffusion models have no discriminator. The training objective is a simple noise prediction regression loss, not an adversarial game.']},
    {q:'Why did running diffusion in latent space (Stable Diffusion) make image generation practical?',
     opts:['Latent space diffusion uses a different type of noise that is easier to remove','Images have ~786K pixel dimensions; a VAE latent has ~16K dimensions — running 1000 denoising steps in latent space is 48× faster than in pixel space, making real-time generation feasible','Latent space allows the model to understand text better','Stable Diffusion uses latent space only for training, not for inference'],
     correct:1,
     explain:['The noise type (Gaussian) is the same in both pixel and latent space. The benefit is computational, not about noise properties.',null,'This is the key engineering insight from Rombach et al. A 512×512 RGB image has 786,432 dimensions. The VAE latent is 64×64×4 = 16,384 dimensions. Each denoising step involves a full U-Net forward pass. 1000 steps × 49× speedup = the difference between "requires a server farm" and "runs on a consumer GPU in 30 seconds." This made consumer-grade image generation possible.','Text understanding comes from the text encoder (CLIP). The latent space is about image compression, not text.','The VAE decoder must run at inference to convert the final denoised latent back to pixels. Latent space is used for both training and inference.']},
  ]
},

{
  id:'clip', title:'CLIP + DALL-E', shortTitle:'CLIP & DALL-E', year:2021,
  authors:'Radford, Kim, Hallacy et al. · OpenAI',
  venue:'ICML 2021 / arXiv 2021', category:'Generative Models', prereqs:['diffusion','resnet'],
  icon:'🖼️', tagline:'Teaching machines to connect images and language',
  lesson:[
    {h:'The Problem: How Does a Model Know "Cat"?',body:`To generate an image from text, the model needs a shared representation space for images and language. Before CLIP, image models learned features from labeled image datasets (ImageNet: 1.2M labeled images, 1000 classes). But "cat" in ImageNet is different from "fluffy orange tabby cat in a space suit" — the rigid category doesn't capture the richness of language.

CLIP (Contrastive Language-Image Pre-Training) learns image-text alignment from 400 million image-text pairs scraped from the internet.`},
    {h:'Contrastive Training: Matching Pairs',body:`Training objective: given a batch of N (image, text) pairs, maximize similarity between matched pairs and minimize similarity between mismatched pairs.

For a batch of 32 pairs:
<ul>
<li>32 matched pairs (image of cat → text "a photo of a cat") → high cosine similarity</li>
<li>32×31 = 992 mismatched pairs → low cosine similarity</li>
</ul>
Two encoders trained jointly: an image encoder (ViT or ResNet) and a text encoder (transformer). Their outputs are projected into a shared 512-dimensional space.`,callout:`The result: an image of a cat and the text "a photo of a cat" map to nearly the same vector. This shared embedding space enables zero-shot image classification — no task-specific training needed.`},
    {h:'Zero-Shot Classification',body:`CLIP enables zero-shot image classification. To classify an image into 1000 ImageNet classes:
<ol>
<li>Encode the image</li>
<li>Encode 1000 text descriptions ("a photo of a {class}")</li>
<li>Find the text with highest cosine similarity to the image</li>
</ol>
CLIP achieves ~76% on ImageNet with zero training on ImageNet — matching a ResNet-50 trained specifically on 1.2M ImageNet images. The model "knows" ImageNet classes because they appeared in its internet training data.`},
    {h:'DALL-E and What CLIP Unlocked',body:`CLIP's shared embedding space is the "bridge" that makes text-to-image work. DALL-E 1 (2021) used a discrete VAE for images and a transformer trained to predict image tokens from text tokens. DALL-E 2 (2022) used CLIP embeddings as the conditioning signal for a diffusion model — first generate a CLIP image embedding from text (using a "prior" model), then decode that embedding to pixels using diffusion.

Every major image generation system uses CLIP or a CLIP-like model: Stable Diffusion, Midjourney, Adobe Firefly, Google Imagen.`,callout_green:`CLIP → zero-shot vision understanding → text-to-image conditioning → Stable Diffusion, DALL-E 2, Midjourney. Also: CLIP similarity is the metric used to evaluate image-text alignment in generation systems.`}
  ],
  questions:[
    {q:'What is "contrastive learning" as used in CLIP training?',
     opts:['Training on contrasting image styles (e.g., realistic vs. cartoon)','Maximizing cosine similarity between matched (image, text) pairs while minimizing similarity between all mismatched pairs in the same batch','A method that contrasts training and validation performance to detect overfitting','Training two separate models and comparing their outputs'],
     correct:1,
     explain:['Style contrast is an image editing concept. Contrastive learning in ML is specifically about learning embedding spaces through matched/unmatched pairs.',null,'For each batch, CLIP sees N matched pairs. It creates an N×N similarity matrix. The diagonal (matched pairs) should have high similarity; off-diagonal (any image with the wrong text) should have low similarity. The loss pushes matched pairs together and mismatched pairs apart in embedding space. After training on 400M pairs, the embedding space captures rich semantic relationships between images and text.',  'Contrastive learning has nothing to do with overfitting detection. It\'s a training objective for representation learning.','CLIP has two encoders (image + text), but contrastive learning is not about comparing two separate models. It\'s about learning a shared embedding space by comparing pairs.']},
    {q:'CLIP achieves ~76% zero-shot accuracy on ImageNet. Why is "zero-shot" significant here?',
     opts:['CLIP was trained on zero images — it\'s a language-only model','Zero-shot means no ImageNet training examples were seen during CLIP\'s training, yet it matches models specifically trained on ImageNet — demonstrating that internet-scale vision-language pre-training transfers to classification tasks','Zero-shot means CLIP uses zero GPU memory during classification','Zero-shot means CLIP makes zero mistakes on easy examples'],
     correct:1,
     explain:['CLIP trained on 400 million image-text pairs. It is an image+text model, not language-only.',null,'This is the key result. A ResNet-50 requires 1.2M labeled ImageNet images and specific ImageNet training to achieve ~76% accuracy. CLIP never saw a single ImageNet label — it only saw (image, alt-text) pairs from the internet. Yet it matches this performance by simply finding the most similar text description. This proves that web-scale multimodal pre-training produces transferable representations without task-specific labeled data.','GPU memory is not related to zero-shot. Zero-shot refers to zero task-specific training examples.','"Zero-shot" is a specific technical term meaning no training examples from the target task. It has nothing to do with error rates.']},
  ]
},

{
  id:'spark', title:'Apache Spark', shortTitle:'Spark', year:2012,
  authors:'Zaharia, Chowdhury, Das et al. · UC Berkeley AMP Lab',
  venue:'NSDI 2012 / OSDI 2012', category:'Data Systems', prereqs:[],
  icon:'⚡', tagline:'In-memory computing that replaced MapReduce',
  lesson:[
    {h:'Why MapReduce Was Slow',body:`Google\'s MapReduce (2004) writes intermediate results to disk between every stage. For a multi-step algorithm — say, 100 iterations of machine learning gradient descent — that means 200 disk reads and writes (one read + one write per iteration). Disk I/O is 100-1000× slower than RAM. Iterative ML on MapReduce was agonizingly slow.

Spark (2012, UC Berkeley) solved this with Resilient Distributed Datasets (RDDs) — distributed datasets that live in RAM across a cluster.`},
    {h:'RDDs and Lazy Evaluation',body:`An RDD is an immutable, partitioned collection of records distributed across a cluster. Operations on RDDs are:
<ul>
<li><strong>Transformations:</strong> map, filter, groupBy — lazy (not computed immediately, just recorded)</li>
<li><strong>Actions:</strong> count, collect, save — trigger actual computation</li>
</ul>
When you call .count(), Spark analyzes the full chain of transformations and creates an optimized execution plan. Intermediate results stay in memory between stages.`,callout:`Spark is 10-100× faster than MapReduce for iterative workloads (ML training, graph algorithms). On ML benchmarks in 2014, Spark sorted 100TB of data 3× faster than Hadoop MapReduce.`},
    {h:'The Databricks Story',body:`Matei Zaharia (Spark\'s creator) co-founded Databricks in 2013 to commercialize Spark. Databricks added:
<ul>
<li><strong>Delta Lake (2019):</strong> ACID transactions on top of data lakes (think: reliable Parquet files with versioning)</li>
<li><strong>MLflow (2018):</strong> Open-source ML lifecycle management (experiment tracking, model registry)</li>
<li><strong>Databricks SQL:</strong> Analytics SQL on the lakehouse</li>
<li><strong>Unity Catalog:</strong> Data governance layer</li>
</ul>`,callout_green:`Spark (2012, Berkeley) → Databricks ($62B valuation, 2024). One PhD student's PhD project became the largest data+AI company in the world. The "lakehouse" architecture Databricks invented is now the dominant data architecture.`}
  ],
  questions:[
    {q:'What is the fundamental performance advantage of Spark over MapReduce for iterative algorithms?',
     opts:['Spark uses more CPU cores than Hadoop MapReduce','Spark keeps intermediate results in memory (RAM) across iterations instead of writing to disk between every stage — eliminating the disk I/O bottleneck for iterative workloads','Spark uses a more efficient sorting algorithm','Spark requires less network bandwidth between machines'],
     correct:1,
     explain:['Both Spark and MapReduce use the same underlying cluster resources. Core count is determined by cluster configuration, not the framework.',null,'For an ML training loop of 100 iterations: MapReduce writes to disk after each map and reduce phase — 200+ disk operations. Disk access is 100-1000× slower than RAM access. Spark\'s RDDs persist in memory, so iteration 2 reads from RAM where iteration 1\'s results are cached. This 100-1000× speed difference is the entire reason Spark replaced MapReduce for ML workloads.','Both frameworks use similar sorting (external merge sort). The algorithm difference is not the performance bottleneck.','Network I/O (shuffle) is the same fundamental operation in both. The savings come from eliminating disk I/O between stages.']},
    {q:'What does "lazy evaluation" mean in Spark, and why is it beneficial?',
     opts:['Spark waits until you have collected enough data before starting a cluster','Transformations are recorded but not executed until an action is called — allowing Spark to optimize the entire computation plan before running','Lazy evaluation means Spark uses fewer CPU cycles by skipping unnecessary computations','It means Spark delays error messages to avoid interrupting workflows'],
     correct:1,
     explain:['Lazy evaluation has nothing to do with data collection thresholds. It\'s about when computation actually executes.',null,'When you chain df.filter(...).groupBy(...).agg(...), Spark doesn\'t execute each step immediately. It builds a directed acyclic graph (DAG) of the computation. When you call .show() or .write(), Spark analyzes the full DAG and applies optimizations: pushing filters before joins, combining operations, selecting efficient join strategies. This query optimization is what makes Spark SQL competitive with specialized query engines.','Lazy evaluation doesn\'t skip computations — it delays them to enable optimization. All necessary computations still run.','Errors are still raised when they occur during execution, not delayed intentionally. Lazy evaluation is about optimization, not error handling.']},
  ]
},

{
  id:'kafka', title:'Apache Kafka', shortTitle:'Kafka', year:2011,
  authors:'Kreps, Narkhede, Rao · LinkedIn',
  venue:'ACM SIGOPS 2011', category:'Data Systems', prereqs:[],
  icon:'📨', tagline:'Real-time data streaming at massive scale',
  lesson:[
    {h:'The Problem: Real-Time Data at LinkedIn',body:`LinkedIn in 2011 needed to move hundreds of millions of events per day between systems: page views, clicks, messages, connection requests — all in real-time. Traditional queuing systems (RabbitMQ, ActiveMQ) were slow and couldn\'t retain data for replay. Databases couldn\'t handle the write throughput.

Kafka was built as a distributed commit log — a data structure optimized for sequential writes and reads.`},
    {h:'The Log Abstraction',body:`Kafka\'s core abstraction is a log: an append-only, ordered sequence of records. Records are organized into topics and partitions. Producers append to the end. Consumers read from any offset.

Key properties:
<ul>
<li><strong>Retention:</strong> Data is stored for days/weeks, not deleted after consumption. Multiple consumers can read independently.</li>
<li><strong>Sequential I/O:</strong> Appending to a log is the fastest disk operation. Kafka achieves millions of writes/second.</li>
<li><strong>Distributed:</strong> Topics are partitioned across many brokers for horizontal scalability.</li>
</ul>`,callout:`The key insight: treating real-time event streams as a log (like a database write-ahead log) enables consumers to replay from any point — enabling exactly-once semantics, event replay for debugging, and decoupled producer-consumer architectures.`},
    {h:'Why Every AI System Needs Kafka',body:`Modern AI systems are event-driven:
<ul>
<li>User actions → feature store (Kafka ingests clicks, purchases in real-time)</li>
<li>Model predictions → downstream systems (Kafka distributes predictions)</li>
<li>Training data pipelines (Kafka streams new labeled examples to training jobs)</li>
</ul>
Kafka is in every major tech company\'s infrastructure stack — Netflix, Uber, Airbnb, LinkedIn, Twitter. Confluent (the commercial Kafka company) is valued at $9B. Apache Flink and Spark Streaming both consume from Kafka.`,callout_green:`Kafka → Confluent ($9B). The "real-time layer" of the modern data stack. Every ML feature store, online learning system, and recommendation engine runs on Kafka streams.`}
  ],
  questions:[
    {q:'What makes Kafka\'s log abstraction different from a traditional message queue?',
     opts:['Kafka is faster because it uses SSDs instead of spinning disks','In a traditional queue, messages are deleted after consumption. Kafka retains messages for days/weeks and allows multiple independent consumers to read from any offset — enabling replay, multiple consumers, and decoupled systems','Kafka only supports one producer per topic','Traditional queues support SQL; Kafka uses a proprietary query language'],
     correct:1,
     explain:['Both Kafka and traditional queues can use either SSDs or HDDs. The fundamental difference is the data model, not storage hardware.',null,'This is the architectural shift. In RabbitMQ-style queues, once a consumer reads a message, it\'s gone. In Kafka, the "consumer group offset" is just a pointer into an immutable log. You can reset it to the beginning, run multiple independent consumers at different offsets, and replay all events from any point. This makes Kafka suitable for stream processing, data pipeline fanout, and event sourcing in ways traditional queues are not.','Kafka supports arbitrarily many producers per topic. Producers just append records to partitions.',  'Kafka has a custom binary protocol for producers and consumers. SQL is not directly used in Kafka (though KSQL is a streaming SQL layer built on top).']},
    {q:'In an ML system, what role does Kafka typically play in the feature pipeline?',
     opts:['Kafka trains the ML model using streaming gradient descent','Kafka ingests real-time user events (clicks, purchases, searches) and makes them available to feature computation services, which update the feature store that the ML model reads from at serving time','Kafka stores the ML model weights for deployment','Kafka is only used for batch training, not real-time serving'],
     correct:1,
     explain:['Kafka is a data transport layer, not a compute layer. Model training happens in separate systems (PyTorch, TensorFlow) on data pulled from Kafka topics or derived feature stores.',null,'A user clicks on a product → the click event is published to Kafka → a stream processing job (Flink/Spark Streaming) consumes it → updates the user\'s real-time features (last 10 clicks, session duration) → writes to the feature store → the recommendation model reads these fresh features at serving time. Without Kafka, the feature pipeline would use polling or batch updates with minutes-old data.','Kafka transports model artifacts in some architectures, but this is not its primary role in ML systems. Model deployment typically uses dedicated systems (Seldon, BentoML, SageMaker endpoints).','Kafka is specifically designed for real-time streaming. Batch data is often loaded separately (from S3/GCS) into training pipelines. Kafka\'s value in ML is specifically the real-time, low-latency event stream.']},
  ]
},

{
  id:'ray', title:'Ray', shortTitle:'Ray', year:2018,
  authors:'Moritz, Nishihara, Wang, Tumanov, Liaw, Liang et al. · UC Berkeley',
  venue:'OSDI 2018', category:'Data Systems', prereqs:['spark'],
  icon:'☀️', tagline:'Distributed Python for AI workloads',
  lesson:[
    {h:'The Gap Spark Left',body:`Spark is excellent for data processing — SQL, ETL, batch ML. But it\'s not Python-native, struggles with arbitrary distributed tasks, and doesn\'t support heterogeneous compute (some workers need GPUs, some need CPUs, some need to hold state in memory for RL rollouts).

Ray (UC Berkeley, 2018) fills this gap: a general-purpose distributed computing framework that makes distributing arbitrary Python functions trivial.`},
    {h:'The Programming Model: Tasks and Actors',body:`Two primitives:
<ul>
<li><strong>@ray.remote function:</strong> A stateless task. Call it with .remote() and it runs on any worker in the cluster. ray.get() retrieves the result. Completely parallel with zero boilerplate.</li>
<li><strong>@ray.remote class (Actor):</strong> A stateful worker that persists state between calls. Used for parameter servers, RL environments, model replicas.</li>
</ul>`,callout:`The key: ray.remote turns any Python function into a distributed task with one decorator. No need to write serialization, network code, or job scheduling. This dramatically lowers the barrier to distributed ML.`},
    {h:'The Ray Ecosystem',body:`Ray is the base layer for a rich ecosystem:
<ul>
<li><strong>Ray Train:</strong> Distributed model training (PyTorch DDP on Ray)</li>
<li><strong>Ray Tune:</strong> Hyperparameter search across a cluster</li>
<li><strong>Ray Serve:</strong> Production model serving with autoscaling</li>
<li><strong>RLlib:</strong> Distributed reinforcement learning (the framework Waymo uses)</li>
<li><strong>Anyscale:</strong> The commercial Ray company, valued at $1B+</li>
</ul>`,callout_green:`Ray is the distributed computing backbone of most large-scale ML pipelines today. OpenAI uses Ray for training. Hugging Face uses it. Spotify, LinkedIn, and Amazon use it. Anyscale commercializes it at $1B+.`}
  ],
  questions:[
    {q:'What problem does Ray solve that Spark cannot?',
     opts:['Ray processes larger datasets than Spark','Ray enables arbitrary Python functions (including GPU-based deep learning, stateful RL environments, and heterogeneous compute) to be distributed with minimal boilerplate — Spark\'s model is optimized for data transformations, not general computation','Ray is faster for SQL queries','Ray is open-source; Spark requires a commercial license'],
     correct:1,
     explain:['Dataset size is determined by cluster size, not the framework. Both Ray and Spark can process petabyte-scale data.',null,'Spark\'s execution model is built around data transformations (DataFrame operations, RDD transformations). It cannot easily express "run a RL environment simulation with 1000 parallel workers where each worker maintains its own state" or "run hyperparameter search across 100 GPU training jobs with early stopping." Ray\'s actor model and remote functions handle these naturally with @ray.remote.','Ray does have a SQL component (Ray Datasets) but SQL performance is not Ray\'s differentiator.','Both Ray and Spark are Apache-licensed open-source projects. Databricks commercializes Spark; Anyscale commercializes Ray.']},
  ]
},
